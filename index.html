 <!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1117;
    color:white;
}

/* GİRİŞ */

#login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#1b2130;
    padding:30px 24px;
    border-radius:20px;
    text-align:center;
}

.logo{
    font-size:50px;
}

.login-box h1{
    margin:10px 0;
}

.subtitle{
    color:#9da7ba;
    margin-bottom:25px;
}

#usernameInput{
    width:100%;
    padding:15px;
    border:1px solid #343c4d;
    background:#11151e;
    color:white;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

#loginButton{
    width:100%;
    margin-top:12px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#4d8cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* SOHBET */

#chatPage{
    display:none;
    height:100vh;
    overflow:hidden;
}

.header{
    min-height:70px;
    background:#191e29;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 15px;
    border-bottom:1px solid #303746;
    gap:10px;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.online{
    color:#45e889;
    font-size:12px;
    margin-top:4px;
}

.online-users{
    color:#9da7ba;
    font-size:11px;
    margin-top:3px;
    max-width:500px;
}

.header-buttons{
    display:flex;
    align-items:center;
    gap:7px;
}

.logout{
    border:none;
    background:#292f3d;
    color:white;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
}

.voice-button{
    border:none;
    background:#45a86b;
    color:white;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.voice-button.active{
    background:#d9534f;
}

/* MESAJLAR */

.chat{
    height:calc(100vh - 135px);
    overflow-y:auto;
    padding:18px 14px;
    max-width:800px;
    margin:auto;
}

.message{
    margin-bottom:16px;
}

.username{
    color:#62b0ff;
    font-size:13px;
    font-weight:bold;
    margin-bottom:4px;
}

.time{
    color:#8b93a3;
    font-size:10px;
    margin-left:6px;
}

.bubble{
    display:inline-block;
    max-width:85%;
    background:#202633;
    padding:11px 13px;
    border-radius:5px 14px 14px 14px;
    word-wrap:break-word;
}

.my-message{
    text-align:right;
}

.my-message .username{
    color:#70e6a0;
}

.my-message .bubble{
    background:#315b9f;
    border-radius:14px 5px 14px 14px;
}

.delete{
    border:0;
    background:transparent;
    color:#ff7070;
    font-size:11px;
    cursor:pointer;
    margin-left:7px;
}

/* MESAJ GİRİŞİ */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#191e29;
    border-top:1px solid #303746;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
}

.message-input{
    flex:1;
    height:42px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#272e3b;
    color:white;
    padding:0 12px;
    font-size:15px;
}

.send{
    width:45px;
    height:42px;
    border:none;
    background:#4d8cff;
    color:white;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

/* SES DURUMU */

#voiceStatus{
    display:none;
    position:fixed;
    bottom:75px;
    left:50%;
    transform:translateX(-50%);
    background:#202633;
    color:#fff;
    padding:10px 16px;
    border-radius:20px;
    font-size:13px;
    z-index:20;
}

@media(max-width:600px){

    .header{
        padding:8px;
    }

    .header-title{
        font-size:15px;
    }

    .voice-button,
    .logout{
        padding:8px;
        font-size:11px;
    }

    .online-users{
        max-width:220px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

}

@media(min-width:700px){

    .input-area{
        max-width:800px;
        left:50%;
        transform:translateX(-50%);
    }

}

</style>

</head>

<body>


<!-- GİRİŞ -->

<div id="login">

    <div class="login-box">

        <div class="logo">
            💬
        </div>

        <h1>
            Ritmix Sohbet
        </h1>

        <div class="subtitle">
            Sohbete katılmak için kullanıcı adını yaz
        </div>

        <input
            id="usernameInput"
            maxlength="20"
            placeholder="Kullanıcı adın..."
            autocomplete="off"
        >

        <button id="loginButton">
            SOHBETE GİR
        </button>

    </div>

</div>


<!-- SOHBET -->

<div id="chatPage">

    <div class="header">

        <div>

            <div class="header-title">
                💬 Ritmix Sohbet
            </div>

            <div
                class="online"
                id="onlineText"
            >
                🟢 0 kişi çevrimiçi
            </div>

            <div
                class="online-users"
                id="onlineUsersText"
            >
                👥 Kimse yok
            </div>

        </div>


        <div class="header-buttons">

            <button
                class="voice-button"
                id="voiceButton"
            >
                🎤 Sesli Sohbet
            </button>

            <button
                class="logout"
                id="logoutButton"
            >
                Çıkış
            </button>

        </div>

    </div>


    <div
        class="chat"
        id="chat"
    ></div>


    <div class="input-area">

        <input
            class="message-input"
            id="messageInput"
            placeholder="Mesaj yaz..."
            autocomplete="off"
        >

        <button
            class="send"
            id="sendButton"
        >
            ➤
        </button>

    </div>

</div>


<div id="voiceStatus">
    🎤 Sesli bağlantı hazırlanıyor...
</div>


<audio
    id="remoteAudio"
    autoplay
    playsinline
></audio>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",

    authDomain:
    "papatyawap.firebaseapp.com",

    databaseURL:databaseURL:

     databaseURL:
 
     databaseURL:
"https://papatyawap-default-rtdb.firebaseio.com",
    projectId:
    "papatyawap",

    storageBucket:
    "papatyawap.firebasestorage.app",

    messagingSenderId:
    "29357315689",

    appId:
    "1:29357315689:web:78864218c204d291f734f8"

};


firebase.initializeApp(firebaseConfig);

const database =
    firebase.database();


/* =========================
   DEĞİŞKENLER
========================= */

let username = "";

let userKey = "";

let localStream = null;

let peerConnections = {};

let voiceActive = false;

let voiceListenerStarted = false;


/* WEBRTC */

const rtcConfig = {

    iceServers:[
        {
            urls:"stun:stun.l.google.com:19302"
        },
        {
            urls:"stun:stun1.l.google.com:19302"
        }
    ]

};


/* =========================
   GİRİŞ
========================= */

function enterChat(){

    const input =
        document.getElementById(
            "usernameInput"
        );

    const name =
        input.value.trim();


    if(!name){

        alert(
            "Lütfen kullanıcı adını yaz."
        );

        input.focus();

        return;

    }


    username =
        name;


    document.getElementById(
        "login"
    ).style.display =
        "none";


    document.getElementById(
        "chatPage"
    ).style.display =
        "block";


    loadMessages();

    setOnline();

}


document.getElementById(
    "loginButton"
).onclick =
    enterChat;


document.getElementById(
    "usernameInput"
).onkeydown =
function(event){

    if(event.key === "Enter"){

        enterChat();

    }

};


/* =========================
   MESAJLAR
========================= */

function loadMessages(){

    database
    .ref("messages")
    .on(
        "value",
        function(snapshot){

            const chat =
                document.getElementById(
                    "chat"
                );


            chat.innerHTML = "";


            snapshot.forEach(
                function(child){

                    const message =
                        child.val();


                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "message";


                    if(
                        message.username
                        === username
                    ){

                        box.classList.add(
                            "my-message"
                        );

                    }


                    const user =
                        document.createElement(
                            "div"
                        );


                    user.className =
                        "username";


                    user.textContent =
                        message.username;


                    if(message.timestamp){

                        const time =
                            document.createElement(
                                "span"
                            );


                        time.className =
                            "time";


                        time.textContent =
                            new Date(
                                message.timestamp
                            ).toLocaleTimeString(
                                "tr-TR",
                                {
                                    hour:"2-digit",
                                    minute:"2-digit"
                                }
                            );


                        user.appendChild(
                            time
                        );

                    }


                    if(
                        message.username
                        === username
                    ){

                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.className =
                            "delete";


                        deleteButton.textContent =
                            "Sil";


                        deleteButton.onclick =
                        function(){

                            child.ref.remove();

                        };


                        user.appendChild(
                            deleteButton
                        );

                    }


                    const bubble =
                        document.createElement(
                            "div"
                        );


                    bubble.className =
                        "bubble";


                    bubble.textContent =
                        message.text;


                    box.appendChild(
                        user
                    );


                    box.appendChild(
                        bubble
                    );


                    chat.appendChild(
                        box
                    );

                }
            );


            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* =========================
   MESAJ GÖNDER
========================= */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(
        !text ||
        !username
    ){

        return;

    }


    database
    .ref("messages")
    .push({

        username:
            username,

        text:
            text,

        timestamp:
            Date.now()

    });


    input.value = "";

    input.focus();

}


document.getElementById(
    "sendButton"
).onclick =
    sendMessage;


document.getElementById(
    "messageInput"
).onkeydown =
function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

};


/* =========================
   ÇEVRİMİÇİ
========================= */

function setOnline(){

    const ref =
        database
        .ref("onlineUsers")
        .push();


    userKey =
        ref.key;


    ref.set({

        username:
            username,

        timestamp:
            firebase.database.ServerValue.TIMESTAMP

    });


    ref.onDisconnect().remove();


    database
    .ref("onlineUsers")
    .on(
        "value",
        function(snapshot){

            const count =
                snapshot.numChildren();


            document.getElementById(
                "onlineText"
            ).textContent =
                "🟢 " +
                count +
                " kişi çevrimiçi";


            const names = [];


            snapshot.forEach(
                function(child){

                    const user =
                        child.val();


                    if(
                        user &&
                        user.username
                    ){

                        names.push(
                            user.username
                        );

                    }

                }
            );


            document.getElementById(
                "onlineUsersText"
            ).textContent =
                names.length
                ?
                "👥 " +
                names.join(", ")
                :
                "👥 Kimse yok";

        }
    );

}


/* =========================
   SESLİ SOHBET
========================= */

function showVoiceStatus(text){

    const status =
        document.getElementById(
            "voiceStatus"
        );


    status.textContent =
        text;


    status.style.display =
        "block";

}


function hideVoiceStatus(){

    document.getElementById(
        "voiceStatus"
    ).style.display =
        "none";

}


/* MİKROFONU AÇ */

async function startVoiceChat(){

    try{

        showVoiceStatus(
            "🎤 Mikrofon açılıyor..."
        );


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:true,

                video:false

            });


        voiceActive =
            true;


        const button =
            document.getElementById(
                "voiceButton"
            );


        button.textContent =
            "🔴 Sesi Kapat";


        button.classList.add(
            "active"
        );


        startVoiceListener();


        showVoiceStatus(
            "🎤 Sesli sohbet aktif"
        );


        /* MEVCUT ÇAĞRILARI KONTROL ET */

        const callsSnapshot =
            await database
            .ref("calls")
            .once("value");


        let foundCall =
            false;


        callsSnapshot.forEach(
            function(child){

                const call =
                    child.val();


                if(
                    call &&
                    call.receiver === username
                ){

                    foundCall =
                        true;


                    answerCall(
                        child.key,
                        call
                    );

                }

            }
        );


        /* BAŞKA KULLANICI VARSA ÇAĞRI BAŞLAT */

        if(!foundCall){

            await createCall();

        }

    }
    catch(error){

        console.error(
            "Mikrofon hatası:",
            error
        );


        alert(
            "Mikrofon açılamadı:\n\n" +
            error.name +
            "\n" +
            error.message
        );

    }

}


/* SES BUTONU */

document.getElementById(
    "voiceButton"
).onclick =
async function(){

    if(voiceActive){

        stopVoiceChat();

    }
    else{

        await startVoiceChat();

    }

};


/* =========================
   ÇAĞRI DİNLE
========================= */

function startVoiceListener(){

    if(voiceListenerStarted){

        return;

    }


    voiceListenerStarted =
        true;


    database
    .ref("calls")
    .on(
        "child_added",
        async function(snapshot){

            const call =
                snapshot.val();


            const callId =
                snapshot.key;


            if(!call){

                return;

            }


            if(
                call.caller === username
            ){

                return;

            }


            if(
                call.receiver !== username
            ){

                return;

            }


            if(
                peerConnections[callId]
            ){

                return;

            }


            if(!voiceActive){

                return;

            }


            await answerCall(
                callId,
                call
            );

        }
    );

}


/* =========================
   ÇAĞRI BAŞLAT
========================= */

async function createCall(){

    if(!localStream){

        return;

    }


    const usersSnapshot =
        await database
        .ref("onlineUsers")
        .once("value");


    let otherUser =
        null;


    usersSnapshot.forEach(
        function(child){

            const user =
                child.val();


            if(
                user &&
                user.username &&
                user.username !== username &&
                !otherUser
            ){

                otherUser =
                    user.username;

            }

        }
    );


    if(!otherUser){

        showVoiceStatus(
            "🎤 Mikrofon açık - başka kullanıcı bekleniyor"
        );

        return;

    }


    const callRef =
        database
        .ref("calls")
        .push();


    const callId =
        callRef.key;


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(
        function(track){

            pc.addTrack(
                track,
                localStream
            );

        }
    );


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(
            function(error){

                console.log(
                    "Audio play:",
                    error
                );

            }
        );


        showVoiceStatus(
            "🔊 Ses bağlantısı kuruldu"
        );

    };


    pc.onicecandidate =
    function(event){

        if(
            event.candidate
        ){

            database
            .ref(
                "calls/" +
                callId +
                "/callerCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    const offer =
        await pc.createOffer();


    await pc.setLocalDescription(
        offer
    );


    await callRef.set({

        caller:
            username,

        receiver:
            otherUser,

        offer:{

            type:
                offer.type,

            sdp:
                offer.sdp

        },

        created:
            Date.now()

    });


    database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .on(
        "value",
        async function(snapshot){

            const answer =
                snapshot.val();


            if(
                answer &&
                !pc.currentRemoteDescription
            ){

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        answer
                    )
                );

            }

        }
    );


    database
    .ref(
        "calls/" +
        callId +
        "/receiverCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }
                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =========================
   ÇAĞRIYI CEVAPLA
========================= */

async function answerCall(
    callId,
    call
){

    if(
        !localStream ||
        !voiceActive
    ){

        return;

    }


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(
        function(track){

            pc.addTrack(
                track,
                localStream
            );

        }
    );


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(
            function(error){

                console.log(
                    error
                );

            }
        );


        showVoiceStatus(
            "🔊 Ses bağlantısı kuruldu"
        );

    };


    pc.onicecandidate =
    function(event){

        if(
            event.candidate
        ){

            database
            .ref(
                "calls/" +
                callId +
                "/receiverCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    await pc.setRemoteDescription(
        new RTCSessionDescription(
            call.offer
        )
    );


    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    await database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .set({

        type:
            answer.type,

        sdp:
            answer.sdp

    });


    database
    .ref(
        "calls/" +
        callId +
        "/callerCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }
                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =========================
   SESLİ SOHBETİ KAPAT
========================= */

function stopVoiceChat(){

    voiceActive =
        false;


    if(localStream){

        localStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


        localStream =
            null;

    }


    Object.keys(
        peerConnections
    ).forEach(
        function(id){

            try{

                peerConnections[id].close();

            }
            catch(error){

                console.log(error);

            }

        }
    );


    peerConnections = {};


    const audio =
        document.getElementById(
            "remoteAudio"
        );


    audio.srcObject =
        null;


    const button =
        document.getElementById(
            "voiceButton"
        );


    button.textContent =
        "🎤 Sesli Sohbet";


    button.classList.remove(
        "active"
    );


    hideVoiceStatus();


    /* KENDİ ÇAĞRILARIMIZI TEMİZLE */

    database
    .ref("calls")
    .once(
        "value",
        function(snapshot){

            snapshot.forEach(
                function(child){

                    const call =
                        child.val();


                    if(
                        call &&
                        (
                            call.caller === username ||
                            call.receiver === username
                        )
                    ){

                        child.ref.remove();

                    }

                }
            );

        }
    );

}


/* =========================
   ÇIKIŞ
========================= */

document.getElementById(
    "logoutButton"
).onclick =
function(){

    stopVoiceChat();


    if(userKey){

        database
        .ref(
            "onlineUsers/" +
            userKey
        )
        .remove();

    }


    location.reload();

};

</script>

</body>

</html>
