async function searchGIFs() {

    const query =
        gifSearchInput.value.trim();

    if (!query) {

        gifResults.innerHTML =
            '<div class="gif-empty">🔎 Önce GIF adı yazın</div>';

        return;

    }

    gifResults.innerHTML =
        '<div class="gif-empty">⏳ GIF aranıyor...</div>';

    try {

        const url =
            "https://api.giphy.com/v1/gifs/search" +
            "?api_key=" +
            encodeURIComponent(
                GIPHY_API_KEY
            ) +
            "&q=" +
            encodeURIComponent(
                query
            ) +
            "&limit=24" +
            "&rating=pg-13" +
            "&lang=tr";

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if (
            !data ||
            !data.data ||
            data.data.length === 0
        ) {

            gifResults.innerHTML =
                '<div class="gif-empty">😔 GIF bulunamadı</div>';

            return;

        }

        gifResults.innerHTML = "";

        data.data.forEach(
            function(gif) {

                const images =
                    gif.images || {};

                const previewUrl =
                    images.fixed_width?.webp ||
                    images.fixed_width?.url ||
                    images.preview_gif?.url ||
                    images.original?.url;

                const originalUrl =
                    images.original?.url ||
                    previewUrl;

                if (!previewUrl) {
                    return;
                }

                const image =
                    document.createElement(
                        "img"
                    );

                image.className =
                    "gif-result";

                image.src =
                    previewUrl;

                image.alt =
                    gif.title || "GIF";

                image.loading =
                    "lazy";

                image.onclick =
                    function() {

                        sendGIF(
                            previewUrl,
                            originalUrl
                        );

                        gifPanel.style.display =
                            "none";

                    };

                gifResults.appendChild(
                    image
                );

            }
        );

    }

    catch(error) {

        console.error(
            "GIPHY hatası:",
            error
        );

        gifResults.innerHTML =
            '<div class="gif-empty">❌ GIF yüklenemedi.</div>';

    }

}

function loadMessages() {

    database
        .ref("messages")
        .on(
            "value",
            function(snapshot) {

                const chat =
                    document.getElementById(
                        "chat"
                    );

                chat.innerHTML =
                    "";

                snapshot.forEach(
                    function(child) {

                        const message =
                            child.val();

                        if (!message) {
                            return;
                        }

                        const box =
                            document.createElement(
                                "div"
                            );

                        box.className =
                            "message";


                        if (
                            message.username ===
                            username
                        ) {

                            box.classList.add(
                                "my-message"
                            );

                        }


                        /* KULLANICI */

                        const user =
                            document.createElement(
                                "div"
                            );

                        user.className =
                            "username";

                        user.textContent =
                            message.username;


                        /* SAAT */

                        if (
                            message.timestamp
                        ) {

                            const time =
                                document.createElement(
                                    "span"
                                );

                            time.className =
                                "time";

                            time.textContent =
                                new Date(
                                    message.timestamp
                                ).toLocaleTimeString(
                                    "tr-TR",
                                    {
                                        hour:
                                            "2-digit",

                                        minute:
                                            "2-digit"
                                    }
                                );

                            user.appendChild(
                                time
                            );

                        }


                        /* SİL */

                        if (
                            message.username ===
                            username
                        ) {

                            const deleteButton =
                                document.createElement(
                                    "button"
                                );

                            deleteButton.className =
                                "delete";

                            deleteButton.textContent =
                                "Sil";

                            deleteButton.onclick =
                                function() {

                                    child.ref
                                        .remove();

                                };

                            user.appendChild(
                                deleteButton
                            );

                        }


                        /* GIF */

                        if (
                            message.type ===
                                "gif" &&
                            message.gif
                        ) {

                            const gifBox =
                                document.createElement(
                                    "div"
                                );

                            gifBox.className =
                                "gif-message";


                            const gifImage =
                                document.createElement(
                                    "img"
                                );

                            gifImage.src =
                                message.preview ||
                                message.gif;

                            gifImage.alt =
                                "GIF";


                            gifImage.onclick =
                                function() {

                                    window.open(
                                        message.gif,
                                        "_blank"
                                    );

                                };


                            gifBox.appendChild(
                                gifImage
                            );

                            box.appendChild(
                                user
                            );

                            box.appendChild(
                                gifBox
                            );

                            chat.appendChild(
                                box
                            );

                            return;

                        }


                        /* NORMAL MESAJ */

                        const bubble =
                            document.createElement(
                                "div"
                            );

                        bubble.className =
                            "bubble";

                        bubble.textContent =
                            message.text || "";


                        if (
                            message.color
                        ) {

                            bubble.style.color =
                                message.color;

                        }


                        box.appendChild(
                            user
                        );

                        box.appendChild(
                            bubble
                        );

                        chat.appendChild(
                            box
                        );

                    }
                );


                chat.scrollTop =
                    chat.scrollHeight;

            }
        );

}

function setOnline() {

    const ref =
        database
            .ref("onlineUsers")
            .push();

    userKey =
        ref.key;


    ref.set({

        username:
            username,

        timestamp:
            firebase.database
                .ServerValue
                .TIMESTAMP

    });


    ref.onDisconnect()
        .remove();


    database
        .ref("onlineUsers")
        .on(
            "value",
            function(snapshot) {

                const count =
                    snapshot.numChildren();

                document.getElementById(
                    "onlineText"
                ).textContent =
                    "🟢 " +
                    count +
                    " kişi çevrimiçi";


                const names = [];


                snapshot.forEach(
                    function(child) {

                        const user =
                            child.val();

                        if (
                            user &&
                            user.username
                        ) {

                            names.push(
                                user.username
                            );

                        }

                    }
                );


                document.getElementById(
                    "onlineUsersText"
                ).textContent =
                    names.length
                        ? "👥 " +
                          names.join(", ")
                        : "👥 Kimse yok";

            }
        );

}
