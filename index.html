   MESAJLARI YÜKLE
========================= */

function loadMessages(){

    database
    .ref("messages")
    .on(
        "value",
        function(snapshot){

            const chat =
                document.getElementById(
                    "chat"
                );


            chat.innerHTML = "";


            snapshot.forEach(
                function(child){

                    const message =
                        child.val();


                    if(!message){
                        return;
                    }


                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "message";


                    if(
                        message.username
                        === username
                    ){

                        box.classList.add(
                            "my-message"
                        );

                    }


                    /* KULLANICI */

                    const user =
                        document.createElement(
                            "div"
                        );


                    user.className =
                        "username";


                    user.textContent =
                        message.username;


                    /* SAAT */

                    if(message.timestamp){

                        const time =
                            document.createElement(
                                "span"
                            );


                        time.className =
                            "time";


                        time.textContent =
                            new Date(
                                message.timestamp
                            ).toLocaleTimeString(
                                "tr-TR",
                                {
                                    hour:"2-digit",
                                    minute:"2-digit"
                                }
                            );


                        user.appendChild(
                            time
                        );

                    }


                    /* SİL */

                    if(
                        message.username
                        === username
                    ){

                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.className =
                            "delete";


                        deleteButton.textContent =
                            "Sil";


                        deleteButton.onclick =
                        function(){

                            child.ref.remove();

                        };


                        user.appendChild(
                            deleteButton
                        );

                    }


                    /* MESAJ BALONU */

                    const bubble =
                        document.createElement(
                            "div"
                        );


                    bubble.className =
                        "bubble";


                    /* NORMAL MESAJ */

                    if(
                        message.type !== "gif"
                    ){

                        bubble.textContent =
                            message.text || "";

                    }


                    /* GIF MESAJ */

                    if(
                        message.type === "gif" &&
                        message.gif
                    ){

                        const image =
                            document.createElement(
                                "img"
                            );


                        image.src =
                            message.gif;


                        image.className =
                            "message-gif";


                        image.alt =
                            "GIF";


                        bubble.appendChild(
                            image
                        );

                    }


                    /* RENK */

                    if(message.color){

                        bubble.style.color =
                            message.color;

                    }


                    box.appendChild(
                        user
                    );

                    box.appendChild(
                        bubble
                    );

                    chat.appendChild(
                        box
                    );

                }
            );


            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}

function setOnline(){

    const ref =
        database
        .ref("onlineUsers")
        .push();


    userKey =
        ref.key;


    ref.set({

        username:
            username,

        timestamp:
            firebase.database.ServerValue.TIMESTAMP

    });


    ref.onDisconnect().remove();


    database
    .ref("onlineUsers")
    .on(
        "value",
        function(snapshot){

            const count =
                snapshot.numChildren();


            document.getElementById(
                "onlineText"
            ).textContent =
                "🟢 " +
                count +
                " kişi çevrimiçi";


            const names = [];


            snapshot.forEach(
                function(child){

                    const user =
                        child.val();


                    if(
                        user &&
                        user.username
                    ){

                        names.push(
                            user.username
                        );

                    }

                }
            );


            document.getElementById(
                "onlineUsersText"
            ).textContent =
                names.length
                ?
                "👥 " +
                names.join(", ")
                :
                "👥 Kimse yok";

        }
    );

}
