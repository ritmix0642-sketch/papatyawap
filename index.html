html,body{

body{

========================= */

#login{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#f5f2eb;
}

.login-box{
    width:100%;
    max-width:420px;
    padding:38px 28px;
    text-align:center;
    background:#fffdf7;
    border:1px solid #e5dfd2;
    border-radius:24px;
    box-shadow:0 15px 45px rgba(0,0,0,.10);
}

.login-box h1{
    margin:0;
    font-size:28px;
}

.subtitle{
    margin:10px 0 28px;
    color:#77736b;
    font-size:14px;
}

#usernameInput{
    width:100%;
    height:52px;
    padding:0 17px;
    border:1px solid #d8d3c8;
    border-radius:15px;

#loginButton{

    border:0;
    border-radius:15px;
    background:#333;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   SOHBET SAYFASI
========================= */

#chatPage{
    display:none;
    width:100%;
    height:100vh;
    overflow:hidden;
    position:relative;
    background:#f5f2eb;
}

========================= */

.header{
    position:relative;
    z-index:20;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:10px 18px;
    background:#fffdf7;
    border-bottom:1px solid #ded9cf;
}

.header-info{
    min-width:0;
    flex:1;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.online{
    margin-top:5px;
    color:#159957;
    font-size:12px;
}

.online-users{
    margin-top:4px;
    color:#77736b;
    font-size:11px;
    max-width:600px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-buttons{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
}

.logout,
.voice-button{
    min-height:40px;
    border:1px solid #d8d3c8;
    padding:9px 13px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    white-space:nowrap;
}

.logout{
    background:#eeeae1;
}

.voice-button{
    background:#d9f4e5;
    color:#08783f;
    border-color:#b7dfc8;
}

.voice-button.active{
    background:#ffe0e3;
    color:#c72f42;
    border-color:#f1b7bf;
}

/* =========================
   MESAJ ALANI
========================= */

   Alt panel mesajların üzerine binmesin diye
   chat alanının altında ekstra boşluk bırakıyoruz.
*/

.chat{
    position:absolute;
    top:76px;
    left:0;
    right:0;
    bottom:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:25px 16px 170px;

    max-width:850px;
    width:100%;
    margin:auto;

    scroll-behavior:smooth;

    -webkit-overflow-scrolling:touch;
}

/* =========================
   MESAJ
========================= */

.message{
    margin-bottom:18px;
    width:100%;
}

.username{
    margin-bottom:4px;
    color:#2878d4;
    font-size:12px;
    font-weight:bold;
}

.my-message{
    text-align:right;
}

.my-message .username{
    color:#159957;
}

.time{
    margin-left:7px;
    color:#8c877d;
    font-size:10px;
}

.delete{
    border:0;
    background:transparent;
    color:#e34b5f;
    font-size:10px;
    cursor:pointer;
    margin-left:7px;
}

.bubble{
    display:block;
    max-width:100%;
    padding:0;
    margin:0;
    background:transparent;
    border:0;
    line-height:1.55;
    word-break:break-word;
    overflow-wrap:anywhere;
    color:#333333;
}

/* =========================
   RESİM
========================= */

.image-message{
    display:inline-block;
    max-width:100%;
    margin-top:5px;
}

.image-message img{
    display:block;

       Artık küçük ekranda 250px ile sınırlanmıyor.
       Ekrana sığdığı kadar büyüyebiliyor.

    max-width:min(100%,650px);
    max-height:600px;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:12px;
    cursor:pointer;
}

/* =========================
   GIF
========================= */

.gif-message{
    max-width:min(100%,400px);
    display:inline-block;
    margin-top:5px;
    overflow:hidden;
}

.gif-message img{
    width:100%;
    max-width:400px;
    max-height:600px;
    object-fit:contain;
    border-radius:15px;
    display:block;
    cursor:pointer;
}

/* =========================
   ALT PANEL
========================= */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;

    height:108px;
    min-height:108px;

    padding:
        8px
        max(10px,env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        max(10px,env(safe-area-inset-left));

    border-top:1px solid #ded9cf;

    z-index:25;
}

   ARAÇLAR

.tools-row{

    gap:7px;
    margin-bottom:7px;
    min-height:38px;
}

.tool-button{
    width:42px;

    border-radius:10px;

    color:#333;

    font-size:19px;
    cursor:pointer;
}

.gif-button{
    font-size:13px;

}

.image-button{
    font-size:20px;
}

#imageInput{
    display:none;
}

.color-label{
    color:#77736b;
    font-size:11px;

.color-buttons{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
}

.color-button{
    width:21px;
    height:21px;

    flex-shrink:0;
    padding:0;

.color-button.selected{

}

.color-white{background:#333333;}
.color-pink{background:#ff69b4;}
.color-blue{background:#2878d4;}
.color-green{background:#159957;}
.color-yellow{background:#c99400;}
.color-red{background:#e34b5f;}

.message-row{

.message-input{

    width:100%;

.emoji-panel{

    left:10px;

    width:300px;
    max-height:240px;

    overflow-y:auto;

    padding:12px;

    background:#fffdf7;
    border:1px solid #d8d3c8;
    border-radius:18px;

    box-shadow:0 15px 45px rgba(0,0,0,.20);

    z-index:40;
}

.emoji-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:7px;
}

.emoji-item{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    border-radius:8px;
    padding:4px;
}

/* =========================
   GIF PANEL
========================= */

.gif-panel{
    display:none;

    position:fixed;

    bottom:114px;
    left:60px;

    width:350px;
    max-width:calc(100vw - 20px);

    height:430px;

.gif-search{

    gap:7px;
    padding:10px;

.gif-search input{

    height:40px;

    border-radius:10px;

    width:45px;

    border-radius:10px;
    background:#333;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.gif-results{
    height:350px;
    overflow-y:auto;

    padding:10px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.gif-result{
    width:100%;
    height:120px;

    object-fit:cover;

    border-radius:10px;

    cursor:pointer;

    background:#eeeae1;
}

.gif-empty{
    grid-column:1/-1;
    text-align:center;
    padding:30px 10px;
    color:#77736b;
    font-size:13px;
}

/* =========================
   SES DURUMU
========================= */

#voiceStatus{
    display:none;

    position:fixed;

    bottom:120px;
    left:50%;

    background:#fffdf7;

async function searchGIFs(){

    const query =
        gifSearchInput.value.trim();


    if(!query){

        gifResults.innerHTML =
            '<div class="gif-empty">🔎 Önce GIF adı yazın</div>';

        return;

    }


    gifResults.innerHTML =
        '<div class="gif-empty">⏳ GIF aranıyor...</div>';


    try{

        const url =
            "https://api.giphy.com/v1/gifs/search" +
            "?api_key=" +
            encodeURIComponent(
                GIPHY_API_KEY
            ) +
            "&q=" +
            encodeURIComponent(
                query
            ) +
            "&limit=24" +
            "&rating=pg-13" +
            "&lang=tr";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.data ||
            data.data.length === 0
        ){

            gifResults.innerHTML =
                '<div class="gif-empty">😔 GIF bulunamadı</div>';

            return;

        }


        gifResults.innerHTML = "";


        data.data.forEach(
        function(gif){

            const images =
                gif.images || {};


            const previewUrl =
                images.fixed_width?.webp ||
                images.fixed_width?.url ||
                images.preview_gif?.url ||
                images.original?.url;


            const originalUrl =
                images.original?.url ||
                previewUrl;


            if(!previewUrl){

                return;

            }


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "gif-result";


            image.src =
                previewUrl;


            image.alt =
                gif.title ||
                "GIF";


            image.loading =
                "lazy";


            image.onclick =
            function(){

                sendGIF(
                    previewUrl,
                    originalUrl
                );

                gifPanel.style.display =
                    "none";

            };


            gifResults.appendChild(
                image
            );

        });

    }

    catch(error){

        console.error(
            "GIPHY hatası:",
            error
        );

        gifResults.innerHTML =
            '<div class="gif-empty">❌ GIF yüklenemedi.</div>';

    }

}

/* =========================================================

========================================================= */

function loadMessages(){

    database
    .ref("messages")
    .on(
        "value",
        function(snapshot){

            const chat =
                document.getElementById(
                    "chat"
                );


            chat.innerHTML = "";


            snapshot.forEach(
            function(child){

                const message =
                    child.val();


                if(!message){

                    return;

                }


                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "message";


                if(
                    message.username ===
                    username
                ){

                    box.classList.add(
                        "my-message"
                    );

                }


                /* KULLANICI ADI */

                const user =
                    document.createElement(
                        "div"
                    );


                user.className =
                    "username";


                user.textContent =
                    message.username ||
                    "Kullanıcı";


                /* SAAT */

                if(message.timestamp){

                    const time =
                        document.createElement(
                            "span"
                        );


                    time.className =
                        "time";


                    time.textContent =
                        new Date(
                            message.timestamp
                        ).toLocaleTimeString(
                            "tr-TR",
                            {
                                hour:
                                    "2-digit",

                                minute:
                                    "2-digit"
                            }
                        );


                    user.appendChild(
                        time
                    );

                }


                /* SİL */

                if(
                    message.username ===
                    username
                ){

                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.className =
                        "delete";


                    deleteButton.textContent =
                        "Sil";


                    deleteButton.onclick =
                    function(){

                        if(
                            confirm(
                                "Bu mesajı silmek istiyor musunuz?"
                            )
                        ){

                            child.ref.remove();

                        }

                    };


                    user.appendChild(
                        deleteButton
                    );

                }


                /* =========================
                   GIPHY GIF
                ========================= */

                if(
                    message.type === "gif" &&
                    message.gif
                ){

                    const gifBox =
                        document.createElement(
                            "div"
                        );


                    gifBox.className =
                        "gif-message";


                    const gifImage =
                        document.createElement(
                            "img"
                        );


                    /*
                       preview veya original
                       kullanılıyor.

                       GIPHY'nin GIF adresi
                       hareketli kalır.
                    */

                    gifImage.src =
                        message.gif;


                    gifImage.alt =
                        "GIF";


                    gifImage.onclick =
                    function(){

                        window.open(
                            message.gif,
                            "_blank"
                        );

                    };


                    gifBox.appendChild(
                        gifImage
                    );


                    box.appendChild(
                        user
                    );


                    box.appendChild(
                        gifBox
                    );


                    chat.appendChild(
                        box
                    );


                    return;

                }


                /* =========================
                   CİHAZDAN RESİM / GIF
                ========================= */

                if(
                    message.type === "image" &&
                    message.image
                ){

                    const imageBox =
                        document.createElement(
                            "div"
                        );


                    imageBox.className =
                        "image-message";


                    const image =
                        document.createElement(
                            "img"
                        );


                    /*
                       data:image/gif;base64...
                       olduğu için GIF animasyonu
                       korunur.
                    */

                    image.src =
                        message.image;


                    image.alt =
                        message.filename ||
                        "Resim";


                    image.loading =
                        "lazy";


                    image.onclick =
                    function(){

                        const newWindow =
                            window.open();


                        if(newWindow){

                            newWindow.document.write(
                                '<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;">' +
                                '<img src="' +
                                message.image +
                                '" style="max-width:100%;max-height:100vh;width:auto;height:auto;">' +
                                '</body></html>'
                            );

                            newWindow.document.close();

                        }

                    };


                    imageBox.appendChild(
                        image
                    );


                    box.appendChild(
                        user
                    );


                    box.appendChild(
                        imageBox
                    );


                    chat.appendChild(
                        box
                    );


                    /*
                       GIF/resim boyutu belli olduktan
                       sonra aşağı kaydır.
                    */

                    image.onload =
                    function(){

                        scrollChatToBottom();

                    };


                    return;

                }


                /* =========================
                   NORMAL MESAJ
                ========================= */

                const bubble =
                    document.createElement(
                        "div"
                    );


                bubble.className =
                    "bubble";


                bubble.textContent =
                    message.text || "";


                if(message.color){

                    bubble.style.color =
                        message.color;

                }


                box.appendChild(
                    user
                );


                box.appendChild(
                    bubble
                );


                chat.appendChild(
                    box
                );

            });


            scrollChatToBottom();

        }
    );

}

async function startVoiceChat(){

    try{

        showVoiceStatus(
            "🎤 Mikrofon açılıyor..."
        );


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Tarayıcınız mikrofon erişimini desteklemiyor."
            );

        }


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:true,

                video:false

            });


        voiceActive =
            true;


        const button =
            document.getElementById(
                "voiceButton"
            );


        button.textContent =
            "🔴 Sesi Kapat";


        button.classList.add(
            "active"
        );


        startVoiceListener();


        showVoiceStatus(
            "🎤 Sesli sohbet aktif"
        );


        const callsSnapshot =
            await database
            .ref("calls")
            .once("value");


        let foundCall =
            false;


        callsSnapshot.forEach(
        function(child){

            const call =
                child.val();


            if(
                call &&
                call.receiver ===
                username
            ){

                foundCall =
                    true;


                answerCall(
                    child.key,
                    call
                );

            }

        });


        if(!foundCall){

            await createCall();

        }

    }

    catch(error){

        console.error(
            "Mikrofon hatası:",
            error
        );


        voiceActive =
            false;


        alert(
            "Mikrofon açılamadı.\n\n" +
            error.name +
            "\n" +
            error.message
        );

    }

}

/* =========================================================

function startVoiceListener(){

    if(voiceListenerStarted){

        return;

    }


    voiceListenerStarted =
        true;


    database
    .ref("calls")
    .on(
        "child_added",
        async function(snapshot){

            const call =
                snapshot.val();


            const callId =
                snapshot.key;


            if(!call){

                return;

            }


            if(
                call.caller ===
                username
            ){

                return;

            }


            if(
                call.receiver !==
                username
            ){

                return;

            }


            if(
                peerConnections[callId]
            ){

                return;

            }


            if(!voiceActive){

                return;

            }


            try{

                await answerCall(
                    callId,
                    call
                );

            }

            catch(error){

                console.error(
                    "Çağrı cevaplama hatası:",
                    error
                );

            }

        }
    );

}


/* =========================================================
   ÇAĞRI BAŞLAT
========================================================= */

async function createCall(){

    if(!localStream){

        return;

    }


    const usersSnapshot =
        await database
        .ref("onlineUsers")
        .once("value");


    let otherUser =
        null;


    usersSnapshot.forEach(
    function(child){

        const user =
            child.val();


        if(
            user &&
            user.username &&
            user.username !== username &&
            !otherUser
        ){

            otherUser =
                user.username;

        }

    });


    if(!otherUser){

        showVoiceStatus(
            "🎤 Mikrofon açık - başka kullanıcı bekleniyor"
        );

        return;

    }


    const callRef =
        database
        .ref("calls")
        .push();


    const callId =
        callRef.key;


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(function(track){

        pc.addTrack(
            track,
            localStream
        );

    });


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(function(error){

            console.log(
                "Ses oynatma hatası:",
                error
            );

        });


        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };


    pc.onicecandidate =
    function(event){

        if(event.candidate){

            database
            .ref(
                "calls/" +
                callId +
                "/callerCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    const offer =
        await pc.createOffer();


    await pc.setLocalDescription(
        offer
    );


    await callRef.set({

        caller:
            username,

        receiver:
            otherUser,

        offer:{

            type:
                offer.type,

            sdp:
                offer.sdp

        },

        created:
            Date.now()

    });


    database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .on(
        "value",
        async function(snapshot){

            const answer =
                snapshot.val();


            if(
                answer &&
                !pc.currentRemoteDescription
            ){

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        answer
                    )
                );

            }

        }
    );


    database
    .ref(
        "calls/" +
        callId +
        "/receiverCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }

                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =========================================================
   ÇAĞRI CEVAPLA
========================================================= */

async function answerCall(
    callId,
    call
){

    if(
        !localStream ||
        !voiceActive
    ){

        return;

    }


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(function(track){

        pc.addTrack(
            track,
            localStream
        );

    });


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(function(error){

            console.log(
                error
            );

        });


        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };


    pc.onicecandidate =
    function(event){

        if(event.candidate){

            database
            .ref(
                "calls/" +
                callId +
                "/receiverCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    await pc.setRemoteDescription(
        new RTCSessionDescription(
            call.offer
        )
    );


    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    await database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .set({

        type:
            answer.type,

        sdp:
            answer.sdp

    });


    database
    .ref(
        "calls/" +
        callId +
        "/callerCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }

                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =========================================================
   SESİ KAPAT
========================================================= */

function stopVoiceChat(){

    voiceActive =
        false;


    if(localStream){

        localStream
        .getTracks()
        .forEach(function(track){

            track.stop();

        });


        localStream =
            null;

    }


    Object
    .keys(peerConnections)

    database

                const call =

                if(
                    call &&
                    (
                        call.caller ===

                        call.receiver ===

                    child.ref.remove();
