 <!DOCTYPE html> <html lang="tr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Mobil Sohbet</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0f1117; color: #fff; } /* GİRİŞ EKRANI */ .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #101522, #171d2d); } .login-box { width: 100%; max-width: 400px; background: #1b2130; padding: 30px 24px; border-radius: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); } .logo { font-size: 48px; margin-bottom: 10px; } .login-box h1 { margin: 0; font-size: 28px; } .subtitle { color: #9da7ba; margin: 10px 0 25px; } .login-box input { width: 100%; padding: 15px; border: 1px solid #343c4d; background: #11151e; color: white; border-radius: 12px; outline: none; font-size: 16px; } .login-box button { width: 100%; margin-top: 12px; padding: 15px; border: none; border-radius: 12px; background: #4d8cff; color: white; font-size: 16px; font-weight: bold; cursor: pointer; } /* SOHBET */ .chat-page { display: none; height: 100vh; overflow: hidden; } .header { height: 70px; background: #191e29; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #303746; } .header-title { font-weight: bold; font-size: 18px; } .online { color: #45e889; font-size: 12px; margin-top: 4px; } .logout { border: none; background: #292f3d; color: white; padding: 9px 12px; border-radius: 8px; cursor: pointer; } .chat { height: calc(100vh - 135px); overflow-y: auto; padding: 18px 14px; } .message { margin-bottom: 16px; } .username { color: #62b0ff; font-size: 13px; font-weight: bold; margin-bottom: 4px; } .bubble { display: inline-block; max-width: 85%; background: #202633; padding: 11px 13px; border-radius: 5px 14px 14px 14px; word-wrap: break-word; } .my-message { text-align: right; } .my-message .username { color: #70e6a0; } .my-message .bubble { background: #315b9f; border-radius: 14px 5px 14px 14px; } .delete { margin-left: 5px; border: none; background: transparent; color: #9da7ba; cursor: pointer; } /* MESAJ ALANI */ .input-area { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: #191e29; border-top: 1px solid #303746; display: flex; align-items: center; gap: 7px; padding: 9px; } .emoji { width: 42px; height: 42px; border: none; background: #292f3d; color: white; border-radius: 10px; font-size: 20px; cursor: pointer; } .message-input { flex: 1; height: 42px; border: none; outline: none; border-radius: 10px; background: #272e3b; color: white; padding: 0 12px; font-size: 15px; } .send { width: 45px; height: 42px; border: none; background: #4d8cff; color: white; border-radius: 10px; font-size: 18px; cursor: pointer; } /* EMOJI MENÜSÜ */ .emoji-menu { display: none; position: fixed; bottom: 70px; left: 8px; background: #1c2230; border: 1px solid #343c4d; border-radius: 12px; padding: 10px; width: 220px; box-shadow: 0 5px 20px rgba(0,0,0,.4); } .emoji-menu button { border: none; background: transparent; font-size: 24px; padding: 6px; cursor: pointer; } @media (min-width: 700px) { .chat, .input-area { max-width: 700px; margin-left: auto; margin-right: auto; } .input-area { left: 50%; transform: translateX(-50%); } } </style> </head> <body> <!-- GİRİŞ --> <div class="login" id="login"> <div class="login-box"> <div class="logo">💬</div> <h1>Mobil Sohbet</h1> <div class="subtitle"> Sohbete katılmak için kullanıcı adını yaz </div> <input id="usernameInput" type="text" maxlength="20" placeholder="Kullanıcı adın..." > <button onclick="enterChat()"> SOHBETE GİR </button> </div> </div> <!-- SOHBET --> <div class="chat-page" id="chatPage"> <div class="header"> <div> <div class="header-title"> 💬 Mobil Sohbet </div> <div class="online"> 🟢 <span id="onlineCount">1</span> kişi çevrimiçi </div> </div> <button class="logout" onclick="logout()"> Çıkış </button> </div> <div class="chat" id="chat"> <div class="message"> <div class="username"> Sistem </div> <div class="bubble"> 👋 Hoş geldin! Sohbetimize katıldın. </div> </div> </div> <div class="emoji-menu" id="emojiMenu"> <button onclick="addEmoji('😀')">😀</button> <button onclick="addEmoji('😂')">😂</button> <button onclick="addEmoji('😍')">😍</button> <button onclick="addEmoji('😘')">😘</button> <button onclick="addEmoji('😊')">😊</button> <button onclick="addEmoji('❤️')">❤️</button> <button onclick="addEmoji('👍')">👍</button> <button onclick="addEmoji('🔥')">🔥</button> <button onclick="addEmoji('🎵')">🎵</button> <button onclick="addEmoji('😎')">😎</button> </div> <div class="input-area"> <button class="emoji" onclick="toggleEmoji()"> 😊 </button> <input class="message-input" id="messageInput" type="text" placeholder="Mesaj yaz..." onkeydown="handleEnter(event)" > <button class="send" onclick="sendMessage()"> ➤ </button> </div> </div> <script> let username = ""; /* SOHBETE GİR */ function enterChat() { const input = document.getElementById("usernameInput"); const name = input.value.trim(); if (name === "") { alert("Lütfen kullanıcı adını yaz."); return; } username = name; document.getElementById("login").style.display = "none"; document.getElementById("chatPage").style.display = "block"; document.getElementById("onlineCount").innerText = "1"; } /* MESAJ GÖNDER */ function sendMessage() { const input = document.getElementById("messageInput"); const text = input.value.trim(); if (text === "") { return; } const chat = document.getElementById("chat"); const message = document.createElement("div"); message.className = "message my-message"; message.innerHTML = ` <div class="username"> ${escapeHtml(username)} </div> <span class="bubble"> ${escapeHtml(text)} </span> <button class="delete" onclick="this.parentElement.remove()"> 🗑️ </button> `; chat.appendChild(message); input.value = ""; chat.scrollTop = chat.scrollHeight; } /* ENTER */ function handleEnter(event) { if (event.key === "Enter") { sendMessage(); } } /* EMOJI */ function toggleEmoji() { const menu = document.getElementById("emojiMenu"); if (menu.style.display === "block") { menu.style.display = "none"; } else { menu.style.display = "block"; } } function addEmoji(emoji) { const input = document.getElementById("messageInput"); input.value += emoji; input.focus(); } /* ÇIKIŞ */ function logout() { username = ""; document.getElementById("chatPage").style.display = "none"; document.getElementById("login").style.display = "flex"; document.getElementById("usernameInput").value = ""; } /* GÜVENLİ METİN */ function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; } </script> </body> </html>
