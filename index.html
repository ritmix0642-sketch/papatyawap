 <!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10131b;
    color: white;
}

#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: #1c2230;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
}

.login-box h1 {
    margin-bottom: 10px;
}

.login-box input {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #11151e;
    color: white;
    font-size: 16px;
}

.login-box button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #4d8cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#chatPage {
    display: none;
    height: 100vh;
}

.header {
    height: 70px;
    background: #1a1f2b;
    padding: 12px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-weight: bold;
}

.online {
    color: #45e889;
    font-size: 12px;
    margin-top: 4px;
}

.logout {
    background: #303746;
    border: 0;
    color: white;
    padding: 9px 12px;
    border-radius: 8px;
}

#chat {
    height: calc(100vh - 135px);
    overflow-y: auto;
    padding: 15px;
}

.message {
    margin-bottom: 15px;
}

.username {
    color: #62b0ff;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

.time {
    color: #777f90;
    font-size: 10px;
    margin-left: 5px;
}

.bubble {
    display: inline-block;
    background: #222936;
    padding: 10px 13px;
    border-radius: 5px 14px 14px 14px;
    max-width: 85%;
    word-break: break-word;
}

.mine {
    text-align: right;
}

.mine .username {
    color: #70e6a0;
}

.mine .bubble {
    background: #315b9f;
}

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 65px;
    background: #1a1f2b;
    padding: 10px;
    display: flex;
    gap: 8px;
}

#messageInput {
    flex: 1;
    border: 0;
    outline: 0;
    border-radius: 10px;
    background: #272e3b;
    color: white;
    padding: 0 12px;
    font-size: 15px;
}

.send {
    width: 48px;
    border: 0;
    border-radius: 10px;
    background: #4d8cff;
    color: white;
    font-size: 18px;
}

</style>

</head>

<body>

<div id="login">

```
<div class="login-box">

    <div style="font-size:50px;">💬</div>

    <h1>Ritmix Sohbet</h1>

    <p>Sohbete katılmak için kullanıcı adını yaz</p>

    <input
        id="usernameInput"
        maxlength="20"
        placeholder="Kullanıcı adın..."
    >

    <button id="loginButton">
        SOHBETE GİR
    </button>

</div>
```

</div>

<div id="chatPage">

```
<div class="header">

    <div>

        <div class="title">
            💬 Ritmix Sohbet
        </div>

        <div class="online" id="onlineText">
            🟢 Gerçek zamanlı sohbet
        </div>

    </div>

    <button class="logout" id="logoutButton">
        Çıkış
    </button>

</div>


<div id="chat"></div>


<div class="input-area">

    <input
        id="messageInput"
        placeholder="Mesaj yaz..."
    >

    <button class="send" id="sendButton">
        ➤
    </button>

</div>
```

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",
    authDomain: "papatyawap.firebaseapp.com",
    databaseURL: "https://papatyawap-default-rtdb.firebaseio.com",
    projectId: "papatyawap",
    storageBucket: "papatyawap.firebasestorage.app",
    messagingSenderId: "29357315689",
    appId: "1:29357315689:web:78864218c204d291f734f8"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

let username = "";
let userKey = "";


/* GİRİŞ */

document.getElementById("loginButton").addEventListener("click", enterChat);

document.getElementById("usernameInput").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        enterChat();
    }

});


function enterChat() {

    const input = document.getElementById("usernameInput");

    const name = input.value.trim();

    if (name === "") {

        alert("Lütfen kullanıcı adını yaz.");

        return;

    }

    username = name;

    document.getElementById("login").style.display = "none";

    document.getElementById("chatPage").style.display = "block";

    listenMessages();

    setOnline();

}


/* MESAJLARI DİNLE */

function listenMessages() {

    database.ref("messages").on("value", function(snapshot) {

        const chat = document.getElementById("chat");

        chat.innerHTML = "";

        snapshot.forEach(function(item) {

            const message = item.val();

            const box = document.createElement("div");

            box.className = "message";

            if (message.username === username) {
                box.classList.add("mine");
            }


            const user = document.createElement("div");

            user.className = "username";

            user.textContent = message.username;


            if (message.timestamp) {

                const time = document.createElement("span");

                time.className = "time";

                time.textContent =
                    new Date(message.timestamp)
                    .toLocaleTimeString("tr-TR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

                user.appendChild(time);

            }


            const bubble = document.createElement("div");

            bubble.className = "bubble";

            bubble.textContent = message.text;


            box.appendChild(user);

            box.appendChild(bubble);

            chat.appendChild(box);

        });

        chat.scrollTop = chat.scrollHeight;

    });

}


/* MESAJ GÖNDER */

document.getElementById("sendButton").addEventListener("click", sendMessage);

document.getElementById("messageInput").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});


function sendMessage() {

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (text === "" || username === "") {
        return;
    }

    database.ref("messages").push({

        username: username,

        text: text,

        timestamp: Date.now()

    });

    input.value = "";

    input.focus();

}


/* ONLINE KULLANICI */

function setOnline() {

    const ref = database.ref("onlineUsers").push();

    userKey = ref.key;

    ref.set({

        username: username,

        timestamp: firebase.database.ServerValue.TIMESTAMP

    });

    ref.onDisconnect().remove();


    database.ref("onlineUsers").on("value", function(snapshot) {

        const count = snapshot.numChildren();

        document.getElementById("onlineText").textContent =
            "🟢 " + count + " kişi çevrimiçi";

    });

}


/* ÇIKIŞ */

document.getElementById("logoutButton").addEventListener("click", function() {

    if (userKey) {

        database.ref("onlineUsers/" + userKey).remove();

    }

    location.reload();

});

</script>

</body>
</html>
