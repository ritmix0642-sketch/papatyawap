const query = gifSearchInput.value.trim();
if(!query){gifResults.innerHTML = '<div class="gif-empty">🔎 Önce GIF adı yazın</div>';return;}
gifResults.innerHTML = '<div class="gif-empty">⏳ GIF aranıyor...</div>';
try{
const url = "https://api.giphy.com/v1/gifs/search" + "?api_key=" + encodeURIComponent(GIPHY_API_KEY) + "&q=" + encodeURIComponent(query) + "&limit=24" + "&rating=pg-13" + "&lang=tr";
const response = await fetch(url);
if(!response.ok){throw new Error("HTTP " + response.status);}
const data = await response.json();
if(!data || !data.data || data.data.length === 0){gifResults.innerHTML = '<div class="gif-empty">😔 GIF bulunamadı</div>';return;}
gifResults.innerHTML = "";
data.data.forEach(function(gif){
const images = gif.images || {};
const previewUrl = images.fixed_width?.webp || images.fixed_width?.url || images.fixed_height?.webp || images.preview_gif?.url || images.original?.url;
const originalUrl = images.original?.url || images.fixed_height?.url || images.fixed_width?.url || previewUrl;
if(!previewUrl){return;}
const image = document.createElement("img");
image.className = "gif-result";
image.src = previewUrl;
image.alt = gif.title || "GIF";
image.loading = "lazy";
image.onerror = function(){if(this.dataset.fallback !== "1" && images.original?.url){this.dataset.fallback = "1";this.src = images.original.url;}};
image.onclick = function(){sendGIF(originalUrl,previewUrl);gifPanel.style.display = "none";};
gifResults.appendChild(image);
});
}catch(error){
console.error("GIPHY hatası:",error);
gifResults.innerHTML = '<div class="gif-empty">❌ GIF yüklenemedi.<br><br>İnternet bağlantısını veya GIPHY erişimini kontrol edin.</div>';
}
}
function sendGIF(gifUrl,previewUrl){
if(!username){return;}
checkMessageLimit(function(canSend){
if(!canSend){return;}
database.ref("messages").push({username:username,type:"gif",gif:gifUrl,preview:previewUrl,color:selectedMessageColor,timestamp:Date.now()});
});
}
function checkMessageLimit(callback){
database.ref("messages").once("value",function(snapshot){
const count = snapshot.numChildren();
if(count >= MAX_MESSAGES){
alert("⚠️ 20 sayfa doldu.\n\nToplam 160 mesaj sınırına ulaşıldı.\n\nEski mesajları silin veya 🗑️ Oda butonunu kullanarak odayı temizleyin.");
callback(false);
return;
}
callback(true);
});
}
const ADMIN_UID = "zOQTI3PVjuYy20NADsZbNhbzW6T2";
let pendingMembersRef = null;
function updatePendingMemberBadge(isAdmin){
const badge = document.getElementById("pendingMemberBadge");
if(pendingMembersRef){pendingMembersRef.off("value");pendingMembersRef = null;}
if(!badge){return;}
badge.style.display = "none";
badge.textContent = "0";
if(!isAdmin || !auth.currentUser || auth.currentUser.uid !== ADMIN_UID){return;}
pendingMembersRef = database.ref("members");
pendingMembersRef.on("value",function(snapshot){
let count = 0;
snapshot.forEach(function(child){
const member = child.val() || {};
if(child.key !== ADMIN_UID && member.approved !== true && member.rejected !== true){count++;}
});
badge.textContent = count > 99 ? "99+" : String(count);

function authMessage(text,color = "#77736b"){
const status = document.getElementById("authStatus");
if(status){status.textContent = text;status.style.color = color;}
}
function getLoginFields(){
return {name:document.getElementById("usernameInput").value.trim(),email:document.getElementById("emailInput").value.trim(),password:document.getElementById("passwordInput").value};
}
function validateEmailPassword(email,password){
if(!email || !password){authMessage("E-posta ve şifrenizi girin.","#c72f42");return false;}
if(password.length < 6){authMessage("Şifre en az 6 karakter olmalı.","#c72f42");return false;}
return true;
}
async function registerMember(){
const {name,email,password} = getLoginFields();
if(!name){authMessage("Lütfen bir kullanıcı adı seçin.","#c72f42");return;}
if(name.length > 20){authMessage("Kullanıcı adı en fazla 20 karakter olabilir.","#c72f42");return;}
if(!validateEmailPassword(email,password)) return;
const button = document.getElementById("registerButton");
button.disabled = true;
authMessage("Üyelik oluşturuluyor...");
let createdUser = null;
try{
const credential = await auth.createUserWithEmailAndPassword(email,password);
createdUser = credential.user;
await database.ref("members/" + createdUser.uid).set({username:name,email:email,approved:false,rejected:false,role:"member",createdAt:firebase.database.ServerValue.TIMESTAMP});
await auth.signOut();
authMessage("Üyelik talebin alındı. Yönetici onayından sonra giriş yapabilirsin.","#08783f");
document.getElementById("passwordInput").value = "";
}catch(error){
console.error("Üyelik oluşturma hatası:",error);
let message = error.message;
if(error.code === "auth/email-already-in-use"){message = "Bu e-posta adresiyle zaten hesap var. Giriş yapmayı dene.";}
else if(error.code === "auth/invalid-email"){message = "E-posta adresi geçerli görünmüyor.";}
else if(error.code === "auth/weak-password"){message = "Daha güçlü bir şifre belirle.";}
else if(createdUser){message = "Hesap oluşturuldu fakat üyelik kaydı tamamlanamadı. Tekrar tekrar kayıt oluşturma; yönetici veritabanını kontrol etmeli.";}
authMessage(message,"#c72f42");
}finally{button.disabled = false;}
}
async function enterChat(){
const {name,email,password} = getLoginFields();
if(!validateEmailPassword(email,password)) return;
const button = document.getElementById("loginButton");
button.disabled = true;
authMessage("Giriş kontrol ediliyor...");
try{
const credential = await auth.signInWithEmailAndPassword(email,password);
const user = credential.user;
if(user.uid === ADMIN_UID){
username = name || "Yönetici";
openChatPage(true);
return;
}
const memberSnapshot = await database.ref("members/" + user.uid).once("value");
const member = memberSnapshot.val();
if(!member){
await auth.signOut();
authMessage("Üyelik kaydın bulunamadı. Önce yeni üyelik oluştur.","#c72f42");
return;
}
if(member.rejected === true){
await auth.signOut();
authMessage("Üyelik talebin reddedilmiş. Yöneticiyle iletişime geç.","#c72f42");
return;
}
if(member.approved !== true){
await auth.signOut();
authMessage("Üyeliğin henüz onaylanmadı. Lütfen yönetici onayını bekle.","#9a6a00");
return;
}
username = member.username || name;
openChatPage(false);
}catch(error){
console.error("Giriş hatası:",error);
let message = error.message;
if(error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found"){message = "E-posta veya şifre hatalı.";}
else if(error.code === "auth/too-many-requests"){message = "Çok fazla deneme yapıldı. Bir süre sonra tekrar dene.";}
authMessage(message,"#c72f42");
}finally{button.disabled = false;}
}

function updatePagination(totalMessages){
const pagination = document.getElementById("pagination");
pagination.innerHTML = "";
const totalPages = Math.min(Math.max(1,Math.ceil(totalMessages / MESSAGES_PER_PAGE)),MAX_PAGES);
if(currentPage > totalPages){currentPage = totalPages;}
for(let i = 1;i <= totalPages;i++){
const button = document.createElement("button");
button.className = "page-button";
button.textContent = i;
if(i === currentPage){button.classList.add("active");}
button.onclick = function(){currentPage = i;renderCurrentPage(window.allMessages || []);};
pagination.appendChild(button);
}
}
function renderCurrentPage(messages){
const chat = document.getElementById("chat");
chat.innerHTML = "";
if(!messages || !messages.length){updatePagination(0);return;}
const newestFirst = [...messages].reverse();
const start = (currentPage - 1) * MESSAGES_PER_PAGE;
const pageMessages = newestFirst.slice(start,start + MESSAGES_PER_PAGE);
pageMessages.forEach(function(item){renderMessage(item.message,item.key);});
updatePagination(messages.length);
chat.scrollTop = 0;
}
function loadMessages(){
database.ref("messages").orderByChild("timestamp").on("value",function(snapshot){
const messages = [];
snapshot.forEach(function(child){
const message = child.val();
if(message){messages.push({key:child.key,message:message});}
});
messages.sort(function(a,b){
const timeA = Number(a.message.timestamp || 0);
const timeB = Number(b.message.timestamp || 0);
if(timeA !== timeB){return timeA - timeB;}
return a.key.localeCompare(b.key);
});
window.allMessages = messages;
renderCurrentPage(messages);
});
}

function showVoiceStatus(text){
const status = document.getElementById("voiceStatus");
status.textContent = text;
status.style.display = "block";
}
function hideVoiceStatus(){document.getElementById("voiceStatus").style.display = "none";}
async function startVoiceChat(){
try{
showVoiceStatus("🎤 Mikrofon açılıyor...");
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){throw new Error("Tarayıcınız mikrofon erişimini desteklemiyor.");}
localStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
voiceActive = true;
const button = document.getElementById("voiceButton");
button.textContent = "🔴 Sesi Kapat";
button.classList.add("active");
startVoiceListener();
showVoiceStatus("🎤 Sesli sohbet aktif");
const callsSnapshot = await database.ref("calls").once("value");
let foundCall = false;
callsSnapshot.forEach(function(child){
const call = child.val();
if(call && call.receiver === username){foundCall = true;answerCall(child.key,call);}
});
if(!foundCall){await createCall();}
}catch(error){
console.error("Mikrofon hatası:",error);
voiceActive = false;
alert("Mikrofon açılamadı.\n\n" + error.name + "\n" + error.message);
}
}
document.getElementById("voiceButton").onclick = async function(){if(voiceActive){stopVoiceChat();}else{await startVoiceChat();}};
function startVoiceListener(){
if(voiceListenerStarted){return;}
voiceListenerStarted = true;
database.ref("calls").on("child_added",async function(snapshot){
const call = snapshot.val();
const callId = snapshot.key;
if(!call){return;}
if(call.caller === username){return;}
if(call.receiver !== username){return;}
if(peerConnections[callId]){return;}
if(!voiceActive){return;}
try{await answerCall(callId,call);}
catch(error){console.error("Çağrı cevaplama hatası:",error);}
});
}
async function createCall(){
if(!localStream){return;}
const usersSnapshot = await database.ref("onlineUsers").once("value");
let otherUser = null;
usersSnapshot.forEach(function(child){
const user = child.val();
if(user && user.username && user.username !== username && !otherUser){otherUser = user.username;}
});
if(!otherUser){showVoiceStatus("🎤 Mikrofon açık - başka kullanıcı bekleniyor");return;}
const callRef = database.ref("calls").push();
const callId = callRef.key;
const pc = new RTCPeerConnection(rtcConfig);
peerConnections[callId] = pc;
localStream.getTracks().forEach(function(track){pc.addTrack(track,localStream);});
pc.ontrack = function(event){
const audio = document.getElementById("remoteAudio");
audio.srcObject = event.streams[0];
audio.play().catch(function(error){console.log("Ses oynatma hatası:",error);});
showVoiceStatus("🔊 Ses bağlantısı aktif");
};
pc.onicecandidate = function(event){if(event.candidate){database.ref("calls/" + callId + "/callerCandidates").push(event.candidate.toJSON());}};
const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
await callRef.set({caller:username,receiver:otherUser,offer:{type:offer.type,sdp:offer.sdp},created:Date.now()});
database.ref("calls/" + callId + "/answer").on("value",async function(snapshot){
const answer = snapshot.val();
if(answer && !pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(answer));}
});
database.ref("calls/" + callId + "/receiverCandidates").on("child_added",async function(snapshot){
const candidate = snapshot.val();
if(candidate){try{await pc.addIceCandidate(new RTCIceCandidate(candidate));}catch(error){console.log(error);}}
});
}
async function answerCall(callId,call){
if(!localStream || !voiceActive){return;}
const pc = new RTCPeerConnection(rtcConfig);
peerConnections[callId] = pc;
localStream.getTracks().forEach(function(track){pc.addTrack(track,localStream);});
pc.ontrack = function(event){
const audio = document.getElementById("remoteAudio");
audio.srcObject = event.streams[0];
audio.play().catch(function(error){console.log(error);});
showVoiceStatus("🔊 Ses bağlantısı aktif");
};
pc.onicecandidate = function(event){if(event.candidate){database.ref("calls/" + callId + "/receiverCandidates").push(event.candidate.toJSON());}};
await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
const answer = await pc.createAnswer();
await pc.setLocalDescription(answer);
await database.ref("calls/" + callId + "/answer").set({type:answer.type,sdp:answer.sdp});
database.ref("calls/" + callId + "/callerCandidates").on("child_added",async function(snapshot){
const candidate = snapshot.val();
if(candidate){try{await pc.addIceCandidate(new RTCIceCandidate(candidate));}catch(error){console.log(error);}}
});
}
function stopVoiceChat(){
voiceActive = false;
if(localStream){localStream.getTracks().forEach(function(track){track.stop();});localStream = null;}
Object.keys(peerConnections).forEach(function(id){try{peerConnections[id].close();}catch(error){console.log(error);}});
peerConnections = {};
const audio = document.getElementById("remoteAudio");
audio.srcObject = null;
const button = document.getElementById("voiceButton");
button.textContent = "🎤 Sesli Sohbet";
button.classList.remove("active");
hideVoiceStatus();
database.ref("calls").once("value",function(snapshot){
snapshot.forEach(function(child){
const call = child.val();
if(call && (call.caller === username || call.receiver === username)){child.ref.remove();}
});
});
}
document.getElementById("logoutButton").onclick = async function(){
stopVoiceChat();
try{
if(userKey){await database.ref("onlineUsers/" + userKey).remove();userKey = "";}
await auth.signOut();
location.reload();
}catch(error){console.error("Çıkış hatası:",error);alert("Çıkış sırasında hata oluştu: " + error.message);}
};

});
}
