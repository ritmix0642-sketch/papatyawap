<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",

    authDomain:
        "papatyawap.firebaseapp.com",

};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let username = "";
let userKey = "";

let localStream = null;

let peerConnections = {};

let voiceActive = false;

let voiceListenerStarted = false;


/* =====================================================
   WEBRTC
===================================================== */

const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

/* =====================================================
   GİRİŞ
===================================================== */

function enterChat(){

    const input =
        document.getElementById(
            "usernameInput"
        );

    const name =
        input.value.trim();

    if(!name){

        alert(
            "Lütfen kullanıcı adını yaz."
        );

        input.focus();

        return;
    }

    username = name;

    document.getElementById(
        "login"
    ).style.display = "none";

    document.getElementById(
        "chatPage"
    ).style.display = "block";

    loadMessages();

    setOnline();

}


document.getElementById(
    "loginButton"
).onclick = enterChat;


document.getElementById(
    "usernameInput"
).onkeydown = function(event){

    if(event.key === "Enter"){

        enterChat();

    }

};


/* =====================================================
   MESAJLAR
===================================================== */

function loadMessages(){

    database
        .ref("messages")
        .on(
            "value",
            function(snapshot){

                const chat =
                    document.getElementById(
                        "chat"
                    );

                chat.innerHTML = "";

                snapshot.forEach(
                    function(child){

                        const message =
                            child.val();

                        const box =
                            document.createElement(
                                "div"
                            );

                        box.className =
                            "message";

                        if(
                            message.username ===
                            username
                        ){

                            box.classList.add(
                                "my-message"
                            );

                        }

                        const user =
                            document.createElement(
                                "div"
                            );

                        user.className =
                            "username";

                        user.textContent =
                            message.username;

                        if(message.timestamp){

                            const time =
                                document.createElement(
                                    "span"
                                );

                            time.className =
                                "time";

                            time.textContent =
                                new Date(
                                    message.timestamp
                                ).toLocaleTimeString(
                                    "tr-TR",
                                    {
                                        hour:
                                            "2-digit",
                                        minute:
                                            "2-digit"
                                    }
                                );

                            user.appendChild(
                                time
                            );

                        }

                        if(
                            message.username ===
                            username
                        ){

                            const deleteButton =
                                document.createElement(
                                    "button"
                                );

                            deleteButton.className =
                                "delete";

                            deleteButton.textContent =
                                "Sil";

                            deleteButton.onclick =
                                function(){

                                    child.ref.remove();

                                };

                            user.appendChild(
                                deleteButton
                            );

                        }

                        const bubble =
                            document.createElement(
                                "div"
                            );

                        bubble.className =
                            "bubble";

                        bubble.textContent =
                            message.text;

                        box.appendChild(user);

                        box.appendChild(
                            bubble
                        );

                        chat.appendChild(
                            box
                        );

                    }
                );

                chat.scrollTop =
                    chat.scrollHeight;

            }
        );

}


/* =====================================================
   MESAJ GÖNDER
===================================================== */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if(
        !text ||
        !username
    ){

        return;

    }

    database
        .ref("messages")
        .push({

            username:
                username,

            text:
                text,

            timestamp:
                Date.now()

        });

    input.value = "";

    input.focus();

}


document.getElementById(
    "sendButton"
).onclick = sendMessage;


document.getElementById(
    "messageInput"
).onkeydown = function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

};


/* =====================================================
   ÇEVRİMİÇİ KULLANICILAR
===================================================== */

function setOnline(){

    const ref =
        database
            .ref("onlineUsers")
            .push();

    userKey =
        ref.key;

    ref.set({

        username:
            username,

        timestamp:
            firebase.database.ServerValue.TIMESTAMP

    });

    ref.onDisconnect().remove();

    database
        .ref("onlineUsers")
        .on(
            "value",
            function(snapshot){

                const count =
                    snapshot.numChildren();

                document.getElementById(
                    "onlineText"
                ).textContent =
                    "🟢 " +
                    count +
                    " kişi çevrimiçi";

                const names = [];

                snapshot.forEach(
                    function(child){

                        const user =
                            child.val();

                        if(
                            user &&
                            user.username
                        ){

                            names.push(
                                user.username
                            );

                        }

                    }
                );

                document.getElementById(
                    "onlineUsersText"
                ).textContent =
                    names.length
                    ?
                    "👥 " +
                    names.join(", ")
                    :
                    "👥 Kimse yok";

            }
        );

}


/* =====================================================
   SES DURUMU
===================================================== */

function showVoiceStatus(text){

    const status =
        document.getElementById(
            "voiceStatus"
        );

    status.textContent =
        text;

    status.style.display =
        "block";

}


function hideVoiceStatus(){

    document.getElementById(
        "voiceStatus"
    ).style.display =
        "none";

}


/* =====================================================
   SESLİ SOHBETİ BAŞLAT
===================================================== */

async function startVoiceChat(){

    try{

        showVoiceStatus(
            "🎤 Mikrofon açılıyor..."
        );

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Tarayıcı mikrofon özelliğini desteklemiyor."
            );

        }

        localStream =
            await navigator.mediaDevices.getUserMedia({

                audio:true,

                video:false

            });

        voiceActive =
            true;

        const button =
            document.getElementById(
                "voiceButton"
            );

        button.textContent =
            "🔴 Sesi Kapat";

        button.classList.add(
            "active"
        );

        startVoiceListener();

        showVoiceStatus(
            "🎤 Mikrofon açık"
        );

        await checkExistingCalls();

    }
    catch(error){

        console.error(
            "Mikrofon hatası:",
            error
        );

        localStream =
            null;

        voiceActive =
            false;

        alert(
            "Mikrofon açılamadı.\n\n" +
            error.name +
            "\n" +
            error.message
        );

    }

}


/* =====================================================
   SES BUTONU
===================================================== */

document.getElementById(
    "voiceButton"
).onclick = async function(){

    if(voiceActive){

        stopVoiceChat();

    }
    else{

        await startVoiceChat();

    }

};


/* =====================================================
   ÇAĞRILARI DİNLE
===================================================== */

function startVoiceListener(){

    if(
        voiceListenerStarted
    ){

        return;

    }

    voiceListenerStarted =
        true;

    database
        .ref("calls")
        .on(
            "child_added",
            async function(snapshot){

                const call =
                    snapshot.val();

                const callId =
                    snapshot.key;

                if(!call){

                    return;

                }

                if(
                    call.caller ===
                    username
                ){

                    return;

                }

                if(
                    call.receiver !==
                    username
                ){

                    return;

                }

                if(
                    peerConnections[callId]
                ){

                    return;

                }

                if(
                    !voiceActive ||
                    !localStream
                ){

                    return;

                }

                await answerCall(
                    callId,
                    call
                );

            }
        );

}


/* =====================================================
   MEVCUT ÇAĞRILARI KONTROL ET
===================================================== */

async function checkExistingCalls(){

    const snapshot =
        await database
            .ref("calls")
            .once("value");

    let foundCall =
        false;

    snapshot.forEach(
        function(child){

            const call =
                child.val();

            if(
                call &&
                call.receiver ===
                username
            ){

                foundCall =
                    true;

                answerCall(
                    child.key,
                    call
                );

            }

        }
    );

    if(!foundCall){

        await createCall();

    }

}


/* =====================================================
   ÇAĞRI OLUŞTUR
===================================================== */

async function createCall(){

    if(
        !localStream ||
        !voiceActive
    ){

        return;

    }

    const usersSnapshot =
        await database
            .ref("onlineUsers")
            .once("value");

    let otherUser =
        null;

    usersSnapshot.forEach(
        function(child){

            const user =
                child.val();

            if(
                user &&
                user.username &&
                user.username !== username &&
                !otherUser
            ){

                otherUser =
                    user.username;

            }

        }
    );

    if(!otherUser){

        showVoiceStatus(
            "🎤 Mikrofon açık - başka kullanıcı bekleniyor"
        );

        return;

    }

    const callRef =
        database
            .ref("calls")
            .push();

    const callId =
        callRef.key;

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    peerConnections[callId] =
        pc;

    localStream
        .getTracks()
        .forEach(
            function(track){

                pc.addTrack(
                    track,
                    localStream
                );

            }
        );

    pc.ontrack =
        function(event){

            const audio =
                document.getElementById(
                    "remoteAudio"
                );

            audio.srcObject =
                event.streams[0];

            audio.play()
                .catch(
                    function(error){

                        console.log(
                            "Audio play:",
                            error
                        );

                    }
                );

            showVoiceStatus(
                "🔊 Ses bağlantısı kuruldu"
            );

        };

    pc.onicecandidate =
        function(event){

            if(
                event.candidate
            ){

                database
                    .ref(
                        "calls/" +
                        callId +
                        "/callerCandidates"
                    )
                    .push(
                        event.candidate.toJSON()
                    );

            }

        };

    const offer =
        await pc.createOffer();

    await pc.setLocalDescription(
        offer
    );

    await callRef.set({

        caller:
            username,

        receiver:
            otherUser,

        offer:{

            type:
                offer.type,

            sdp:
                offer.sdp

        },

        created:
            Date.now()

    });

    database
        .ref(
            "calls/" +
            callId +
            "/answer"
        )
        .on(
            "value",
            async function(snapshot){

                const answer =
                    snapshot.val();

                if(
                    answer &&
                    !pc.currentRemoteDescription
                ){

                    try{

                        await pc.setRemoteDescription(
                            new RTCSessionDescription(
                                answer
                            )
                        );

                    }
                    catch(error){

                        console.error(
                            "Remote description:",
                            error
                        );

                    }

                }

            }
        );

    database
        .ref(
            "calls/" +
            callId +
            "/receiverCandidates"
        )
        .on(
            "child_added",
            async function(snapshot){

                const candidate =
                    snapshot.val();

                if(candidate){

                    try{

                        await pc.addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                    }
                    catch(error){

                        console.log(
                            "ICE:",
                            error
                        );

                    }

                }

            }
        );

}


/* =====================================================
   GELEN ÇAĞRIYI CEVAPLA
===================================================== */

async function answerCall(
    callId,
    call
){

    if(
        !localStream ||
        !voiceActive
    ){

        return;

    }

    if(
        peerConnections[callId]
    ){

        return;

    }

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    peerConnections[callId] =
        pc;

    localStream
        .getTracks()
        .forEach(
            function(track){

                pc.addTrack(
                    track,
                    localStream
                );

            }
        );

    pc.ontrack =
        function(event){

            const audio =
                document.getElementById(
                    "remoteAudio"
                );

            audio.srcObject =
                event.streams[0];

            audio.play()
                .catch(
                    function(error){

                        console.log(
                            error
                        );

                    }
                );

            showVoiceStatus(
                "🔊 Ses bağlantısı kuruldu"
            );

        };

    pc.onicecandidate =
        function(event){

            if(
                event.candidate
            ){

                database
                    .ref(
                        "calls/" +
                        callId +
                        "/receiverCandidates"
                    )
                    .push(
                        event.candidate.toJSON()
                    );

            }

        };

    try{

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                call.offer
            )
        );

    }
    catch(error){

        console.error(
            "Offer hatası:",
            error
        );

        return;

    }

    const answer =
        await pc.createAnswer();

    await pc.setLocalDescription(
        answer
    );

    await database
        .ref(
            "calls/" +
            callId +
            "/answer"
        )
        .set({

            type:
                answer.type,

            sdp:
                answer.sdp

        });

    database
        .ref(
            "calls/" +
            callId +
            "/callerCandidates"
        )
        .on(
            "child_added",
            async function(snapshot){

                const candidate =
                    snapshot.val();

                if(candidate){

                    try{

                        await pc.addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                    }
                    catch(error){

                        console.log(
                            "ICE:",
                            error
                        );

                    }

                }

            }
        );

}


/* =====================================================
   SESLİ SOHBETİ KAPAT
===================================================== */

function stopVoiceChat(){

    voiceActive =
        false;

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                function(track){

                    track.stop();

                }
            );

        localStream =
            null;

    }

    Object.keys(
        peerConnections
    ).forEach(
        function(id){

            try{

                peerConnections[id].close();

            }
            catch(error){

                console.log(error);

            }

        }
    );

    peerConnections =
        {};

    const audio =
        document.getElementById(
            "remoteAudio"
        );

    audio.srcObject =
        null;

    const button =
        document.getElementById(
            "voiceButton"
        );

    button.textContent =
        "🎤 Sesli Sohbet";

    button.classList.remove(
        "active"
    );

    hideVoiceStatus();

    /* KENDİ ÇAĞRILARIMIZI TEMİZLE */

    database
        .ref("calls")
        .once(
            "value",
            function(snapshot){

                snapshot.forEach(
                    function(child){

                        const call =
                            child.val();

                        if(
                            call &&
                            (
                                call.caller ===
                                    username ||
                                call.receiver ===
                                    username
                            )
                        ){

                            child.ref.remove();

                        }

                    }
                );

            }
        );

}
