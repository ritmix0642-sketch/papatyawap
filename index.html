<html lang="tr">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
color:white;
background:
radial-gradient(circle at 20% 20%,rgba(91,70,255,.20),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(0,210,255,.15),transparent 35%),
linear-gradient(135deg,#080b16,#10152b,#080b16);
}

/* GİRİŞ */

#login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
padding:38px 28px;
text-align:center;
background:rgba(22,27,49,.85);
border:1px solid rgba(255,255,255,.10);
border-radius:28px;
box-shadow:
0 25px 80px rgba(0,0,0,.55),
0 0 40px rgba(91,70,255,.10);
backdrop-filter:blur(18px);
}

.logo{
width:85px;
height:85px;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
border-radius:25px;
background:linear-gradient(135deg,#6c5ce7,#00c6ff);
box-shadow:0 10px 35px rgba(76,100,255,.35);
}

.login-box h1{
margin-top:20px;
font-size:28px;
}

.subtitle{
margin-top:9px;
margin-bottom:28px;
color:#9da7c5;

}

#usernameInput{
width:100%;
height:52px;
padding:0 17px;
border:1px solid rgba(255,255,255,.10);
border-radius:15px;
outline:none;
background:rgba(5,8,20,.65);
color:white;
font-size:16px;
}

#loginButton{
width:100%;
height:52px;
margin-top:13px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#665cff,#00bfff);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

/* SOHBET */

#chatPage{
display:none;
height:100vh;
overflow:hidden;
}

/* ÜST BAR */

.header{
min-height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 18px;
background:rgba(13,17,34,.90);
border-bottom:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
gap:15px;
}

.header-title{
font-size:18px;
font-weight:bold;
}

.online{
margin-top:5px;
color:#48ee92;
font-size:12px;
}

.online-users{
margin-top:4px;
color:#8993b1;
font-size:11px;
max-width:500px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.header-buttons{
display:flex;
align-items:center;
gap:8px;
}

.logout,
.voice-button{
border:1px solid rgba(255,255,255,.08);
color:white;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.logout{
background:rgba(255,255,255,.07);
}

.voice-button{
background:linear-gradient(135deg,#19a968,#39d987);
}

.voice-button.active{
background:linear-gradient(135deg,#e63d4f,#ff6675);
}

/* MESAJLAR */

.chat{
height:calc(100vh - 150px);
overflow-y:auto;
padding:25px 16px 110px;
max-width:850px;
margin:auto;
}

.message{
margin-bottom:18px;
}

.username{
margin-bottom:6px;
color:#72a9ff;
font-size:12px;
font-weight:bold;
}

.my-message{
text-align:right;
}

.my-message .username{
color:#65e5a1;
}

.time{
margin-left:7px;
color:#69738e;
font-size:10px;
}

.bubble{
display:inline-block;
max-width:85%;
padding:12px 15px;
border-radius:7px 17px 17px 17px;
background:rgba(31,38,65,.90);
border:1px solid rgba(255,255,255,.05);
line-height:1.45;
word-wrap:break-word;
box-shadow:0 5px 18px rgba(0,0,0,.15);
}

.my-message .bubble{
background:linear-gradient(135deg,#405cb1,#36518f);
border-radius:17px 7px 17px 17px;
}

.delete{
border:0;
background:transparent;
color:#ff6977;
font-size:10px;
cursor:pointer;
margin-left:7px;
}

/* GIF */

.gif-message{
max-width:280px;
border-radius:15px;
display:block;
margin-top:5px;
overflow:hidden;
}

.gif-message img{
width:100%;
max-width:280px;
border-radius:15px;
display:block;
cursor:pointer;
}

/* ALT ALAN */

.input-area{
position:fixed;
bottom:0;
left:0;
width:100%;
min-height:76px;
display:flex;
align-items:center;
gap:7px;
padding:10px;
background:rgba(13,17,34,.96);
border-top:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
z-index:20;
}

/* BUTONLAR */

.tool-button{
width:43px;
height:43px;
flex-shrink:0;
border:0;
border-radius:12px;
background:#252c45;
color:white;
font-size:21px;
cursor:pointer;
}

.tool-button:hover{
background:#343d5d;
}

/* RENK */

.color-buttons{
display:flex;
align-items:center;
gap:4px;
}

.color-button{
width:22px;
height:22px;
border-radius:50%;
border:2px solid rgba(255,255,255,.35);
cursor:pointer;
flex-shrink:0;
}

.color-button.selected{
border:3px solid white;
box-shadow:0 0 8px rgba(255,255,255,.7);
}

.color-white{background:#fff}
.color-pink{background:#ff69b4}
.color-blue{background:#54a8ff}
.color-green{background:#55e89a}
.color-yellow{background:#ffd84d}
.color-red{background:#ff6262}

/* INPUT */

.message-input{
flex:1;
height:46px;
min-width:0;
border:1px solid rgba(255,255,255,.08);
outline:none;
border-radius:15px;
background:rgba(35,42,67,.80);
color:white;
padding:0 15px;
font-size:15px;
}

.message-input::placeholder{
color:#77819d;
}

/* GÖNDER */

.send{
width:48px;
height:46px;
flex-shrink:0;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#665cff,#00bfff);
color:white;
font-size:19px;
cursor:pointer;
}

/* EMOJI */

.emoji-panel{
display:none;
position:fixed;
bottom:82px;
left:10px;
width:300px;
max-height:240px;
overflow-y:auto;
padding:12px;
background:rgba(20,25,45,.98);
border:1px solid rgba(255,255,255,.12);
border-radius:18px;
box-shadow:0 15px 45px rgba(0,0,0,.45);
z-index:30;
}

.emoji-grid{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:7px;
}

.emoji-item{
border:0;
background:transparent;
font-size:25px;
cursor:pointer;
border-radius:8px;
padding:4px;
}

.emoji-item:hover{
background:rgba(255,255,255,.08);
}

/* GIF PANEL */

.gif-panel{
display:none;
position:fixed;
bottom:82px;
left:60px;
width:350px;
max-width:calc(100vw - 20px);
height:430px;
background:rgba(20,25,45,.98);
border:1px solid rgba(255,255,255,.12);
border-radius:18px;
box-shadow:0 15px 45px rgba(0,0,0,.45);
z-index:30;
overflow:hidden;
}

.gif-search{
display:flex;
gap:7px;
padding:10px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.gif-search input{
flex:1;
height:40px;
border:0;
outline:none;
border-radius:10px;
background:#2a3149;
color:white;
padding:0 12px;
}

.gif-search button{
width:45px;
border:0;
border-radius:10px;
background:#665cff;
color:white;
font-size:18px;
cursor:pointer;
}

.gif-results{
height:350px;
overflow-y:auto;
padding:10px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.gif-result{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
background:#111827;
}

.gif-empty{
grid-column:1/-1;
text-align:center;
padding:30px 10px;
color:#8993b1;
font-size:13px;
}

/* SES */

#voiceStatus{
display:none;
position:fixed;
bottom:90px;
left:50%;
transform:translateX(-50%);
background:rgba(22,27,49,.95);
border:1px solid rgba(255,255,255,.10);
color:white;
padding:11px 18px;
border-radius:25px;
font-size:13px;
z-index:40;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

/* MOBİL */

@media(max-width:600px){

.header{
min-height:70px;
padding:8px 10px;
}

.header-title{
font-size:15px;
}

.voice-button,
.logout{
padding:8px 10px;
font-size:11px;
}

.online-users{
max-width:190px;
}

.chat{
padding:18px 11px 100px;
}

.bubble{
max-width:88%;
}

.input-area{
min-height:70px;
padding:8px;
gap:5px;
}

.color-buttons{
gap:2px;
}

.color-button{
width:18px;
height:18px;
}

.message-input{
height:44px;
font-size:14px;
}

.send{
width:44px;
height:44px;
}

.tool-button{
width:39px;
height:39px;
font-size:18px;
}

.gif-panel{
left:10px;
bottom:78px;
width:calc(100vw - 20px);
}

.emoji-panel{
width:calc(100vw - 20px);
left:10px;
}

}

@media(min-width:700px){

.input-area{
max-width:850px;
left:50%;
transform:translateX(-50%);
border-radius:18px 18px 0 0;
}

}
</style>
</head>

<script>

/* =====================================================
FIREBASE
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",

authDomain:
"papatyawap.firebaseapp.com",

databaseURL:
"https://papatyawap-default-rtdb.firebaseio.com",

projectId:
"papatyawap",

storageBucket:
"papatyawap.firebasestorage.app",

messagingSenderId:
"29357315689",

appId:
"1:29357315689:web:78864218c204d291f734f8"

};

firebase.initializeApp(firebaseConfig);

const database =
firebase.database();


/* =====================================================
GIPHY API
===================================================== */

/*
BURAYA KENDİ GIPHY API ANAHTARINI YAZ.

ÖRNEK:

const GIPHY_API_KEY = "abc123...";
*/

const GIPHY_API_KEY =
"wZUjXSQmZ5TEx1UzVzqTY5BVwGcpShCy";


/* =====================================================
DEĞİŞKENLER
===================================================== */

let username = "";
let userKey = "";
let localStream = null;
let peerConnections = {};
let voiceActive = false;
let voiceListenerStarted = false;
let selectedMessageColor = "#ffffff";


/* =====================================================
WEBRTC
===================================================== */

const rtcConfig = {

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

};


/* =====================================================
RENK
===================================================== */

document
.querySelectorAll(".color-button")
.forEach(function(button){

button.onclick = function(){

selectedMessageColor =
this.dataset.color;

document
.querySelectorAll(".color-button")
.forEach(function(item){

item.classList.remove("selected");

});

this.classList.add("selected");

};

});


/* =====================================================
EMOJI
===================================================== */

const emojiButton =
document.getElementById("emojiButton");

const emojiPanel =
document.getElementById("emojiPanel");

const gifPanel =
document.getElementById("gifPanel");

emojiButton.onclick = function(){

emojiPanel.style.display =
emojiPanel.style.display === "block"
? "none"
: "block";

gifPanel.style.display = "none";

};

document
.querySelectorAll(".emoji-item")
.forEach(function(button){

button.onclick = function(){

const input =
document.getElementById("messageInput");

input.value += this.textContent;

input.focus();

};

});


/* =====================================================
GIF
===================================================== */

const gifButton =
document.getElementById("gifButton");

const gifSearchInput =
document.getElementById("gifSearchInput");

const gifSearchButton =
document.getElementById("gifSearchButton");

const gifResults =
document.getElementById("gifResults");

gifButton.onclick = function(){

gifPanel.style.display =
gifPanel.style.display === "block"
? "none"
: "block";

emojiPanel.style.display = "none";

};

gifSearchButton.onclick =
searchGIFs;

gifSearchInput.onkeydown =
function(event){

if(event.key === "Enter"){

event.preventDefault();

searchGIFs();

}

};


/* =====================================================
GIF ARAMA
===================================================== */

async function searchGIFs(){

const query =
gifSearchInput.value.trim();

if(!query){

gifResults.innerHTML =
'<div class="gif-empty">🔎 Önce GIF adı yazın</div>';

return;

}

if(
!GIPHY_API_KEY ||
GIPHY_API_KEY ===
"BURAYA_KENDI_GIPHY_API_KEY"
){

gifResults.innerHTML =
'<div class="gif-empty">' +
'⚠️ GIPHY API anahtarı eklenmemiş.<br><br>' +
'Kodun içindeki GIPHY_API_KEY bölümüne kendi anahtarınızı yazın.' +
'</div>';

return;

}

gifResults.innerHTML =
'<div class="gif-empty">⏳ GIF aranıyor...</div>';

try{

const url =
"https://api.giphy.com/v1/gifs/search" +
"?api_key=" +
encodeURIComponent(GIPHY_API_KEY) +
"&q=" +
encodeURIComponent(query) +
"&limit=24" +
"&rating=pg-13" +
"&lang=tr";

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}

const data =
await response.json();

if(
!data ||
!data.data ||
data.data.length === 0
){

gifResults.innerHTML =
'<div class="gif-empty">😔 GIF bulunamadı</div>';

return;

}

gifResults.innerHTML = "";

data.data.forEach(function(gif){

const images =
gif.images || {};

const previewUrl =
images.fixed_width?.webp ||
images.fixed_width?.url ||
images.preview_gif?.url ||
images.original?.url;

const originalUrl =
images.original?.url ||
previewUrl;

if(!previewUrl){

return;

}

const image =
document.createElement("img");

image.className =
"gif-result";

image.src =
previewUrl;

image.alt =
gif.title || "GIF";

image.loading =
"lazy";

image.onclick =
function(){

sendGIF(
previewUrl,
originalUrl
);

gifPanel.style.display =
"none";

};

gifResults.appendChild(image);

});

}
catch(error){

console.error(
"GIPHY hatası:",
error
);

gifResults.innerHTML =
'<div class="gif-empty">' +
'❌ GIF yüklenemedi.<br><br>' +
'API anahtarınızı kontrol edin.' +
'</div>';

}

}


/* =====================================================
GIF GÖNDER
===================================================== */

function sendGIF(
previewUrl,
originalUrl
){

if(!username){

return;

}

database
.ref("messages")
.push({

username:username,

type:"gif",

gif:originalUrl,

preview:previewUrl,

color:selectedMessageColor,

timestamp:Date.now()

});

}


/* =====================================================
GİRİŞ
===================================================== */

function enterChat(){

const input =
document.getElementById("usernameInput");

const name =
input.value.trim();

if(!name){

alert(
"Lütfen kullanıcı adını yaz."
);

input.focus();

return;

}

username =
name;

document.getElementById("login")
.style.display = "none";

document.getElementById("chatPage")
.style.display = "block";

loadMessages();

setOnline();

}

document.getElementById("loginButton")
.onclick =
enterChat;

document.getElementById("usernameInput")
.onkeydown =
function(event){

if(event.key === "Enter"){

enterChat();

}

};


/* =====================================================
MESAJLARI YÜKLE
===================================================== */

function loadMessages(){

database
.ref("messages")
.on("value",function(snapshot){

const chat =
document.getElementById("chat");

chat.innerHTML = "";

snapshot.forEach(function(child){

const message =
child.val();

if(!message){

return;

}

const box =
document.createElement("div");

box.className =
"message";

if(
message.username === username
){

box.classList.add("my-message");

}


/* KULLANICI */

const user =
document.createElement("div");

user.className =
"username";

user.textContent =
message.username;


/* SAAT */

if(message.timestamp){

const time =
document.createElement("span");

time.className =
"time";

time.textContent =
new Date(
message.timestamp
).toLocaleTimeString(
"tr-TR",
{
hour:"2-digit",
minute:"2-digit"
}
);

user.appendChild(time);

}


/* SİL */

if(
message.username === username
){

const deleteButton =
document.createElement("button");

deleteButton.className =
"delete";

deleteButton.textContent =
"Sil";

deleteButton.onclick =
function(){

child.ref.remove();

};

user.appendChild(deleteButton);

}


/* GIF */

if(
message.type === "gif" &&
message.gif
){

const gifBox =
document.createElement("div");

gifBox.className =
"gif-message";

const gifImage =
document.createElement("img");

gifImage.src =
message.preview ||
message.gif;

gifImage.alt =
"GIF";

gifImage.onclick =
function(){

window.open(
message.gif,
"_blank"
);

};

gifBox.appendChild(
gifImage
);

box.appendChild(user);
box.appendChild(gifBox);

chat.appendChild(box);

return;

}


/* NORMAL MESAJ */

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
message.text || "";

if(message.color){

bubble.style.color =
message.color;

}

box.appendChild(user);
box.appendChild(bubble);

chat.appendChild(box);

});

chat.scrollTop =
chat.scrollHeight;

});

}


/* =====================================================
MESAJ GÖNDER
===================================================== */

function sendMessage(){

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(!text || !username){

return;

}

database
.ref("messages")
.push({

username:username,

text:text,

color:selectedMessageColor,

type:"text",

timestamp:Date.now()

});

input.value = "";

input.focus();

}

document.getElementById("sendButton")
.onclick =
sendMessage;

document.getElementById("messageInput")
.onkeydown =
function(event){

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

};


/* =====================================================
ÇEVRİMİÇİ
===================================================== */

function setOnline(){

const ref =
database
.ref("onlineUsers")
.push();

userKey =
ref.key;

ref.set({

username:username,

timestamp:
firebase.database.ServerValue.TIMESTAMP

});

ref.onDisconnect().remove();

database
.ref("onlineUsers")
.on("value",function(snapshot){

const count =
snapshot.numChildren();

document.getElementById(
"onlineText"
).textContent =
"🟢 " +
count +
" kişi çevrimiçi";

const names = [];

snapshot.forEach(function(child){

const user =
child.val();

if(
user &&
user.username
){

names.push(
user.username
);

}

});

document.getElementById(
"onlineUsersText"
).textContent =
names.length
?
"👥 " + names.join(", ")
:
"👥 Kimse yok";

});

}


/* =====================================================
SES DURUMU
===================================================== */

function showVoiceStatus(text){

const status =
document.getElementById(
"voiceStatus"
);

status.textContent =
text;

status.style.display =
"block";

}

function hideVoiceStatus(){

document.getElementById(
"voiceStatus"
).style.display =
"none";

}


/* =====================================================
MİKROFON
===================================================== */

async function startVoiceChat(){

try{

showVoiceStatus(
"🎤 Mikrofon açılıyor..."
);

localStream =
await navigator
.mediaDevices
.getUserMedia({
audio:true,
video:false
});

voiceActive =
true;

const button =
document.getElementById(
"voiceButton"
);

button.textContent =
"🔴 Sesi Kapat";

button.classList.add(
"active"
);

startVoiceListener();

showVoiceStatus(
"🎤 Sesli sohbet aktif"
);

const callsSnapshot =
await database
.ref("calls")
.once("value");

let foundCall =
false;

callsSnapshot.forEach(function(child){

const call =
child.val();

if(
call &&
call.receiver === username
){

foundCall = true;

answerCall(
child.key,
call
);

}

});

if(!foundCall){

await createCall();

}

}
catch(error){

console.error(
"Mikrofon hatası:",
error
);

alert(
"Mikrofon açılamadı:\n\n" +
error.name +
"\n" +
error.message
);

}

}


/* SES BUTONU */

document.getElementById(
"voiceButton"
).onclick =
async function(){

if(voiceActive){

stopVoiceChat();

}
else{

await startVoiceChat();

}

};


/* =====================================================
ÇAĞRI DİNLE
===================================================== */

function startVoiceListener(){

if(voiceListenerStarted){

return;

}

voiceListenerStarted =
true;

database
.ref("calls")
.on(
"child_added",
async function(snapshot){

const call =
snapshot.val();

const callId =
snapshot.key;

if(!call){

return;

}

if(
call.caller === username
){

return;

}

if(
call.receiver !== username
){

return;

}

if(
peerConnections[callId]
){

return;

}

if(!voiceActive){

return;

}

await answerCall(
callId,
call
);

}
);

}


/* =====================================================
ÇAĞRI BAŞLAT
===================================================== */

async function createCall(){

if(!localStream){

return;

}

const usersSnapshot =
await database
.ref("onlineUsers")
.once("value");

let otherUser =
null;

usersSnapshot.forEach(function(child){

const user =
child.val();

if(
user &&
user.username &&
user.username !== username &&
!otherUser
){

otherUser =
user.username;

}

});

if(!otherUser){

showVoiceStatus(
"🎤 Mikrofon açık - başka kullanıcı bekleniyor"
);

return;

}

const callRef =
database
.ref("calls")
.push();

const callId =
callRef.key;

const pc =
new RTCPeerConnection(
rtcConfig
);

peerConnections[callId] =
pc;

localStream
.getTracks()
.forEach(function(track){

pc.addTrack(
track,
localStream
);

});

pc.ontrack =
function(event){

const audio =
document.getElementById(
"remoteAudio"
);

audio.srcObject =
event.streams[0];

audio.play()
.catch(function(error){

console.log(
"Audio play:",
error
);

});

showVoiceStatus(
"🔊 Ses bağlantısı kuruldu"
);

};

pc.onicecandidate =
function(event){

if(event.candidate){

database
.ref(
"calls/" +
callId +
"/callerCandidates"
)
.push(
event.candidate.toJSON()
);

}

};

const offer =
await pc.createOffer();

await pc.setLocalDescription(
offer
);

await callRef.set({

caller:username,

receiver:otherUser,

offer:{

type:offer.type,

sdp:offer.sdp

},

created:Date.now()

});

database
.ref(
"calls/" +
callId +
"/answer"
)
.on(
"value",
async function(snapshot){

const answer =
snapshot.val();

if(
answer &&
!pc.currentRemoteDescription
){

await pc.setRemoteDescription(
new RTCSessionDescription(
answer
)
);

}

}
);

database
.ref(
"calls/" +
callId +
"/receiverCandidates"
)
.on(
"child_added",
async function(snapshot){

const candidate =
snapshot.val();

if(candidate){

try{

await pc.addIceCandidate(
new RTCIceCandidate(
candidate
)
);

}
catch(error){

console.log(error);

}

}

}
);

}


/* =====================================================
ÇAĞRIYI CEVAPLA
===================================================== */

async function answerCall(
callId,
call
){

if(
!localStream ||
!voiceActive
){

return;

}

const pc =
new RTCPeerConnection(
rtcConfig
);

peerConnections[callId] =
pc;

localStream
.getTracks()
.forEach(function(track){

pc.addTrack(
track,
localStream
);

});

pc.ontrack =
function(event){

const audio =
document.getElementById(
"remoteAudio"
);

audio.srcObject =
event.streams[0];

audio.play()
.catch(function(error){

console.log(error);

});

showVoiceStatus(
"🔊 Ses bağlantısı kuruldu"
);

};

pc.onicecandidate =
function(event){

if(event.candidate){

database
.ref(
"calls/" +
callId +
"/receiverCandidates"
)
.push(
event.candidate.toJSON()
);

}

};

await pc.setRemoteDescription(
new RTCSessionDescription(
call.offer
)
);

const answer =
await pc.createAnswer();

await pc.setLocalDescription(
answer
);

await database
.ref(
"calls/" +
callId +
"/answer"
)
.set({

type:answer.type,

sdp:answer.sdp

});

database
.ref(
"calls/" +
callId +
"/callerCandidates"
)
.on(
"child_added",
async function(snapshot){

const candidate =
snapshot.val();

if(candidate){

try{

await pc.addIceCandidate(
new RTCIceCandidate(
candidate
)
);

}
catch(error){

console.log(error);

}

}

}
);

}


/* =====================================================
SESİ KAPAT
===================================================== */

function stopVoiceChat(){

voiceActive =
false;

if(localStream){

localStream
.getTracks()
.forEach(function(track){

track.stop();

});

localStream =
null;

}

Object.keys(
peerConnections
)
.forEach(function(id){

try{

peerConnections[id].close();

}
catch(error){

console.log(error);

}

});

peerConnections = {};

const audio =
document.getElementById(
"remoteAudio"
);

audio.srcObject =
null;

const button =
document.getElementById(
"voiceButton"
);

button.textContent =
"🎤 Sesli Sohbet";

button.classList.remove(
"active"
);

hideVoiceStatus();

database
.ref("calls")
.once(
"value",
function(snapshot){

snapshot.forEach(function(child){

const call =
child.val();

if(
call &&
(
call.caller === username ||
call.receiver === username
)
){

child.ref.remove();

}

});

}
);

}


/* =====================================================
ÇIKIŞ
===================================================== */

document.getElementById(
"logoutButton"
).onclick =
function(){

stopVoiceChat();

if(userKey){

database
.ref(
"onlineUsers/" +
userKey
)
.remove();

}

location.reload();

};
