<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f0e8;
    color:#222;
    overflow:hidden;
}

/* =========================
   GİRİŞ
========================= */

#login{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    padding:38px 28px;
    text-align:center;
    background:#fffdf7;
    border:1px solid #e5dfd2;
    border-radius:24px;
    box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.login-box h1{
    margin:0;
    font-size:28px;
}

.subtitle{
    margin:10px 0 28px;
    color:#77736b;
    font-size:14px;
}

#usernameInput{
    width:100%;
    height:52px;
    padding:0 17px;
    border:1px solid #d8d3c8;
    border-radius:15px;
    outline:none;
    font-size:16px;
}

#loginButton{
    width:100%;
    height:52px;
    margin-top:13px;
    border:0;
    border-radius:15px;
    background:#333;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   SOHBET
========================= */

#chatPage{
    display:none;
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* =========================
   ÜST BAR
========================= */

.header{
    position:relative;
    z-index:20;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 18px;
    background:#fffdf7;
    border-bottom:1px solid #ded9cf;
}

.header-info{
    min-width:0;
    flex:1;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.online{
    margin-top:5px;
    color:#159957;
    font-size:12px;
}

.online-users{
    margin-top:4px;
    color:#77736b;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-buttons{
    display:flex;
    align-items:center;
    gap:7px;
}

.logout,
.voice-button{
    min-height:40px;
    border:1px solid #d8d3c8;
    border-radius:12px;
    padding:9px 12px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.logout{
    background:#eeeae1;
}

.voice-button{
    background:#d9f4e5;
    color:#08783f;
    border-color:#b7dfc8;
}

.voice-button.active{
    background:#ffe0e3;
    color:#c72f42;
    border-color:#f1b7bf;
}

/* =========================
   MESAJ ALANI
========================= */

.chat{
    position:absolute;
    top:76px;
    left:0;
    right:0;
    bottom:146px;

    max-width:850px;
    width:100%;
    margin:auto;

    padding:20px 16px 30px;

    overflow-y:auto;
    overflow-x:hidden;

    z-index:5;
}

.message{
    width:100%;
    margin-bottom:18px;
}

.username{
    margin-bottom:4px;
    color:#2878d4;
    font-size:12px;
    font-weight:bold;
}

.my-message{
    text-align:right;
}

.my-message .username{
    color:#159957;
}

.time{
    margin-left:7px;
    color:#8c877d;
    font-size:10px;
}

.delete{
    border:0;
    background:transparent;
    color:#e34b5f;
    font-size:10px;
    cursor:pointer;
    margin-left:7px;
}

.bubble{
    display:block;
    max-width:100%;
    line-height:1.55;
    word-break:break-word;
    overflow-wrap:anywhere;
    color:#333;
}

/* =========================
   RESİM
========================= */

.image-message{
    display:inline-block;
    max-width:280px;
    margin-top:5px;
}

.image-message img{
    display:block;
    max-width:280px;
    max-height:350px;
    border-radius:15px;
    cursor:pointer;
}

/* =========================
   GIF
========================= */

.gif-message{
    display:inline-block;
    max-width:280px;
    margin-top:5px;
    overflow:hidden;
    border-radius:15px;
}

.gif-message img{
    display:block;
    width:100%;
    max-width:280px;
    border-radius:15px;
    cursor:pointer;
}

/* =========================
   SAYFALAMA
========================= */

.pagination{
    position:fixed;
    left:0;
    right:0;
    bottom:108px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;

    padding:3px 8px;

    background:rgba(255,253,247,.97);
    border-top:1px solid #ded9cf;

    z-index:18;

    overflow-x:auto;
    scrollbar-width:none;
}

.pagination::-webkit-scrollbar{
    display:none;
}

.page-button{
    flex:0 0 auto;
    min-width:28px;
    height:28px;

    padding:0 7px;

    border:1px solid #d8d3c8;
    border-radius:8px;

    background:#eeeae1;
    color:#333;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

.page-button.active{
    background:#333;
    color:#fff;
    border-color:#333;
}

.page-button:disabled{
    opacity:.4;
    cursor:default;
}

/* =========================
   ALT PANEL
========================= */

.input-area{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    height:108px;
    min-height:108px;

    padding:8px;

    background:#fffdf7;
    border-top:1px solid #ded9cf;

    z-index:25;
}

.tools-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:7px;
    min-height:38px;
}

.tool-button{
    width:42px;
    height:38px;
    flex:0 0 auto;

    border:1px solid #d8d3c8;
    border-radius:10px;

    background:#eeeae1;
    color:#333;

    font-size:18px;
    cursor:pointer;
}

.gif-button{
    font-size:12px;
    font-weight:bold;
}

.color-label{
    color:#77736b;
    font-size:11px;
}

.color-buttons{
    display:flex;
    gap:5px;
}

.color-button{
    width:21px;
    height:21px;

    border-radius:50%;
    border:2px solid rgba(0,0,0,.2);

    cursor:pointer;
}

.color-button.selected{
    border:3px solid #222;
}

.color-white{background:#333;}
.color-pink{background:#ff69b4;}
.color-blue{background:#2878d4;}
.color-green{background:#159957;}
.color-yellow{background:#c99400;}
.color-red{background:#e34b5f;}

.message-row{
    display:flex;
    align-items:center;
    gap:7px;
}

.message-input{
    flex:1;
    min-width:0;
    height:46px;

    border:1px solid #d8d3c8;
    border-radius:15px;

    padding:0 15px;

    outline:none;
    font-size:15px;
}

.send{
    width:50px;
    height:46px;
    flex:0 0 auto;

    border:0;
    border-radius:15px;

    background:#333;
    color:#fff;

    font-size:20px;
    cursor:pointer;
}

/* =========================
   EMOJI
========================= */

.emoji-panel{
    display:none;

    position:fixed;
    left:10px;
    bottom:114px;

    width:300px;
    max-height:240px;

    overflow-y:auto;

    padding:12px;

    background:#fffdf7;
    border:1px solid #d8d3c8;
    border-radius:18px;

    box-shadow:0 15px 45px rgba(0,0,0,.2);

    z-index:40;
}

.emoji-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:6px;
}

.emoji-item{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
}

/* =========================
   GIF PANEL
========================= */

.gif-panel{
    display:none;

    position:fixed;
    left:60px;
    bottom:114px;

    width:350px;
    max-width:calc(100vw - 20px);
    height:430px;

    background:#fffdf7;

    border:1px solid #d8d3c8;
    border-radius:18px;

    box-shadow:0 15px 45px rgba(0,0,0,.2);

    z-index:40;
    overflow:hidden;
}

.gif-search{
    display:flex;
    gap:7px;
    padding:10px;
    border-bottom:1px solid #ded9cf;
}

.gif-search input{
    flex:1;
    height:40px;

    border:1px solid #d8d3c8;
    border-radius:10px;

    padding:0 12px;
    outline:none;
}

.gif-search button{
    width:45px;

    border:0;
    border-radius:10px;

    background:#333;
    color:#fff;

    cursor:pointer;
}

.gif-results{
    height:350px;
    overflow-y:auto;

    padding:10px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.gif-result{
    width:100%;
    height:120px;

    object-fit:cover;

    border-radius:10px;

    cursor:pointer;
}

.gif-empty{
    grid-column:1/-1;
    text-align:center;
    padding:30px 10px;
    color:#77736b;
}

/* =========================
   SES DURUMU
========================= */

#voiceStatus{
    display:none;

    position:fixed;
    left:50%;
    bottom:120px;

    transform:translateX(-50%);

    background:#fffdf7;
    border:1px solid #d8d3c8;

    padding:11px 18px;

    border-radius:25px;

    font-size:13px;

    z-index:50;

    box-shadow:0 10px 30px rgba(0,0,0,.2);

    white-space:nowrap;
}

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .header{
        height:62px;
        padding:7px 9px;
    }

    .header-title{
        font-size:14px;
    }

    .online{
        font-size:11px;
    }

    .online-users{
        max-width:145px;
        font-size:10px;
    }

    .header-buttons{
        gap:4px;
    }

    .voice-button,
    .logout{
        min-height:36px;
        padding:7px 8px;
        font-size:10px;
    }

    .voice-button{
        max-width:105px;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .chat{
        top:62px;
        bottom:132px;
        padding:15px 10px 30px;
    }

    .pagination{
        bottom:94px;
        height:38px;
        justify-content:flex-start;
    }

    .input-area{
        height:94px;
        min-height:94px;
    }

    .tools-row{
        gap:4px;
        min-height:32px;
        margin-bottom:6px;
    }

    .tool-button{
        width:37px;
        height:32px;
        font-size:16px;
    }

    .color-label{
        display:none;
    }

    .color-button{
        width:18px;
        height:18px;
    }

    .message-input{
        height:42px;
        font-size:14px;
    }

    .send{
        width:44px;
        height:42px;
    }

    .emoji-panel{
        width:calc(100vw - 20px);
        bottom:104px;
    }

    .gif-panel{
        left:10px;
        bottom:104px;
        width:calc(100vw - 20px);
    }

    #voiceStatus{
        bottom:105px;
        max-width:calc(100vw - 30px);
        overflow:hidden;
        text-overflow:ellipsis;
    }

}

</style>
</head>

<body>

<!-- =========================
     GİRİŞ
========================= -->

<div id="login">

    <div class="login-box">

        <h1>💬 Ritmix Sohbet</h1>

        <div class="subtitle">
            Sohbete katılmak için kullanıcı adını yaz
        </div>

        <input
            id="usernameInput"
            maxlength="20"
            placeholder="Kullanıcı adın..."
            autocomplete="off"
        >

        <button id="loginButton">
            SOHBETE GİR
        </button>

    </div>

</div>


<!-- =========================
     SOHBET
========================= -->

<div id="chatPage">

    <div class="header">

        <div class="header-info">

            <div class="header-title">
                💬 Ritmix Sohbet
            </div>

            <div
                class="online"
                id="onlineText"
            >
                🟢 0 kişi çevrimiçi
            </div>

            <div
                class="online-users"
                id="onlineUsersText"
            >
                👥 Kimse yok
            </div>

        </div>


        <div class="header-buttons">

            <button
                class="voice-button"
                id="voiceButton"
            >
                🎤 Sesli Sohbet
            </button>

            <button
                class="logout"
                id="logoutButton"
            >
                Çıkış
            </button>

        </div>

    </div>


    <!-- MESAJLAR -->

    <div
        class="chat"
        id="chat"
    ></div>


    <!-- SAYFALAR -->

    <div
        class="pagination"
        id="pagination"
    ></div>


    <!-- EMOJI -->

    <div
        class="emoji-panel"
        id="emojiPanel"
    >

        <div class="emoji-grid">

            <button class="emoji-item">😀</button>
            <button class="emoji-item">😂</button>
            <button class="emoji-item">🤣</button>
            <button class="emoji-item">😊</button>
            <button class="emoji-item">😍</button>
            <button class="emoji-item">😘</button>
            <button class="emoji-item">🥰</button>
            <button class="emoji-item">😎</button>

            <button class="emoji-item">😢</button>
            <button class="emoji-item">😭</button>
            <button class="emoji-item">😡</button>
            <button class="emoji-item">😱</button>
            <button class="emoji-item">🤔</button>
            <button class="emoji-item">🙄</button>
            <button class="emoji-item">😴</button>
            <button class="emoji-item">🤗</button>

            <button class="emoji-item">❤️</button>
            <button class="emoji-item">🧡</button>
            <button class="emoji-item">💛</button>
            <button class="emoji-item">💚</button>
            <button class="emoji-item">💙</button>
            <button class="emoji-item">💜</button>
            <button class="emoji-item">🖤</button>
            <button class="emoji-item">💔</button>

            <button class="emoji-item">🔥</button>
            <button class="emoji-item">🎉</button>
            <button class="emoji-item">🎊</button>
            <button class="emoji-item">👏</button>
            <button class="emoji-item">👍</button>
            <button class="emoji-item">👎</button>
            <button class="emoji-item">💯</button>
            <button class="emoji-item">✨</button>

            <button class="emoji-item">😉</button>
            <button class="emoji-item">😜</button>
            <button class="emoji-item">😇</button>
            <button class="emoji-item">🥳</button>
            <button class="emoji-item">🤩</button>
            <button class="emoji-item">😏</button>
            <button class="emoji-item">😌</button>
            <button class="emoji-item">🤪</button>

        </div>

    </div>


    <!-- GIF PANEL -->

    <div
        class="gif-panel"
        id="gifPanel"
    >

        <div class="gif-search">

            <input
                id="gifSearchInput"
                placeholder="GIF ara..."
                autocomplete="off"
            >

            <button id="gifSearchButton">
                🔎
            </button>

        </div>

        <div
            class="gif-results"
            id="gifResults"
        >

            <div class="gif-empty">
                🔎 Bir GIF arayın
            </div>

        </div>

    </div>


    <!-- ALT PANEL -->

    <div class="input-area">

        <div class="tools-row">

            <button
                class="tool-button"
                id="emojiButton"
                title="Emoji"
            >
                😀
            </button>

            <button
                class="tool-button gif-button"
                id="gifButton"
                title="GIF"
            >
                GIF
            </button>

            <button
                class="tool-button"
                id="imageButton"
                title="Resim / GIF yükle"
            >
                🖼️
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <span class="color-label">
                🎨
            </span>

            <div class="color-buttons">

                <button
                    class="color-button color-white selected"
                    data-color="#333333"
                ></button>

                <button
                    class="color-button color-pink"
                    data-color="#ff69b4"
                ></button>

                <button
                    class="color-button color-blue"
                    data-color="#2878d4"
                ></button>

                <button
                    class="color-button color-green"
                    data-color="#159957"
                ></button>

                <button
                    class="color-button color-yellow"
                    data-color="#c99400"
                ></button>

                <button
                    class="color-button color-red"
                    data-color="#e34b5f"
                ></button>

            </div>

        </div>


        <div class="message-row">

            <input
                class="message-input"
                id="messageInput"
                placeholder="Mesajınızı yazın..."
                autocomplete="off"

            <button
                class="send"
                id="sendButton"

                ➤
            </button>

        </div>

    </div>

</div>


<div id="voiceStatus">
    🎤 Sesli sistem hazırlanıyor...
</div>

<audio
    id="remoteAudio"
    autoplay
    playsinline
></audio>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",

    authDomain:
        "papatyawap.firebaseapp.com",

    databaseURL:
        "https://papatyawap-default-rtdb.firebaseio.com",

    projectId:
        "papatyawap",

    storageBucket:
        "papatyawap.firebasestorage.app",

    messagingSenderId:
        "29357315689",

    appId:
        "1:29357315689:web:78864218c204d291f734f8"

};

firebase.initializeApp(firebaseConfig);

const database =
    firebase.database();

const storage =
    firebase.storage();


/* =====================================================
   GIPHY
===================================================== */

const GIPHY_API_KEY =
    "wZUjXSQmZ5TEx1UzVzqTY5BVwGcpShCy";


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let username = "";
let userKey = "";

let selectedMessageColor =
    "#333333";

let allMessages = [];

let currentPage = 1;

const MESSAGES_PER_PAGE = 8;
const MAX_PAGES = 20;

let localStream = null;
let voiceActive = false;

let peerConnections = {};
let voiceListenerStarted = false;


const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =====================================================
   ELEMENTLER
===================================================== */

const chat =
    document.getElementById("chat");

const pagination =
    document.getElementById(
        "pagination"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const emojiButton =
    document.getElementById(
        "emojiButton"
    );

const emojiPanel =
    document.getElementById(
        "emojiPanel"
    );

const gifButton =
    document.getElementById(
        "gifButton"
    );

const gifPanel =
    document.getElementById(
        "gifPanel"
    );

const imageButton =
    document.getElementById(
        "imageButton"
    );

const imageInput =
    document.getElementById(
        "imageInput"
    );


/* =====================================================
   RENK
===================================================== */

document
.querySelectorAll(".color-button")
.forEach(function(button){

    button.onclick =
    function(){

        selectedMessageColor =
            this.dataset.color;

        document
        .querySelectorAll(
            ".color-button"
        )
        .forEach(function(item){

            item.classList.remove(
                "selected"
            );

        });

        this.classList.add(
            "selected"
        );

    };

});


/* =====================================================
   EMOJI
===================================================== */

emojiButton.onclick =
function(){

    emojiPanel.style.display =
        emojiPanel.style.display ===
        "block"
        ? "none"
        : "block";

    gifPanel.style.display =
        "none";

};

document
.querySelectorAll(".emoji-item")
.forEach(function(button){

    button.onclick =
    function(){

        messageInput.value +=
            this.textContent;

        messageInput.focus();

    };

});


/* =====================================================
   GIF
===================================================== */

gifButton.onclick =
function(){

    gifPanel.style.display =
        gifPanel.style.display ===
        "block"
        ? "none"
        : "block";

    emojiPanel.style.display =
        "none";

};


document
.getElementById("gifSearchButton")
.onclick =
searchGIFs;


document
.getElementById("gifSearchInput")
.onkeydown =
function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        searchGIFs();

    }

};


async function searchGIFs(){

    const input =
        document.getElementById(
            "gifSearchInput"
        );

    const results =
        document.getElementById(
            "gifResults"
        );

    const query =
        input.value.trim();

    if(!query){

        results.innerHTML =
            '<div class="gif-empty">🔎 Önce GIF adı yazın</div>';

        return;

    }

    results.innerHTML =
        '<div class="gif-empty">⏳ GIF aranıyor...</div>';

    try{

        const url =
            "https://api.giphy.com/v1/gifs/search" +
            "?api_key=" +
            encodeURIComponent(
                GIPHY_API_KEY
            ) +
            "&q=" +
            encodeURIComponent(
                query
            ) +
            "&limit=24" +
            "&rating=pg-13" +
            "&lang=tr";

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(
            !data.data ||
            data.data.length === 0
        ){

            results.innerHTML =
                '<div class="gif-empty">😔 GIF bulunamadı</div>';

            return;

        }

        results.innerHTML = "";

        data.data.forEach(
        function(gif){

            const images =
                gif.images || {};

            const preview =
                images.fixed_width?.webp ||
                images.fixed_width?.url ||
                images.preview_gif?.url ||
                images.original?.url;

            const original =
                images.original?.url ||
                preview;

            if(!preview) return;

            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "gif-result";

            img.src =
                preview;

            img.alt =
                gif.title || "GIF";

            img.loading =
                "lazy";

            img.onclick =
            function(){

                database
                .ref("messages")
                .push({

                    username:
                        username,

                    type:
                        "gif",

                    gif:
                        original,

                    preview:
                        preview,

                    color:
                        selectedMessageColor,

                    timestamp:
                        Date.now()

                });

                gifPanel.style.display =
                    "none";

            };

            results.appendChild(
                img
            );

        });

    }
    catch(error){

        console.error(error);

        results.innerHTML =
            '<div class="gif-empty">❌ GIF yüklenemedi</div>';

    }

}

/* =====================================================
   MESAJLARI YÜKLE
===================================================== */

function loadMessages(){

    database
    .ref("messages")
    .on(
        "value",
        function(snapshot){

            allMessages = [];

            snapshot.forEach(
            function(child){

                const message =
                    child.val();

                if(!message)
                    return;

                allMessages.push({

                    key:
                        child.key,

                    child:
                        child,

                    message:
                        message

                });

            });


            /*
             * FIREBASE:
             *
             * eski → yeni
             *
             * Biz:
             *
             * yeni → eski
             *
             * Böylece 1. sayfada
             * en yeni mesajlar olur.
             */

            allMessages.reverse();


            const totalPages =
                Math.max(
                    1,
                    Math.min(
                        MAX_PAGES,
                        Math.ceil(
                            allMessages.length /
                            MESSAGES_PER_PAGE
                        )
                    )
                );


            if(
                currentPage >
                totalPages
            ){

                currentPage =
                    totalPages;

            }


            renderCurrentPage();

        }
    );

}


/* =====================================================
   MEVCUT SAYFAYI GÖSTER
===================================================== */

function renderCurrentPage(){

    chat.innerHTML =
        "";

    const totalPages =
        Math.max(
            1,
            Math.min(
                MAX_PAGES,
                Math.ceil(
                    allMessages.length /
                    MESSAGES_PER_PAGE
                )
            )
        );


    const start =
        (currentPage - 1) *
        MESSAGES_PER_PAGE;


    const messages =
        allMessages.slice(
            start,
            start +
            MESSAGES_PER_PAGE
        );


    messages.forEach(
    function(item){

        const message =
            item.message;

        const child =
            item.child;


        const box =
            document.createElement(
                "div"
            );

        box.className =
            "message";


        if(
            message.username ===
            username
        ){

            box.classList.add(
                "my-message"
            );

        }


        /* KULLANICI */

        const user =
            document.createElement(
                "div"
            );

        user.className =
            "username";

        user.textContent =
            message.username ||
            "";


        /* SAAT */

        if(message.timestamp){

            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "time";

            time.textContent =
                new Date(
                    message.timestamp
                ).toLocaleTimeString(
                    "tr-TR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

            user.appendChild(
                time
            );

        }


        /* SİL */

        if(
            message.username ===
            username
        ){

            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "delete";

            del.textContent =
                "Sil";

            del.onclick =
            function(){

                child.ref.remove();

            };

            user.appendChild(
                del
            );

        }


        /* RESİM */

        if(
            message.type ===
                "image" &&
            message.image
        ){

            const imageBox =
                document.createElement(
                    "div"
                );

            imageBox.className =
                "image-message";


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                message.image;

            img.alt =
                message.fileName ||
                "Resim";

            img.onclick =
            function(){

                window.open(
                    message.image,
                    "_blank"
                );

            };


            imageBox.appendChild(
                img
            );

            box.appendChild(
                user
            );

            box.appendChild(
                imageBox
            );

            chat.appendChild(
                box
            );

            return;

        }


        /* GIF */

        if(
            message.type ===
                "gif" &&
            message.gif
        ){

            const gifBox =
                document.createElement(
                    "div"
                );

            gifBox.className =
                "gif-message";


            const img =
                document.createElement(
                    "img"
                );

            img.src =
                message.preview ||
                message.gif;

            img.alt =
                "GIF";


            img.onclick =
            function(){

                window.open(
                    message.gif,
                    "_blank"
                );

            };


            gifBox.appendChild(
                img
            );

            box.appendChild(
                user
            );

            box.appendChild(
                gifBox
            );

            chat.appendChild(
                box
            );

            return;

        }


        /* YAZI */

        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";

        bubble.textContent =
            message.text ||
            "";


        if(message.color){

            bubble.style.color =
                message.color;

        }


        box.appendChild(
            user
        );

        box.appendChild(
            bubble
        );

        chat.appendChild(
            box
        );

    });


    renderPagination(
        totalPages
    );


    /*
     * EN YENİ MESAJ
     * HER ZAMAN ÜSTTE
     */

    chat.scrollTop =
        0;

}


/* =====================================================
   SAYFA NUMARALARI
===================================================== */

function renderPagination(
    totalPages
){

    pagination.innerHTML =
        "";


    for(
        let page = 1;
        page <= MAX_PAGES;
        page++
    ){

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "page-button";

        button.textContent =
            page;


        if(
            page === currentPage
        ){

            button.classList.add(
                "active"
            );

        }


        if(
            page > totalPages
        ){

            button.disabled =
                true;

        }


        button.onclick =
        function(){

            if(
                page >
                totalPages
            )
                return;

            currentPage =
                page;

            renderCurrentPage();

            chat.scrollTop =
                0;

        };


        pagination.appendChild(
            button
        );

    }

}

/* =====================================================
   RESİM / GIF DOSYASI YÜKLEME
===================================================== */

imageButton.onclick =
function(){

    imageInput.click();

};


imageInput.onchange =
async function(){

    const file =
        this.files[0];

    if(!file)
        return;


    if(!username){

        alert(
            "Önce sohbete giriş yapın."
        );

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "Lütfen resim veya GIF seçin."
        );

        return;

    }


    try{

        imageButton.textContent =
            "⏳";


        const safeName =
            Date.now() +
            "_" +
            file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


        const storageRef =
            storage
            .ref(
                "chatImages/" +
                safeName
            );


        await storageRef.put(
            file
        );


        const url =
            await storageRef.getDownloadURL();


        await database
        .ref("messages")
        .push({

            username:
                username,

            type:
                "image",

            image:
                url,

            fileName:
                file.name,

            color:
                selectedMessageColor,

            timestamp:
                Date.now()

        });


        currentPage =
            1;


    }
    catch(error){

        console.error(
            "Resim yükleme hatası:",
            error
        );

        alert(
            "Resim yüklenemedi.\n\n" +
            error.message
        );

    }
    finally{

        imageButton.textContent =
            "🖼️";

        imageInput.value =
            "";

    }

};


/* =====================================================
   ÇEVRİMİÇİ KULLANICILAR
===================================================== */

function setOnline(){

    const ref =
        database
        .ref("onlineUsers")
        .push();


    userKey =
        ref.key;


    ref.set({

        username:
            username,

        timestamp:
            firebase.database
            .ServerValue
            .TIMESTAMP

    });


    ref.onDisconnect()
       .remove();


    database
    .ref("onlineUsers")
    .on(
        "value",
        function(snapshot){

            const count =
                snapshot.numChildren();


            document
            .getElementById(
                "onlineText"
            )
            .textContent =
                "🟢 " +
                count +
                " kişi çevrimiçi";


            const names = [];


            snapshot.forEach(
            function(child){

                const user =
                    child.val();

                if(
                    user &&
                    user.username
                ){

                    names.push(
                        user.username
                    );

                }

            });


            document
            .getElementById(
                "onlineUsersText"
            )
            .textContent =
                names.length
                ? "👥 " +
                  names.join(", ")
                : "👥 Kimse yok";

        }
    );

}

        "voiceStatus"
    )

/* =====================================================
   SESLİ SOHBET
===================================================== */

async function startVoiceChat(){

    try{

        showVoiceStatus(
            "🎤 Mikrofon açılıyor..."
        );


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:true,
                video:false

            });


        voiceActive =
            true;


        const button =
            document.getElementById(
                "voiceButton"
            );

        button.textContent =
            "🔴 Sesi Kapat";

        button.classList.add(
            "active"
        );


        startVoiceListener();


        showVoiceStatus(
            "🎤 Sesli sohbet aktif"
        );


        const calls =
            await database
            .ref("calls")
            .once("value");


        let found =
            false;


        calls.forEach(
        function(child){

            const call =
                child.val();


            if(
                call &&
                call.receiver ===
                    username
            ){

                found =
                    true;

                answerCall(
                    child.key,
                    call
                );

            }

        });


        if(!found){

            await createCall();

        }

    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Mikrofon açılamadı.\n\n" +
            error.message
        );

        voiceActive =
            false;

    }

}


/* =====================================================
   SES BUTONU
===================================================== */

document
.getElementById("voiceButton")
.onclick =
async function(){

    if(voiceActive){

        stopVoiceChat();

    }
    else{

        await startVoiceChat();

    }

};


/* =====================================================
   ÇAĞRILARI DİNLE
===================================================== */

function startVoiceListener(){

    if(
        voiceListenerStarted
    )
        return;


    voiceListenerStarted =
        true;


    database
    .ref("calls")
    .on(
        "child_added",
        async function(snapshot){

            const call =
                snapshot.val();

            const callId =
                snapshot.key;


            if(!call)
                return;


            if(
                call.caller ===
                username
            )
                return;


            if(
                call.receiver !==
                username
            )
                return;


            if(
                peerConnections[
                    callId
                ]
            )
                return;


            if(!voiceActive)
                return;


            try{

                await answerCall(
                    callId,
                    call
                );

            }
            catch(error){

                console.error(
                    error
                );

            }

        }
    );

}


/* =====================================================
   ÇAĞRI BAŞLAT
===================================================== */

async function createCall(){

    if(!localStream)
        return;


    const users =
        await database
        .ref("onlineUsers")
        .once("value");


    let otherUser =
        null;


    users.forEach(
    function(child){

        const user =
            child.val();


        if(
            user &&
            user.username &&
            user.username !==
                username &&
            !otherUser
        ){

            otherUser =
                user.username;

        }

    });


    if(!otherUser){

        showVoiceStatus(
            "🎤 Mikrofon açık - başka kullanıcı bekleniyor"
        );

        return;

    }


    const callRef =
        database
        .ref("calls")
        .push();


    const callId =
        callRef.key;


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[
        callId
    ] =
        pc;


    localStream
    .getTracks()
    .forEach(
    function(track){

        pc.addTrack(
            track,
            localStream
        );

    });


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );

        audio.srcObject =
            event.streams[0];

        audio.play()
        .catch(function(){});

        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };


    pc.onicecandidate =
    function(event){

        if(
            event.candidate
        ){

            database
            .ref(
                "calls/" +
                callId +
                "/callerCandidates"
            )
            .push(
                event.candidate
                .toJSON()
            );

        }

    };


    const offer =
        await pc.createOffer();


    await pc.setLocalDescription(
        offer
    );


    await callRef.set({

        caller:
            username,

        receiver:
            otherUser,

        offer:{

            type:
                offer.type,

            sdp:
                offer.sdp

        },

        created:
            Date.now()

    });


    database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .on(
        "value",
        async function(snapshot){

            const answer =
                snapshot.val();


            if(
                answer &&
                !pc.currentRemoteDescription
            ){

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        answer
                    )
                );

            }

        }
    );


    database
    .ref(
        "calls/" +
        callId +
        "/receiverCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }
                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =====================================================
   ÇAĞRI CEVAPLA
===================================================== */

async function answerCall(
    callId,
    call
){

    if(
        !localStream ||
        !voiceActive
    )
        return;


    if(
        peerConnections[
            callId
        ]
    )
        return;


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[
        callId
    ] =
        pc;


    localStream
    .getTracks()
    .forEach(
    function(track){

        pc.addTrack(
            track,
            localStream
        );

    });


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );

        audio.srcObject =
            event.streams[0];

        audio.play()
        .catch(function(){});

        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };


    pc.onicecandidate =
    function(event){

        if(
            event.candidate
        ){

            database
            .ref(
                "calls/" +
                callId +
                "/receiverCandidates"
            )
            .push(
                event.candidate
                .toJSON()
            );

        }

    };


    await pc.setRemoteDescription(
        new RTCSessionDescription(
            call.offer
        )
    );


    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    await database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .set({

        type:
            answer.type,

        sdp:
            answer.sdp

    });


    database
    .ref(
        "calls/" +
        callId +
        "/callerCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }
                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =====================================================
   SESİ KAPAT
===================================================== */

function stopVoiceChat(){

    voiceActive =
        false;


    if(localStream){

        localStream
        .getTracks()
        .forEach(
        function(track){

            track.stop();

        });

        localStream =
            null;

    }


    Object
    .keys(
        peerConnections
    )
    .forEach(
    function(id){

        try{

            peerConnections[
                id
            ].close();

        }
        catch(error){}

    });


    peerConnections =
        {};


    document
    .getElementById(
        "remoteAudio"
    )
    .srcObject =
        null;


    const button =
        document.getElementById(
            "voiceButton"
        );


    button.textContent =
        "🎤 Sesli Sohbet";

    button.classList.remove(
        "active"
    );


    hideVoiceStatus();


    database
    .ref("calls")
    .once(
        "value",
        function(snapshot){

            snapshot.forEach(
            function(child){

                const call =
                    child.val();


                if(
                    call &&
                    (
                        call.caller ===
                            username ||
                        call.receiver ===
                            username
                    )
                ){

                    child.ref.remove();

                }

            });

        }
    );

}

   ÇIKIŞ

document

    if(userKey){

};
