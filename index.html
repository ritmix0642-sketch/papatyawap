<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
    background: #f5f2eb;
    overflow: hidden;
}

#login {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #f5f2eb;
}

.login-box {
    width: 100%;
    max-width: 420px;
    padding: 38px 28px;
    text-align: center;
    background: #fffdf7;
    border: 1px solid #e5dfd2;
    border-radius: 24px;
    box-shadow: 0 15px 45px rgba(0,0,0,.10);
}

.login-box h1 {
    margin: 0;
    font-size: 28px;
}

.subtitle {
    margin: 10px 0 28px;
    color: #77736b;
    font-size: 14px;
}

#usernameInput {
    width: 100%;
    height: 52px;
    padding: 0 17px;
    border: 1px solid #d8d3c8;
    border-radius: 15px;
    outline: none;
    background: #fff;
    color: #222;
    font-size: 16px;
}

#loginButton {
    width: 100%;
    height: 52px;
    margin-top: 13px;
    border: 0;
    border-radius: 15px;
    background: #333;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#chatPage {
    display: none;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: #f5f2eb;
}

.header {
    position: relative;
    z-index: 20;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 10px 18px;
    background: #fffdf7;
    border-bottom: 1px solid #ded9cf;
}

.header-info {
    min-width: 0;
    flex: 1;
}

.header-title {
    font-size: 18px;
    font-weight: bold;
}

.online {
    margin-top: 5px;
    color: #159957;
    font-size: 12px;
}

.online-users {
    margin-top: 4px;
    color: #77736b;
    font-size: 11px;
    max-width: 600px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.logout,
.voice-button {
    min-height: 40px;
    border: 1px solid #d8d3c8;
    padding: 9px 13px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    white-space: nowrap;
}

.logout {
    background: #eeeae1;
}

.voice-button {
    background: #d9f4e5;
    color: #08783f;
    border-color: #b7dfc8;
}

.voice-button.active {
    background: #ffe0e3;
    color: #c72f42;
    border-color: #f1b7bf;
}

.chat {
    position: absolute;
    top: 76px;
    left: 0;
    right: 0;
    bottom: 108px;
    overflow-y: auto;
    padding: 25px 16px 45px;
    max-width: 850px;
    width: 100%;
    margin: auto;
    scroll-behavior: smooth;
}

.message {
    margin-bottom: 18px;
    width: 100%;
}

.username {
    margin-bottom: 4px;
    color: #2878d4;
    font-size: 12px;
    font-weight: bold;
}

.my-message {
    text-align: right;
}

.my-message .username {
    color: #159957;
}

.time {
    margin-left: 7px;
    color: #8c877d;
    font-size: 10px;
}

.delete {
    border: 0;
    background: transparent;
    color: #e34b5f;
    font-size: 10px;
    cursor: pointer;
    margin-left: 7px;
}

.bubble {
    display: block;
    max-width: 100%;
    padding: 0;
    margin: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
    line-height: 1.55;
    word-break: break-word;
    overflow-wrap: anywhere;
    box-shadow: none;
    color: #333333;
}

.image-message {
    display: inline-block;
    max-width: 300px;
    margin-top: 5px;
}

.image-message img {
    display: block;
    max-width: 300px;
    max-height: 300px;
    width: auto;
    height: auto;
    border-radius: 12px;
    cursor: pointer;
}

.gif-message {
    max-width: 280px;
    display: inline-block;
    margin-top: 5px;
    overflow: hidden;
}

.gif-message img {
    width: 100%;
    max-width: 280px;
    border-radius: 15px;
    display: block;
    cursor: pointer;
}

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 108px;
    min-height: 108px;
    padding: 8px max(10px,env(safe-area-inset-right))
             calc(8px + env(safe-area-inset-bottom))
             max(10px,env(safe-area-inset-left));
    background: #fffdf7;
    border-top: 1px solid #ded9cf;
    z-index: 25;
}

.tools-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 7px;
    min-height: 38px;
}

.tool-button {
    width: 42px;
    height: 38px;
    flex-shrink: 0;
    border: 1px solid #d8d3c8;
    border-radius: 10px;
    background: #eeeae1;
    color: #333;
    font-size: 19px;
    cursor: pointer;
}

.gif-button {
    font-size: 13px;
    font-weight: bold;
}

.image-button {
    font-size: 20px;
}

#imageInput {
    display: none;
}

.color-label {
    color: #77736b;
    font-size: 11px;
    white-space: nowrap;
}

.color-buttons {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
}

.color-button {
    width: 21px;
    height: 21px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,.20);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
}

.color-button.selected {
    border: 3px solid #222;
    box-shadow: 0 0 7px rgba(0,0,0,.25);
}

.color-white { background: #333333; }
.color-pink { background: #ff69b4; }
.color-blue { background: #2878d4; }
.color-green { background: #159957; }
.color-yellow { background: #c99400; }
.color-red { background: #e34b5f; }

.message-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 7px;
}

.message-input {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 46px;
    border: 1px solid #d8d3c8;
    outline: none;
    border-radius: 15px;
    background: #fff;
    color: #222;
    padding: 0 15px;
    font-size: 15px;
}

.send {
    width: 50px;
    height: 46px;
    flex-shrink: 0;
    border: 0;
    border-radius: 15px;
    background: #333;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.emoji-panel {
    display: none;
    position: fixed;
    bottom: 114px;
    left: 10px;
    width: 300px;
    max-height: 240px;
    overflow-y: auto;
    padding: 12px;
    background: #fffdf7;
    border: 1px solid #d8d3c8;
    border-radius: 18px;
    box-shadow: 0 15px 45px rgba(0,0,0,.20);
    z-index: 40;
}

.emoji-grid {
    display: grid;
    grid-template-columns: repeat(8,1fr);
    gap: 7px;
}

.emoji-item {
    border: 0;
    background: transparent;
    font-size: 25px;
    cursor: pointer;
    border-radius: 8px;
    padding: 4px;
}

.gif-panel {
    display: none;
    position: fixed;
    bottom: 114px;
    left: 60px;
    width: 350px;
    max-width: calc(100vw - 20px);
    height: 430px;
    background: #fffdf7;
    border: 1px solid #d8d3c8;
    border-radius: 18px;
    box-shadow: 0 15px 45px rgba(0,0,0,.20);
    z-index: 40;
    overflow: hidden;
}

.gif-search {
    display: flex;
    gap: 7px;
    padding: 10px;
    border-bottom: 1px solid #ded9cf;
}

.gif-search input {
    flex: 1;
    height: 40px;
    border: 1px solid #d8d3c8;
    outline: none;
    border-radius: 10px;
    background: #fff;
    padding: 0 12px;
}

.gif-search button {
    width: 45px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.gif-results {
    height: 350px;
    overflow-y: auto;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 8px;
}

.gif-result {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    background: #eeeae1;
}

.gif-empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 30px 10px;
    color: #77736b;
    font-size: 13px;
}

#voiceStatus {
    display: none;
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: #fffdf7;
    border: 1px solid #d8d3c8;
    color: #333;
    padding: 11px 18px;
    border-radius: 25px;
    font-size: 13px;
    z-index: 50;
    box-shadow: 0 10px 30px rgba(0,0,0,.20);
    white-space: nowrap;
}

@media (min-width:700px) {
    .input-area {
        max-width: 850px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 18px 18px 0 0;
    }
}

@media (max-width:600px) {

    .header {
        height: 62px;
        min-height: 62px;
        padding: 7px 9px;
        gap: 7px;
    }

    .header-title {
        font-size: 14px;
    }

    .online {
        margin-top: 3px;
        font-size: 11px;
    }

    .online-users {
        max-width: 145px;
        font-size: 10px;
    }

    .header-buttons {
        gap: 5px;
    }

    .voice-button,
    .logout {
        min-height: 36px;
        padding: 7px 9px;
        font-size: 10px;
        border-radius: 10px;
    }

    .voice-button {
        max-width: 105px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chat {
        top: 62px;
        bottom: 94px;
        padding: 15px 10px 45px;
    }

    .image-message,
    .image-message img {
        max-width: 250px;
        max-height: 250px;
    }

    .input-area {
        height: 94px;
        min-height: 94px;
        padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
    }

    .tools-row {
        gap: 5px;
        margin-bottom: 6px;
        min-height: 32px;
    }

    .tool-button {
        width: 37px;
        height: 32px;
        border-radius: 9px;
        font-size: 17px;
    }

    .gif-button {
        font-size: 11px;
    }

    .image-button {
        font-size: 18px;
    }

    .color-label {
        display: none;
    }

    .color-buttons {
        gap: 4px;
        overflow: hidden;
    }

    .color-button {
        width: 18px;
        height: 18px;
    }

    .message-row {
        gap: 5px;
    }

    .message-input {
        height: 42px;
        font-size: 14px;
        border-radius: 13px;
        padding: 0 12px;
    }

    .send {
        width: 44px;
        height: 42px;
        border-radius: 13px;
        font-size: 18px;
    }

    .emoji-panel {
        width: calc(100vw - 20px);
        left: 10px;
        bottom: 104px;
    }

    .gif-panel {
        left: 10px;
        bottom: 104px;
        width: calc(100vw - 20px);
    }

    #voiceStatus {
        bottom: 105px;
        max-width: calc(100vw - 30px);
        overflow: hidden;
        text-overflow: ellipsis;
    }
}

@media (max-width:380px) {

    .header-title {
        font-size: 13px;
    }

    .online-users {
        max-width: 110px;
    }

    .voice-button {
        max-width: 82px;
        padding: 7px 6px;
    }

    .logout {
        padding: 7px;
    }

    .color-button {
        width: 16px;
        height: 16px;
    }

    .tool-button {
        width: 34px;
    }
}
</style>
</head>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",
    authDomain: "papatyawap.firebaseapp.com",
    databaseURL: "https://papatyawap-default-rtdb.firebaseio.com",
    projectId: "papatyawap",
    storageBucket: "papatyawap.firebasestorage.app",
    messagingSenderId: "29357315689",
    appId: "1:29357315689:web:78864218c204d291f734f8"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const auth = firebase.auth();

const GIPHY_API_KEY =
    "wZUjXSQmZ5TEx1UzVzqTY5BVwGcpShCy";

let username = "";
let userKey = "";
let firebaseUser = null;

let localStream = null;
let peerConnections = {};
let voiceActive = false;
let voiceListenerStarted = false;
let selectedMessageColor = "#333333";

const rtcConfig = {

    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        },
        {
            urls: "stun:stun1.l.google.com:19302"
        }
    ]

};


/* RENK */

document
.querySelectorAll(".color-button")
.forEach(function(button) {

    button.onclick = function() {

        selectedMessageColor =
            this.dataset.color;

        document
        .querySelectorAll(".color-button")
        .forEach(function(item) {

            item.classList.remove("selected");

        });

        this.classList.add("selected");

    };

});


/* EMOJI */

const emojiButton =
    document.getElementById("emojiButton");

const emojiPanel =
    document.getElementById("emojiPanel");

const gifPanel =
    document.getElementById("gifPanel");

emojiButton.onclick = function() {

    emojiPanel.style.display =
        emojiPanel.style.display === "block"
        ? "none"
        : "block";

    gifPanel.style.display = "none";

};

document
.querySelectorAll(".emoji-item")
.forEach(function(button) {

    button.onclick = function() {

        const input =
            document.getElementById("messageInput");

        input.value += this.textContent;

        input.focus();

    };

});


/* RESİM / GIF */

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");

imageButton.onclick = function() {

    imageInput.click();

};

imageInput.onchange = function(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        alert("Lütfen bir resim veya GIF seçin.");

        imageInput.value = "";

        return;

    }

    const reader =
        new FileReader();

    reader.onload = function(e) {

        const imageData =
            e.target.result;

        if (imageData.length > 6000000) {

            alert(
    "Bu dosya çok büyük.\n\n" +
    "Lütfen 6 MB veya daha küçük " +
    "bir resim/GIF seçin."
);

            imageInput.value = "";

            return;

        }

        if (!firebaseUser) {

            alert("Güvenli bağlantı hazırlanıyor. Lütfen tekrar deneyin.");

            imageInput.value = "";

            return;

        }

        database
        .ref("messages")
        .push({

            uid: firebaseUser.uid,

            username: username,

            type: "image",

            image: imageData,

            filename: file.name,

            mimeType: file.type,

            color: selectedMessageColor,

            timestamp: Date.now()

        })
        .catch(function(error) {

            console.error(error);

            alert(
                "Resim gönderilemedi.\n\n" +
                error.message
            );

        });

        imageInput.value = "";

    };

    reader.onerror = function() {

        alert("Dosya okunamadı.");

        imageInput.value = "";

    };

    reader.readAsDataURL(file);

};


/* GIPHY */

const gifButton =
    document.getElementById("gifButton");

const gifSearchInput =
    document.getElementById("gifSearchInput");

const gifSearchButton =
    document.getElementById("gifSearchButton");

const gifResults =
    document.getElementById("gifResults");

gifButton.onclick = function() {

    gifPanel.style.display =
        gifPanel.style.display === "block"
        ? "none"
        : "block";

    emojiPanel.style.display = "none";

};

gifSearchButton.onclick = searchGIFs;

gifSearchInput.onkeydown =
function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        searchGIFs();

    }

};

async function searchGIFs() {

    const query =
        gifSearchInput.value.trim();

    if (!query) {

        gifResults.innerHTML =
            '<div class="gif-empty">🔎 Önce GIF adı yazın</div>';

        return;

    }

    gifResults.innerHTML =
        '<div class="gif-empty">⏳ GIF aranıyor...</div>';

    try {

        const url =
            "https://api.giphy.com/v1/gifs/search" +
            "?api_key=" +
            encodeURIComponent(GIPHY_API_KEY) +
            "&q=" +
            encodeURIComponent(query) +
            "&limit=24" +
            "&rating=pg-13" +
            "&lang=tr";

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        if (!data || !data.data || data.data.length === 0) {

            gifResults.innerHTML =
                '<div class="gif-empty">😔 GIF bulunamadı</div>';

            return;

        }

        gifResults.innerHTML = "";

        data.data.forEach(function(gif) {

            const images = gif.images || {};

            const previewUrl =
                images.fixed_width?.webp ||
                images.fixed_width?.url ||
                images.preview_gif?.url ||
                images.original?.url;

            const originalUrl =
                images.original?.url ||
                previewUrl;

            if (!previewUrl) return;

            const image =
                document.createElement("img");

            image.className =
                "gif-result";

            image.src =
                previewUrl;

            image.alt =
                gif.title || "GIF";

            image.loading = "lazy";

            image.onclick = function() {

                sendGIF(
                    previewUrl,
                    originalUrl
                );

                gifPanel.style.display = "none";

            };

            gifResults.appendChild(image);

        });

    }

    catch(error) {

        console.error(error);

        gifResults.innerHTML =
            '<div class="gif-empty">❌ GIF yüklenemedi.</div>';

    }

}


function sendGIF(previewUrl, originalUrl) {

    if (!username || !firebaseUser) return;

    database
    .ref("messages")
    .push({

        uid: firebaseUser.uid,

        username: username,

        type: "gif",

        gif: originalUrl,

        preview: previewUrl,

        color: selectedMessageColor,

        timestamp: Date.now()

    });

}


/* GİRİŞ */

async function enterChat() {

    const input =
        document.getElementById("usernameInput");

    const name =
        input.value.trim();

    if (!name) {

        alert("Lütfen kullanıcı adınızı yazın.");

        input.focus();

        return;

    }

    if (name.length > 20) {

        alert("Kullanıcı adı en fazla 20 karakter olabilir.");

        return;

    }

    const loginButton =
        document.getElementById("loginButton");

    loginButton.disabled = true;

    loginButton.textContent =
        "BAĞLANIYOR...";

    try {

        if (!auth.currentUser) {

            const result =
                await auth.signInAnonymously();

            firebaseUser =
                result.user;

        }
        else {

            firebaseUser =
                auth.currentUser;

        }

        username = name;

        document.getElementById("login")
            .style.display = "none";

        document.getElementById("chatPage")
            .style.display = "block";

        loadMessages();

        setOnline();

    }

    catch(error) {

        console.error(
            "Giriş hatası:",
            error
        );

        alert(
            "Sohbete giriş yapılamadı.\n\n" +
            error.message
        );

        loginButton.disabled = false;

        loginButton.textContent =
            "SOHBETE GİR";

    }

}


document
.getElementById("loginButton")
.onclick = enterChat;


document
.getElementById("usernameInput")
.onkeydown =
function(event) {

    if (event.key === "Enter") {

        enterChat();

    }

};


/* MESAJLAR */

function loadMessages() {

    database
    .ref("messages")
    .on("value", function(snapshot) {

        const chat =
            document.getElementById("chat");

        chat.innerHTML = "";

        snapshot.forEach(function(child) {

            const message =
                child.val();

            if (!message) return;

            const box =
                document.createElement("div");

            box.className =
                "message";

            if (
                message.uid === firebaseUser?.uid
            ) {

                box.classList.add(
                    "my-message"
                );

            }

            const user =
                document.createElement("div");

            user.className =
                "username";

            user.textContent =
                message.username || "Kullanıcı";

            if (message.timestamp) {

                const time =
                    document.createElement("span");

                time.className =
                    "time";

                time.textContent =
                    new Date(
                        message.timestamp
                    ).toLocaleTimeString(
                        "tr-TR",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

                user.appendChild(time);

            }


            /* SADECE KENDİ MESAJINDA SİL */

            if (
                firebaseUser &&
                message.uid === firebaseUser.uid
            ) {

                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete";

                deleteButton.textContent =
                    "Sil";

                deleteButton.onclick =
                    function() {

                        if (
                            confirm(
                                "Bu mesajı silmek istiyor musun?"
                            )
                        ) {

                            child.ref.remove()
                            .catch(function(error) {

                                console.error(error);

                                alert(
                                    "Mesaj silinemedi.\n\n" +
                                    error.message
                                );

                            });

                        }

                    };

                user.appendChild(
                    deleteButton
                );

            }


            /* GIPHY */

            if (
                message.type === "gif" &&
                message.gif
            ) {

                const gifBox =
                    document.createElement("div");

                gifBox.className =
                    "gif-message";

                const gifImage =
                    document.createElement("img");

                gifImage.src =
                    message.preview ||
                    message.gif;

                gifImage.alt =
                    "GIF";

                gifImage.onclick =
                    function() {

                        window.open(
                            message.gif,
                            "_blank"
                        );

                    };

                gifBox.appendChild(
                    gifImage
                );

                box.appendChild(user);

                box.appendChild(gifBox);

                chat.appendChild(box);

                return;

            }


            /* CİHAZDAN RESİM / HAREKETLİ GIF */

            if (
                message.type === "image" &&
                message.image
            ) {

                const imageBox =
                    document.createElement("div");

                imageBox.className =
                    "image-message";

                const image =
                    document.createElement("img");

                image.src =
                    message.image;

                image.alt =
                    message.filename ||
                    "Resim";

                image.loading =
                    "lazy";

                image.onclick =
                    function() {

                        const newWindow =
                            window.open();

                        if (newWindow) {

                            newWindow.document.write(
                                '<img src="' +
                                message.image +
                                '" style="max-width:100%;height:auto;">'
                            );

                        }

                    };

                imageBox.appendChild(
                    image
                );

                box.appendChild(user);

                box.appendChild(imageBox);

                chat.appendChild(box);

                return;

            }


            /* NORMAL MESAJ */

            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble";

            bubble.textContent =
                message.text || "";

            if (message.color) {

                bubble.style.color =
                    message.color;

            }

            box.appendChild(user);

            box.appendChild(bubble);

            chat.appendChild(box);

        });

        chat.scrollTop =
            chat.scrollHeight;

    });

}


/* MESAJ GÖNDER */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (
        !text ||
        !username ||
        !firebaseUser
    ) return;

    database
    .ref("messages")
    .push({

        uid: firebaseUser.uid,

        username: username,

        text: text,

        color: selectedMessageColor,

        type: "text",

    })
    .catch(function(error) {

            "Mesaj gönderilemedi.\n\n" +

}


document
.getElementById("sendButton")
.onclick = sendMessage;


document
.getElementById("messageInput")
.onkeydown =
function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

};


/* ÇEVRİMİÇİ */

function setOnline() {

    if (!firebaseUser) return;

    const ref =
        database
        .ref("onlineUsers/" + firebaseUser.uid);

    userKey =
        firebaseUser.uid;

    ref.set({

        uid: firebaseUser.uid,

        username: username,

        timestamp:
            firebase.database.ServerValue.TIMESTAMP

    });

    ref.onDisconnect().remove();


    database
    .ref("onlineUsers")
    .on("value", function(snapshot) {

        const count =
            snapshot.numChildren();

        document
        .getElementById("onlineText")
        .textContent =
            "🟢 " +
            count +
            " kişi çevrimiçi";

        const names = [];

        snapshot.forEach(function(child) {

            const user =
                child.val();

            if (
                user &&
                user.username
            ) {

                names.push(
                    user.username
                );

            }

        });

        document
        .getElementById("onlineUsersText")
        .textContent =
            names.length
            ? "👥 " + names.join(", ")
            : "👥 Kimse yok";

    });

}


/* SES DURUMU */

function showVoiceStatus(text) {

    const status =
        document.getElementById("voiceStatus");

    status.textContent =
        text;

    status.style.display =
        "block";

}


function hideVoiceStatus() {

    document
    .getElementById("voiceStatus")
    .style.display =
        "none";

}


/* MİKROFON */

async function startVoiceChat() {

    try {

        showVoiceStatus(
            "🎤 Mikrofon açılıyor..."
        );

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Tarayıcınız mikrofon erişimini desteklemiyor."
            );

        }

        if (!firebaseUser) {

            throw new Error(
                "Firebase güvenli oturumu hazır değil."
            );

        }

        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,
                video: false

            });

        voiceActive = true;

        const button =
            document.getElementById(
                "voiceButton"
            );

        button.textContent =
            "🔴 Sesi Kapat";

        button.classList.add(
            "active"
        );

        startVoiceListener();

        showVoiceStatus(
            "🎤 Sesli sohbet aktif"
        );

        const callsSnapshot =
            await database
            .ref("calls")
            .once("value");

        let foundCall = false;

        callsSnapshot.forEach(
            function(child) {

                const call =
                    child.val();

                if (
                    call &&
                    call.receiver === username &&
                    call.receiverUid === firebaseUser.uid
                ) {

                    foundCall = true;

                    answerCall(
                        child.key,
                        call
                    );

                }

            }
        );

        if (!foundCall) {

            await createCall();

        }

    }

    catch(error) {

        console.error(
            "Mikrofon hatası:",
            error
        );

        alert(
            "Mikrofon açılamadı.\n\n" +
            error.name +
            "\n" +
            error.message
        );

        voiceActive = false;

    }

}


/* SES BUTONU */

document
.getElementById("voiceButton")
.onclick =
async function() {

    if (voiceActive) {

        stopVoiceChat();

    }
    else {

        await startVoiceChat();

    }

};


/* ÇAĞRI DİNLE */

function startVoiceListener() {

    if (voiceListenerStarted) return;

    voiceListenerStarted = true;

    database
    .ref("calls")
    .on(
        "child_added",
        async function(snapshot) {

            const call =
                snapshot.val();

            const callId =
                snapshot.key;

            if (!call) return;

            if (
                call.callerUid === firebaseUser.uid
            ) return;

            if (
                call.receiverUid !== firebaseUser.uid
            ) return;

            if (
                peerConnections[callId]
            ) return;

            if (!voiceActive) return;

            try {

                await answerCall(
                    callId,
                    call
                );

            }

            catch(error) {

                console.error(
                    "Çağrı cevaplama hatası:",
                    error
                );

            }

        }
    );

}


/* ÇAĞRI BAŞLAT */

async function createCall() {

    if (!localStream || !firebaseUser) return;

    const usersSnapshot =
        await database
        .ref("onlineUsers")
        .once("value");

    let otherUser = null;
    let otherUid = null;

    usersSnapshot.forEach(
        function(child) {

            const user =
                child.val();

            if (
                user &&
                user.username &&
                user.uid &&
                user.uid !== firebaseUser.uid &&
                !otherUser
            ) {

                otherUser =
                    user.username;

                otherUid =
                    user.uid;

            }

        }
    );

    if (!otherUser || !otherUid) {

        showVoiceStatus(
            "🎤 Mikrofon açık - başka kullanıcı bekleniyor"
        );

        return;

    }

    const callRef =
        database
        .ref("calls")
        .push();

    const callId =
        callRef.key;

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    peerConnections[callId] =
        pc;

    localStream
    .getTracks()
    .forEach(function(track) {

        pc.addTrack(
            track,
            localStream
        );

    });

    pc.ontrack =
    function(event) {

        const audio =
            document.getElementById(
                "remoteAudio"
            );

        audio.srcObject =
            event.streams[0];

        audio.play()
        .catch(function(error) {

            console.log(
                "Ses oynatma hatası:",
                error
            );

        });

        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };

    pc.onicecandidate =
    function(event) {

        if (event.candidate) {

            database
            .ref(
                "calls/" +
                callId +
                "/callerCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };

    const offer =
        await pc.createOffer();

    await pc.setLocalDescription(
        offer
    );

    await callRef.set({

        caller: username,

        callerUid:
            firebaseUser.uid,

        receiver:
            otherUser,

        receiverUid:
            otherUid,

        offer: {

            type: offer.type,

            sdp: offer.sdp

        },

        created:
            Date.now()

    });

    database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .on(
        "value",
        async function(snapshot) {

            const answer =
                snapshot.val();

            if (
                answer &&
                !pc.currentRemoteDescription
            ) {

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        answer
                    )
                );

            }

        }
    );

    database
    .ref(
        "calls/" +
        callId +
        "/receiverCandidates"
    )
    .on(
        "child_added",
        async function(snapshot) {

            const candidate =
                snapshot.val();

            if (candidate) {

                try {

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }

                catch(error) {

                    console.log(error);

                }

            }

        }
    );

}


/* ÇAĞRI CEVAPLA */

async function answerCall(
    callId,
    call
) {

    if (
        !localStream ||
        !voiceActive ||
        !firebaseUser
    ) return;

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    peerConnections[callId] =
        pc;

    localStream
    .getTracks()
    .forEach(function(track) {

        pc.addTrack(
            track,
            localStream
        );

    });

    pc.ontrack =
    function(event) {

        const audio =
            document.getElementById(
                "remoteAudio"
            );

        audio.srcObject =
            event.streams[0];

        audio.play()
        .catch(function(error) {

            console.log(error);

        });

        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };

    pc.onicecandidate =
    function(event) {

        if (event.candidate) {

            database
            .ref(
                "calls/" +
                callId +
                "/receiverCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };

    await pc.setRemoteDescription(
        new RTCSessionDescription(
            call.offer
        )
    );

    const answer =
        await pc.createAnswer();

    await pc.setLocalDescription(
        answer
    );

    await database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .set({

        type:
            answer.type,

        sdp:
            answer.sdp

    });

    database
    .ref(
        "calls/" +
        callId +
        "/callerCandidates"
    )
    .on(
        "child_added",
        async function(snapshot) {

            const candidate =
                snapshot.val();

            if (candidate) {

                try {

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }

                catch(error) {

                    console.log(error);

                }

            }

        }
    );

}


/* SESİ KAPAT */

function stopVoiceChat() {

    voiceActive = false;

    if (localStream) {

        localStream
        .getTracks()
        .forEach(function(track) {

            track.stop();

        });

        localStream = null;

    }

    Object
    .keys(peerConnections)
    .forEach(function(id) {

        try {

            peerConnections[id].close();

        }

        catch(error) {

            console.log(error);

        }

    });

    peerConnections = {};

    const audio =
        document.getElementById(
            "remoteAudio"
        );

    audio.srcObject = null;

    const button =
        document.getElementById(
            "voiceButton"
        );

    button.textContent =
        "🎤 Sesli Sohbet";

    button.classList.remove(
        "active"
    );

    hideVoiceStatus();

    if (firebaseUser) {

        database
        .ref("calls")
        .once(
            "value",
            function(snapshot) {

                snapshot.forEach(
                    function(child) {

                        const call =
                            child.val();

                        if (
                            call &&
                            (
                                call.callerUid === firebaseUser.uid ||
                                call.receiverUid === firebaseUser.uid
                            )
                        ) {

                            child.ref.remove()
                            .catch(function(error) {

                                console.log(error);

                            });

                        }

                    }
                );

            }
        );

    }

}


/* ÇIKIŞ */

document
.getElementById("logoutButton")
.onclick =
async function() {

    stopVoiceChat();

    if (userKey) {

        await database
        .ref(
            "onlineUsers/" +
            userKey
        )
        .remove()
        .catch(function(error) {

            console.log(error);

        });

    }

    try {

        await auth.signOut();

    }

    catch(error) {

        console.log(error);

    }

    location.reload();

};

        if (
            !emojiPanel.contains(

            emojiPanel.style.display =

        if (
            !gifPanel.contains(

            ) &&

        ) {

        }

    }
);
