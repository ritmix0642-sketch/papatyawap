 <!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10131b;
    color: white;
}

/* GİRİŞ */

#login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: #1c2230;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
}

.logo {
    font-size: 50px;
}

.login-box h1 {
    margin: 10px 0;
}

.login-box p {
    color: #9da7ba;
}

#usernameInput {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #11151e;
    color: white;
    font-size: 16px;
    outline: none;
}

#loginButton {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #4d8cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* SOHBET */

#chatPage {
    display: none;
    height: 100vh;
}

.header {
    min-height: 70px;
    background: #1a1f2b;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.online {
    color: #45e889;
    font-size: 12px;
    margin-top: 4px;
}

.online-users {
    color: #9da7ba;
    font-size: 11px;
    margin-top: 3px;
}

.logout {
    background: #303746;
    border: 0;
    color: white;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* MESAJLAR */

#chat {
    height: calc(100vh - 135px);
    overflow-y: auto;
    padding: 15px;
    max-width: 800px;
    margin: auto;
}

.message {
    margin-bottom: 15px;
}

.username {
    color: #62b0ff;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

.time {
    color: #777f90;
    font-size: 10px;
    margin-left: 6px;
}

.bubble {
    display: inline-block;
    max-width: 85%;
    padding: 10px 13px;
    background: #222936;
    border-radius: 5px 14px 14px 14px;
    word-break: break-word;
}

.mine {
    text-align: right;
}

.mine .username {
    color: #70e6a0;
}

.mine .bubble {
    background: #315b9f;
}

.delete {
    border: 0;
    background: transparent;
    color: #ff6b6b;
    font-size: 11px;
    cursor: pointer;
    margin-left: 8px;
}

/* ALT ALAN */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 65px;
    background: #1a1f2b;
    border-top: 1px solid #303746;
    padding: 10px;
    display: flex;
    gap: 7px;
}

#messageInput {
    flex: 1;
    border: 0;
    outline: none;
    border-radius: 10px;
    background: #272e3b;
    color: white;
    padding: 0 12px;
    font-size: 15px;
}

.emoji-button,
.send {
    width: 45px;
    border: 0;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.emoji-button {
    background: #303746;
}

.send {
    background: #4d8cff;
}

/* EMOJİ */

#emojiPanel {
    display: none;
    position: fixed;
    bottom: 72px;
    left: 8px;
    right: 8px;
    max-width: 800px;
    margin: auto;
    background: #1c2230;
    border: 1px solid #343c4d;
    border-radius: 15px;
    padding: 10px;
    text-align: center;
    z-index: 20;
}

#emojiPanel button {
    border: 0;
    background: transparent;
    font-size: 25px;
    padding: 5px;
    cursor: pointer;
}
</style>

</head>

<body>

<!-- GİRİŞ -->

<div id="login">

```
<div class="login-box">

    <div class="logo">💬</div>

    <h1>Ritmix Sohbet</h1>

    <p>Sohbete katılmak için kullanıcı adını yaz</p>

    <input
        id="usernameInput"
        maxlength="20"
        placeholder="Kullanıcı adın..."
    >

    <button id="loginButton">
        SOHBETE GİR
    </button>

</div>
```

</div>

<!-- SOHBET -->

<div id="chatPage">

```
<div class="header">

    <div>

        <div class="title">
            💬 Ritmix Sohbet
        </div>

        <div
            class="online"
            id="onlineText"
        >
            🟢 0 kişi çevrimiçi
        </div>

        <div
            class="online-users"
            id="onlineUsersText"
        >
            👥 Kimse yok
        </div>

    </div>

    <button
        class="logout"
        id="logoutButton"
    >
        Çıkış
    </button>

</div>


<div id="chat"></div>


<!-- EMOJİ PANELİ -->

<div id="emojiPanel">

    <button data-emoji="😀">😀</button>
    <button data-emoji="😂">😂</button>
    <button data-emoji="😍">😍</button>
    <button data-emoji="😘">😘</button>
    <button data-emoji="❤️">❤️</button>
    <button data-emoji="🔥">🔥</button>
    <button data-emoji="👍">👍</button>
    <button data-emoji="👏">👏</button>
    <button data-emoji="😎">😎</button>
    <button data-emoji="🥰">🥰</button>
    <button data-emoji="😉">😉</button>
    <button data-emoji="🎉">🎉</button>
    <button data-emoji="🤣">🤣</button>
    <button data-emoji="💯">💯</button>
    <button data-emoji="❤️‍🔥">❤️‍🔥</button>

</div>


<div class="input-area">

    <button
        class="emoji-button"
        id="emojiButton"
    >
        😊
    </button>

    <input
        id="messageInput"
        placeholder="Mesaj yaz..."
    >

    <button
        class="send"
        id="sendButton"
    >
        ➤
    </button>

</div>
```

</div>

<script>

/* FIREBASE */

const firebaseConfig = {
    apiKey: "AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",
    authDomain: "papatyawap.firebaseapp.com",
    databaseURL: "https://papatyawap-cdf7b-default-rtdb.firebaseio.com",
    projectId: "papatyawap",
    storageBucket: "papatyawap.firebasestorage.app",
    messagingSenderId: "29357315689",
    appId: "1:29357315689:web:78864218c204d291f734f8"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

let username = "";
let userKey = "";


/* GİRİŞ */

function enterChat() {

    const input = document.getElementById("usernameInput");

    const name = input.value.trim();

    if (name === "") {

        alert("Lütfen kullanıcı adını yaz.");

        return;
    }

    username = name;

    document.getElementById("login").style.display = "none";

    document.getElementById("chatPage").style.display = "block";

    listenMessages();

    setOnline();
}


/* GİRİŞ BUTONU */

document.getElementById("loginButton").onclick = enterChat;


/* ENTER İLE GİRİŞ */

document.getElementById("usernameInput").onkeydown = function(event) {

    if (event.key === "Enter") {

        enterChat();

    }

};


/* MESAJLARI DİNLE */

function listenMessages() {

    database.ref("messages").on("value", function(snapshot) {

        const chat = document.getElementById("chat");

        chat.innerHTML = "";

        snapshot.forEach(function(item) {

            const message = item.val();

            const box = document.createElement("div");

            box.className = "message";

            const mine = message.username === username;

            if (mine) {

                box.classList.add("mine");

            }

            const user = document.createElement("div");

            user.className = "username";

            user.textContent = message.username;


            if (message.timestamp) {

                const time = document.createElement("span");

                time.className = "time";

                time.textContent =
                    new Date(message.timestamp)
                    .toLocaleTimeString("tr-TR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

                user.appendChild(time);

            }


            if (mine) {

                const deleteButton =
                    document.createElement("button");

                deleteButton.className = "delete";

                deleteButton.textContent = "Sil";

                deleteButton.onclick = function() {

                    if (confirm("Bu mesaj silinsin mi?")) {

                        item.ref.remove();

                    }

                };

                user.appendChild(deleteButton);

            }


            const bubble = document.createElement("div");

            bubble.className = "bubble";

            bubble.textContent = message.text;

            box.appendChild(user);

            box.appendChild(bubble);

            chat.appendChild(box);

        });

        chat.scrollTop = chat.scrollHeight;

    });

}


/* MESAJ GÖNDER */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (text === "" || username === "") {

        return;

    }

    database.ref("messages").push({

        username: username,

        text: text,

        timestamp: Date.now()

    });

    input.value = "";

    input.focus();

    closeEmoji();

}


document.getElementById("sendButton").onclick = sendMessage;


document.getElementById("messageInput").onkeydown =
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    };


/* ONLINE */

function setOnline() {

    const ref =
        database.ref("onlineUsers").push();

    userKey = ref.key;

    ref.set({

        username: username,

        timestamp:
            firebase.database.ServerValue.TIMESTAMP

    });

    ref.onDisconnect().remove();


    database.ref("onlineUsers").on(
        "value",
        function(snapshot) {

            const count =
                snapshot.numChildren();

            document.getElementById(
                "onlineText"
            ).textContent =
                "🟢 " +
                count +
                " kişi çevrimiçi";


            const names = [];

            snapshot.forEach(function(item) {

                const user = item.val();

                if (user && user.username) {

                    names.push(user.username);

                }

            });


            document.getElementById(
                "onlineUsersText"
            ).textContent =
                names.length > 0
                ? "👥 " + names.join(", ")
                : "👥 Kimse yok";

        }
    );

}


/* EMOJİ PANELİ */

document.getElementById("emojiButton").onclick =
    function() {

        const panel =
            document.getElementById("emojiPanel");

        if (panel.style.display === "block") {

            panel.style.display = "none";

        } else {

            panel.style.display = "block";

        }

    };


document
    .querySelectorAll("#emojiPanel button")
    .forEach(function(button) {

        button.onclick = function() {

            const input =
                document.getElementById(
                    "messageInput"
                );

            input.value +=
                button.getAttribute("data-emoji");

            input.focus();

        };

    });


function closeEmoji() {

    document.getElementById(
        "emojiPanel"
    ).style.display = "none";

}


/* ÇIKIŞ */

document.getElementById("logoutButton").onclick =
    function() {

        if (userKey) {

            database
                .ref("onlineUsers/" + userKey)
                .remove();

        }

        location.reload();

    };

</script>

</body>
</html>
