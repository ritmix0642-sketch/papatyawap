<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#222;
    background:#f5f2eb;
    overflow:hidden;
}

/* =========================
   GİRİŞ
========================= */

#login{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#f5f2eb;
}

.login-box{
    width:100%;
    max-width:420px;
    padding:38px 28px;
    text-align:center;
    background:#fffdf7;
    border:1px solid #e5dfd2;
    border-radius:24px;
    box-shadow:0 15px 45px rgba(0,0,0,.10);
}

.login-box h1{
    margin:0;
    font-size:28px;
}

.subtitle{
    margin:10px 0 28px;
    color:#77736b;
    font-size:14px;
}

#usernameInput{
    width:100%;
    height:52px;
    padding:0 17px;
    border:1px solid #d8d3c8;
    border-radius:15px;
    outline:none;
    background:#fff;
    color:#222;
    font-size:16px;
}

#loginButton{
    width:100%;
    height:52px;
    margin-top:13px;
    border:0;
    border-radius:15px;
    background:#333;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   CHAT
========================= */

#chatPage{
    display:none;
    width:100%;
    height:100vh;
    overflow:hidden;
    position:relative;
    background:#f5f2eb;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    z-index:20;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 14px;
    background:#fffdf7;
    border-bottom:1px solid #ded9cf;
}

.header-info{
    min-width:0;
    flex:1;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.online{
    margin-top:4px;
    color:#159957;
    font-size:12px;
}

.online-users{
    margin-top:3px;
    color:#77736b;
    font-size:10px;
    max-width:500px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-buttons{
    display:flex;
    align-items:center;
    gap:5px;
    flex-shrink:0;
}

.logout,
.voice-button,
.room-delete{
    min-height:38px;
    border:1px solid #d8d3c8;
    padding:7px 10px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    white-space:nowrap;
}

.logout{
    background:#eeeae1;
}

.voice-button{
    background:#d9f4e5;
    color:#08783f;
    border-color:#b7dfc8;
}

.voice-button.active{
    background:#ffe0e3;
    color:#c72f42;
    border-color:#f1b7bf;
}

.room-delete{
    background:#ffe2e5;
    color:#c6283d;
    border-color:#f0b9c0;
}

/* =========================
   CHAT ALANI
========================= */

.chat{
    position:absolute;
    top:76px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;

    padding:18px 16px 170px;

    max-width:850px;
    width:100%;
    margin:auto;
}

/* =========================
   MESAJLAR
========================= */

.message{
    width:100%;
    margin-bottom:18px;
}

.username{
    margin-bottom:4px;
    color:#2878d4;
    font-size:12px;
    font-weight:bold;
}

.my-message{
    text-align:right;
}

.my-message .username{
    color:#159957;
}

.time{
    margin-left:7px;
    color:#8c877d;
    font-size:10px;
}

.delete{
    border:0;
    background:transparent;
    color:#e34b5f;
    font-size:10px;
    cursor:pointer;
    margin-left:7px;
}

.bubble{
    display:block;
    width:100%;
    padding:0;
    margin:0;
    background:transparent;
    border:0;
    line-height:1.55;
    word-break:break-word;
    overflow-wrap:anywhere;
    color:#333;
}

/* =========================
   RESİM
========================= */

.image-message{
    display:inline-block;
    max-width:100%;
    margin-top:5px;
}

.image-message img{
    display:block;
    max-width:min(100%,650px);
    max-height:600px;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:12px;
    cursor:pointer;
}

/* =========================
   GIF
========================= */

.gif-message{
    max-width:min(100%,400px);
    display:inline-block;
    margin-top:5px;
    overflow:hidden;
}

.gif-message img{
    width:100%;
    max-width:400px;
    max-height:600px;
    object-fit:contain;
    border-radius:15px;
    display:block;
    cursor:pointer;
}

/* =========================
   SAYFA BUTONLARI
========================= */

.pagination{
    position:absolute;
    left:50%;
    bottom:120px;
    transform:translateX(-50%);

    width:min(850px,calc(100% - 20px));

    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;

    padding:7px;

    background:rgba(255,253,247,.96);
    border:1px solid #ded9cf;
    border-radius:14px;

    z-index:22;

    overflow-x:auto;
}

.page-button{
    min-width:34px;
    height:32px;

    border:1px solid #d8d3c8;
    border-radius:9px;

    background:#eeeae1;
    color:#333;

    cursor:pointer;
    font-weight:bold;
    font-size:12px;

    flex-shrink:0;
}

.page-button.active{
    background:#333;
    color:#fff;
    border-color:#333;
}

.page-info{
    color:#77736b;
    font-size:11px;
    padding:0 5px;
    white-space:nowrap;
}

/* =========================
   ALT PANEL
========================= */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;

    height:108px;
    min-height:108px;

    padding:
        8px
        max(10px,env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        max(10px,env(safe-area-inset-left));

    background:#fffdf7;
    border-top:1px solid #ded9cf;

    z-index:25;
}

/* =========================
   ARAÇLAR
========================= */

.tools-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:7px;
    min-height:38px;
}

.tool-button{
    width:42px;
    height:38px;
    flex-shrink:0;

    border:1px solid #d8d3c8;
    border-radius:10px;

    background:#eeeae1;
    color:#333;

    font-size:19px;
    cursor:pointer;
}

.gif-button{
    font-size:13px;
    font-weight:bold;
}

.image-button{
    font-size:20px;
}

/* =========================
   RENK PANELİ
========================= */

.color-wrapper{
    position:relative;
}

.color-main-button{
    width:42px;
    height:38px;

    border:1px solid #d8d3c8;
    border-radius:10px;

    background:#eeeae1;

    font-size:19px;
    cursor:pointer;
}

.color-panel{
    display:none;

    position:absolute;
    bottom:45px;
    left:0;

    padding:9px;

    background:#fffdf7;

    border:1px solid #d8d3c8;
    border-radius:14px;

    box-shadow:0 10px 30px rgba(0,0,0,.20);

    z-index:50;
}

.color-panel.show{
    display:flex;
    gap:7px;
}

.color-button{
    width:25px;
    height:25px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,.20);
    cursor:pointer;
    flex-shrink:0;
    padding:0;
}

.color-button.selected{
    border:3px solid #222;
    box-shadow:0 0 7px rgba(0,0,0,.25);
}

.color-white{background:#333;}
.color-pink{background:#ff69b4;}
.color-blue{background:#2878d4;}
.color-green{background:#159957;}
.color-yellow{background:#c99400;}
.color-red{background:#e34b5f;}

#imageInput{
    display:none;
}

/* =========================
   MESAJ GİRİŞİ
========================= */

.message-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:7px;
}

.message-input{
    flex:1;
    width:100%;
    min-width:0;
    height:46px;

    border:1px solid #d8d3c8;
    outline:none;
    border-radius:15px;

    background:#fff;
    color:#222;

    padding:0 15px;
    font-size:15px;
}

.send{
    width:50px;
    height:46px;
    flex-shrink:0;

    border:0;
    border-radius:15px;

    background:#333;
    color:white;

    font-size:20px;
    cursor:pointer;
}

/* =========================
   EMOJI
========================= */

.emoji-panel{
    display:none;

    position:fixed;

    bottom:114px;
    left:10px;

    width:300px;
    max-height:240px;

    overflow-y:auto;

    padding:12px;

    background:#fffdf7;
    border:1px solid #d8d3c8;
    border-radius:18px;

    box-shadow:0 15px 45px rgba(0,0,0,.20);

    z-index:40;
}

.emoji-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:7px;
}

.emoji-item{
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    border-radius:8px;
    padding:4px;
}

/* =========================
   GIF PANEL
========================= */

.gif-panel{
    display:none;

    position:fixed;

    bottom:114px;
    left:60px;

    width:350px;
    max-width:calc(100vw - 20px);

    height:430px;

    background:#fffdf7;
    border:1px solid #d8d3c8;
    border-radius:18px;

    box-shadow:0 15px 45px rgba(0,0,0,.20);

    z-index:40;

    overflow:hidden;
}

.gif-search{
    display:flex;
    gap:7px;
    padding:10px;
    border-bottom:1px solid #ded9cf;
}

.gif-search input{
    flex:1;
    height:40px;

    border:1px solid #d8d3c8;
    outline:none;
    border-radius:10px;

    background:#fff;

    padding:0 12px;
}

.gif-search button{
    width:45px;
    border:0;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.gif-results{
    height:350px;
    overflow-y:auto;

    padding:10px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.gif-result{
    width:100%;
    height:120px;

    object-fit:cover;

    border-radius:10px;

    cursor:pointer;

    background:#eeeae1;
}

.gif-empty{
    grid-column:1/-1;
    text-align:center;
    padding:30px 10px;
    color:#77736b;
    font-size:13px;
}

/* =========================
   SES DURUMU
========================= */

#voiceStatus{
    display:none;

    position:fixed;

    bottom:120px;
    left:50%;

    transform:translateX(-50%);

    background:#fffdf7;

    border:1px solid #d8d3c8;

    color:#333;

    padding:11px 18px;

    border-radius:25px;

    font-size:13px;

    z-index:50;

    box-shadow:0 10px 30px rgba(0,0,0,.20);

    white-space:nowrap;
}

/* =========================
   MASAÜSTÜ
========================= */

@media (min-width:700px){

    .input-area{
        max-width:850px;
        left:50%;
        transform:translateX(-50%);
        border-radius:18px 18px 0 0;
    }

}

/* =========================
   MOBİL
========================= */

@media (max-width:600px){

    .header{
        height:64px;
        min-height:64px;
        padding:6px 7px;
        gap:5px;
    }

    .header-title{
        font-size:13px;
    }

    .online{
        margin-top:2px;
        font-size:10px;
    }

    .online-users{
        max-width:115px;
        font-size:9px;
    }

    .header-buttons{
        gap:3px;
    }

    .voice-button,
    .logout,
    .room-delete{
        min-height:34px;
        padding:6px 7px;
        font-size:9px;
        border-radius:9px;
    }

    .voice-button{
        max-width:83px;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .room-delete{
        max-width:70px;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .chat{
        top:64px;
        padding:
            12px
            9px
            160px;
    }

    .pagination{
        bottom:101px;
        padding:6px;
        gap:4px;
    }

    .page-button{
        min-width:30px;
        height:29px;
        font-size:10px;
    }

    .page-info{
        font-size:9px;
    }

    .input-area{
        height:94px;
        min-height:94px;

        padding:
            6px
            7px
            calc(6px + env(safe-area-inset-bottom));
    }

    .tools-row{
        gap:4px;
        margin-bottom:5px;
        min-height:32px;
    }

    .tool-button,
    .color-main-button{
        width:36px;
        height:32px;
        border-radius:8px;
        font-size:16px;
    }

    .gif-button{
        font-size:10px;
    }

    .image-button{
        font-size:17px;
    }

    .color-button{
        width:20px;
        height:20px;
    }

    .message-input{
        height:42px;
        font-size:14px;
        border-radius:13px;
        padding:0 12px;
    }

    .send{
        width:44px;
        height:42px;
        border-radius:13px;
        font-size:18px;
    }

    .emoji-panel{
        width:calc(100vw - 20px);
        left:10px;
        bottom:104px;
    }

    .gif-panel{
        left:10px;
        bottom:104px;
        width:calc(100vw - 20px);
    }

    #voiceStatus{
        bottom:105px;
        max-width:calc(100vw - 30px);
        overflow:hidden;
        text-overflow:ellipsis;
    }

}

/* =========================
   ÇOK KÜÇÜK TELEFON
========================= */

@media (max-width:380px){

    .header-title{
        font-size:12px;
    }

    .online-users{
        max-width:90px;
    }

    .voice-button{
        max-width:65px;
    }

    .room-delete{
        max-width:58px;
    }

    .logout{
        padding:6px;
    }

    .tool-button,
    .color-main-button{
        width:33px;
    }

}
</style>
</head>

<body>

<!-- =========================
     GİRİŞ
========================= -->

<div id="login">

    <div class="login-box">

        <h1>Ritmix Sohbet</h1>

        <div class="subtitle">
            Sohbete katılmak için kullanıcı adını yaz
        </div>

        <input
            id="usernameInput"
            maxlength="20"
            placeholder="Kullanıcı adın..."
            autocomplete="off"
        >

        <button id="loginButton">
            SOHBETE GİR
        </button>

    </div>

</div>


<!-- =========================
     SOHBET
========================= -->

<div id="chatPage">

    <div class="header">

        <div class="header-info">

            <div class="header-title">
                💬 Ritmix Sohbet
            </div>

            <div class="online" id="onlineText">
                🟢 0 kişi çevrimiçi
            </div>

            <div class="online-users" id="onlineUsersText">
                👥 Kimse yok
            </div>

        </div>


        <div class="header-buttons">

            <button
                class="voice-button"
                id="voiceButton"
            >
                🎤 Sesli Sohbet
            </button>

            <button
                class="room-delete"
                id="roomDeleteButton"
            >
                🗑️ Odayı Sil
            </button>

            <button
                class="logout"
                id="logoutButton"
            >
                Çıkış
            </button>

        </div>

    </div>


    <!-- =========================
         MESAJ ALANI
    ========================= -->

    <div
        class="chat"
        id="chat"
    ></div>


    <!-- =========================
         SAYFALAMA
    ========================= -->

    <div
        class="pagination"
        id="pagination"
    ></div>


    <!-- =========================
         EMOJI
    ========================= -->

    <div
        class="emoji-panel"
        id="emojiPanel"
    >

        <div class="emoji-grid">

            <button class="emoji-item">😀</button>
            <button class="emoji-item">😂</button>
            <button class="emoji-item">🤣</button>
            <button class="emoji-item">😊</button>
            <button class="emoji-item">😍</button>
            <button class="emoji-item">😘</button>
            <button class="emoji-item">🥰</button>
            <button class="emoji-item">😎</button>

            <button class="emoji-item">😢</button>
            <button class="emoji-item">😭</button>
            <button class="emoji-item">😡</button>
            <button class="emoji-item">😱</button>
            <button class="emoji-item">🤔</button>
            <button class="emoji-item">🙄</button>
            <button class="emoji-item">😴</button>
            <button class="emoji-item">🤗</button>

            <button class="emoji-item">❤️</button>
            <button class="emoji-item">🧡</button>
            <button class="emoji-item">💛</button>
            <button class="emoji-item">💚</button>
            <button class="emoji-item">💙</button>
            <button class="emoji-item">💜</button>
            <button class="emoji-item">🖤</button>
            <button class="emoji-item">💔</button>

            <button class="emoji-item">🔥</button>
            <button class="emoji-item">🎉</button>
            <button class="emoji-item">🎊</button>
            <button class="emoji-item">👏</button>
            <button class="emoji-item">👍</button>
            <button class="emoji-item">👎</button>
            <button class="emoji-item">💯</button>
            <button class="emoji-item">✨</button>

            <button class="emoji-item">😉</button>
            <button class="emoji-item">😜</button>
            <button class="emoji-item">😇</button>
            <button class="emoji-item">🥳</button>
            <button class="emoji-item">🤩</button>
            <button class="emoji-item">😏</button>
            <button class="emoji-item">😌</button>
            <button class="emoji-item">🤪</button>

        </div>

    </div>


    <!-- =========================
         GIF
    ========================= -->

    <div
        class="gif-panel"
        id="gifPanel"
    >

        <div class="gif-search">

            <input
                id="gifSearchInput"
                placeholder="GIF ara..."
                autocomplete="off"
            >

            <button id="gifSearchButton">
                🔎
            </button>

        </div>

        <div
            class="gif-results"
            id="gifResults"
        >

            <div class="gif-empty">
                🔎 Bir GIF arayın
            </div>

        </div>

    </div>


    <!-- =========================
         ALT PANEL
    ========================= -->

    <div class="input-area">

        <div class="tools-row">

            <button
                class="tool-button"
                id="emojiButton"
                title="Emoji"
            >
                😀
            </button>


            <button
                class="tool-button gif-button"
                id="gifButton"
                title="GIF"
            >
                GIF
            </button>


            <button
                class="tool-button image-button"
                id="imageButton"
                title="Cihazdan resim veya GIF yükle"
            >
                📷
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*,.gif"
            >


            <!-- RENKLER TEK BUTON -->

            <div class="color-wrapper">

                <button
                    class="color-main-button"
                    id="colorMainButton"
                    title="Yazı rengi"
                >
                    🎨
                </button>

                <div
                    class="color-panel"
                    id="colorPanel"
                >

                    <button
                        class="color-button color-white selected"
                        data-color="#333333"
                        title="Siyah"
                    ></button>

                    <button
                        class="color-button color-pink"
                        data-color="#ff69b4"
                        title="Pembe"
                    ></button>

                    <button
                        class="color-button color-blue"
                        data-color="#2878d4"
                        title="Mavi"
                    ></button>

                    <button
                        class="color-button color-green"
                        data-color="#159957"
                        title="Yeşil"
                    ></button>

                    <button
                        class="color-button color-yellow"
                        data-color="#c99400"
                        title="Sarı"
                    ></button>

                    <button
                        class="color-button color-red"
                        data-color="#e34b5f"
                        title="Kırmızı"
                    ></button>

                </div>

            </div>

        </div>


        <div class="message-row">

            <input
                class="message-input"
                id="messageInput"
                placeholder="Mesajınızı yazın..."
                autocomplete="off"
            >

            <button
                class="send"
                id="sendButton"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- SES DURUMU -->

<div id="voiceStatus">
    🎤 Sesli sistem hazırlanıyor...
</div>

<audio
    id="remoteAudio"
    autoplay
    playsinline
></audio>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:

async function searchGIFs(){

    const query =
        gifSearchInput.value.trim();


    if(!query){

        gifResults.innerHTML =
            '<div class="gif-empty">🔎 Önce GIF adı yazın</div>';

        return;

    }


    gifResults.innerHTML =
        '<div class="gif-empty">⏳ GIF aranıyor...</div>';


    try{

        const url =
            "https://api.giphy.com/v1/gifs/search" +
            "?api_key=" +
            encodeURIComponent(
                GIPHY_API_KEY
            ) +
            "&q=" +
            encodeURIComponent(
                query
            ) +
            "&limit=24" +
            "&rating=pg-13" +
            "&lang=tr";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.data ||
            data.data.length === 0
        ){

            gifResults.innerHTML =
                '<div class="gif-empty">😔 GIF bulunamadı</div>';

            return;

        }


        gifResults.innerHTML = "";


        data.data.forEach(
        function(gif){

            const images =
                gif.images || {};


            const previewUrl =
                images.fixed_width?.webp ||
                images.fixed_width?.url ||
                images.preview_gif?.url ||
                images.original?.url;


            const originalUrl =
                images.original?.url ||
                previewUrl;


            if(!previewUrl){

                return;

            }


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "gif-result";


            image.src =
                previewUrl;


            image.alt =
                gif.title ||
                "GIF";


            image.loading =
                "lazy";


            image.onclick =
            function(){

                sendGIF(
                    previewUrl,
                    originalUrl
                );

                gifPanel.style.display =
                    "none";

            };


            gifResults.appendChild(
                image
            );

        });

    }

    catch(error){

        console.error(
            "GIPHY hatası:",
            error
        );

        gifResults.innerHTML =
            '<div class="gif-empty">❌ GIF yüklenemedi.</div>';

    }

}

/* =========================================================

========================================================= */

function loadMessages(){

    if(messagesListenerStarted){

        return;

    }


    messagesListenerStarted =
        true;


    database
    .ref("messages")
    .orderByChild("timestamp")
    .on(
        "value",
        function(snapshot){

            const previousCount =
                allMessages.length;


            allMessages = [];


            snapshot.forEach(
            function(child){

                const message =
                    child.val();


                if(message){

                    allMessages.push({

                        key:
                            child.key,

                        data:
                            message

                    });

                }

            });


            /*
               En yeni 160 mesajı tut.
            */

            if(
                allMessages.length >
                MAX_MESSAGES
            ){

                pruneOldMessages(
                    allMessages.length -
                    MAX_MESSAGES
                );

            }


            const newCount =
                allMessages.length;


            const oldLastPage =
                Math.max(
                    1,
                    Math.ceil(
                        previousCount /
                        MESSAGES_PER_PAGE
                    )
                );


            const newLastPage =
                Math.max(
                    1,
                    Math.ceil(
                        newCount /
                        MESSAGES_PER_PAGE
                    )
                );


            /*
               Yeni mesaj geldiyse ve kullanıcı
               son sayfadaysa yeni son sayfaya geç.
            */

            if(
                newCount > previousCount &&
                currentPage >= oldLastPage
            ){

                currentPage =
                    newLastPage;

            }


            /*
               Eğer mevcut sayfa artık yoksa
               son sayfaya dön.
            */

            if(
                currentPage >
                newLastPage
            ){

                currentPage =
                    newLastPage;

            }


            renderPagination();

            renderCurrentPage();

            previousMessageCount =
                newCount;

        }
    );

}


/* =========================================================
   ESKİ MESAJLARI TEMİZLE
========================================================= */

function pruneOldMessages(
    amount
){

    if(amount <= 0){

        return;

    }


    const oldMessages =
        allMessages.slice(
            0,
            amount
        );


    const updates = {};


    oldMessages.forEach(
    function(item){

        updates[
            item.key
        ] = null;

    });


    database
    .ref("messages")
    .update(updates)
    .catch(function(error){

        console.error(
            "Eski mesaj temizleme hatası:",
            error
        );

    });

}


/* =========================================================
   SAYFALARI OLUŞTUR
========================================================= */

function renderPagination(){

    const pagination =
        document.getElementById(
            "pagination"
        );


    pagination.innerHTML = "";


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                allMessages.length /
                MESSAGES_PER_PAGE
            )
        );


    /*
       İlk sayfa
    */

    for(
        let page = 1;
        page <= totalPages;
        page++
    ){

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-button";


        if(
            page === currentPage
        ){

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            page;


        button.onclick =
        function(){

            currentPage =
                page;

            renderPagination();

            renderCurrentPage();

        };


        pagination.appendChild(
            button
        );

    }


    const info =
        document.createElement(
            "span"
        );


    info.className =
        "page-info";


    info.textContent =
        totalPages +
        " / " +
        MAX_PAGES;


    pagination.appendChild(
        info
    );

}


/* =========================================================
   MEVCUT SAYFAYI GÖSTER
========================================================= */

function renderCurrentPage(){

    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML = "";


    const start =
        (
            currentPage -
            1
        ) *
        MESSAGES_PER_PAGE;


    const end =
        start +
        MESSAGES_PER_PAGE;


    const pageMessages =
        allMessages.slice(
            start,
            end
        );


    /*
       Mesajlar eski → yeni
       yani yukarıdan aşağıya.
    */

    pageMessages.forEach(
        function(item){

            renderMessage(
                item.key,
                item.data,
                chat
            );

        }
    );


    chat.scrollTop = 0;

}

        time.className =
            "time";


        time.textContent =
            new Date(
                message.timestamp
            ).toLocaleTimeString(
                "tr-TR",
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            );


        user.appendChild(
            time
        );

    }


    /* KENDİ MESAJINI SİL */

    if(
        message.username ===
        username
    ){

        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.className =
            "delete";


        deleteButton.textContent =
            "Sil";


        deleteButton.onclick =
        function(){

            if(
                confirm(
                    "Bu mesajı silmek istiyor musunuz?"
                )
            ){

                database
                .ref(
                    "messages/" +
                    messageKey
                )
                .remove();

            }

        };


        user.appendChild(
            deleteButton
        );

    }


    /* GIPHY GIF */

    if(
        message.type === "gif" &&
        message.gif
    ){

        const gifBox =
            document.createElement(
                "div"
            );


        gifBox.className =
            "gif-message";


        const gifImage =
            document.createElement(
                "img"
            );


        gifImage.src =
            message.gif;


        gifImage.alt =
            "GIF";


        gifImage.onclick =
        function(){

            window.open(
                message.gif,
                "_blank"
            );

        };


        gifBox.appendChild(
            gifImage
        );


        box.appendChild(
            user
        );


        box.appendChild(
            gifBox
        );


        chat.appendChild(
            box
        );


        return;

    }


    /* CİHAZDAN RESİM/GIF */

    if(
        message.type === "image" &&
        message.image
    ){

        const imageBox =
            document.createElement(
                "div"
            );


        imageBox.className =
            "image-message";


        const image =
            document.createElement(
                "img"
            );


        image.src =
            message.image;


        image.alt =
            message.filename ||
            "Resim";


        image.loading =
            "lazy";


        image.onclick =
        function(){

            const newWindow =
                window.open();


            if(newWindow){

                newWindow.document.write(
                    '<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;">' +
                    '<img src="' +
                    message.image +
                    '" style="max-width:100%;max-height:100vh;width:auto;height:auto;">' +
                    '</body></html>'
                );

                newWindow.document.close();

            }

        };


        imageBox.appendChild(
            image
        );


        box.appendChild(
            user
        );


        box.appendChild(
            imageBox
        );


        chat.appendChild(
            box
        );


        return;

    }


    /* NORMAL MESAJ */

    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        message.text ||
        "";


    if(message.color){

        bubble.style.color =
            message.color;

    }


    box.appendChild(
        user
    );


    box.appendChild(
        bubble
    );


    chat.appendChild(
        box
    );

}

            const call =
                snapshot.val();


            const callId =
                snapshot.key;


            if(!call){

                return;

            }


            if(
                call.caller ===
                username
            ){

                return;

            }


            if(
                call.receiver !==
                username
            ){

                return;

            }


            if(
                peerConnections[callId]
            ){

                return;

            }


            if(!voiceActive){

                return;

            }


            try{

                await answerCall(
                    callId,
                    call
                );

            }

            catch(error){

                console.error(
                    error
                );

            }

        }
    );

}


/* =========================================================
   ÇAĞRI OLUŞTUR
========================================================= */

async function createCall(){

    if(!localStream){

        return;

    }


    const usersSnapshot =
        await database
        .ref("onlineUsers")
        .once("value");


    let otherUser =
        null;


    usersSnapshot.forEach(
    function(child){

        const user =
            child.val();


        if(
            user &&
            user.username &&
            user.username !== username &&
            !otherUser
        ){

            otherUser =
                user.username;

        }

    });


    if(!otherUser){

        showVoiceStatus(
            "🎤 Mikrofon açık - başka kullanıcı bekleniyor"
        );

        return;

    }


    const callRef =
        database
        .ref("calls")
        .push();


    const callId =
        callRef.key;


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(function(track){

        pc.addTrack(
            track,
            localStream
        );

    });


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(function(){});


        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };


    pc.onicecandidate =
    function(event){

        if(event.candidate){

            database
            .ref(
                "calls/" +
                callId +
                "/callerCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    const offer =
        await pc.createOffer();


    await pc.setLocalDescription(
        offer
    );


    await callRef.set({

        caller:
            username,

        receiver:
            otherUser,

        offer:{

            type:
                offer.type,

            sdp:
                offer.sdp

        },

        created:
            Date.now()

    });


    database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .on(
        "value",
        async function(snapshot){

            const answer =
                snapshot.val();


            if(
                answer &&
                !pc.currentRemoteDescription
            ){

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        answer
                    )
                );

            }

        }
    );


    database
    .ref(
        "calls/" +
        callId +
        "/receiverCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }

                catch(error){

                    console.log(error);

                }

            }

        }
    );

}


/* =========================================================
   ÇAĞRI CEVAPLA
========================================================= */

async function answerCall(
    callId,
    call
){

    if(
        !localStream ||
        !voiceActive
    ){

        return;

    }


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(function(track){

        pc.addTrack(
            track,
            localStream
        );

    });


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(function(){});


        showVoiceStatus(
            "🔊 Ses bağlantısı aktif"
        );

    };


    pc.onicecandidate =
    function(event){

        if(event.candidate){

            database
            .ref(
                "calls/" +
                callId +
                "/receiverCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    await pc.setRemoteDescription(
        new RTCSessionDescription(
            call.offer
        )
    );


    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    await database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .set({

        type:
            answer.type,

        sdp:
            answer.sdp

    });


    database
    .ref(
        "calls/" +
        callId +
        "/callerCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }

                catch(error){

                    console.log(error);

                }

            }

        }
    );

}


/* =========================================================
   SESİ KAPAT
========================================================= */

function stopVoiceChat(){

    voiceActive =
        false;


    if(localStream){

        localStream
        .getTracks()
        .forEach(function(track){

            track.stop();

        });


        localStream =
            null;

    }


    Object
    .keys(peerConnections)
    .forEach(function(id){

        try{

            peerConnections[id].close();

        }

        catch(error){}

    });


    peerConnections =
        {};


    const audio =
        document.getElementById(
            "remoteAudio"
        );


    audio.srcObject =
        null;


    const button =
        document.getElementById(
            "voiceButton"
        );


    button.textContent =
        "🎤 Sesli Sohbet";


    button.classList.remove(
        "active"
    );


    hideVoiceStatus();


    database
    .ref("calls")
    .once(
        "value",
        function(snapshot){

            snapshot.forEach(
            function(child){

                const call =
                    child.val();


                if(
                    call &&
                    (
                        call.caller ===
                            username ||

                        call.receiver ===
                            username
                    )
                ){

                    child.ref.remove();

                }

            });

        }
    );

}
