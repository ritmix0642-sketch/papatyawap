  <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1117;
    color:white;
}

#login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#1b2130;
    padding:30px 24px;
    border-radius:20px;
    text-align:center;
}

.logo{
    font-size:50px;
}

.login-box h1{
    margin:10px 0;
}

.subtitle{
    color:#9da7ba;
    margin-bottom:25px;
}

#usernameInput{
    width:100%;
    padding:15px;
    border:1px solid #343c4d;
    background:#11151e;
    color:white;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

#loginButton{
    width:100%;
    margin-top:12px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#4d8cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#chatPage{
    display:none;
    height:100vh;
    overflow:hidden;
}

.header{
    height:70px;
    background:#191e29;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #303746;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.online{
    color:#45e889;
    font-size:12px;
    margin-top:4px;
}

.online-users{
    color:#9da7ba;
    font-size:11px;
    margin-top:3px;
}

.logout{
    border:none;
    background:#292f3d;
    color:white;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
}

.chat{
    height:calc(100vh - 135px);
    overflow-y:auto;
    padding:18px 14px;
    max-width:800px;
    margin:auto;
}

.message{
    margin-bottom:16px;
}

.username{
    color:#62b0ff;
    font-size:13px;
    font-weight:bold;
    margin-bottom:4px;
}

.time{
    color:#8b93a3;
    font-size:10px;
    margin-left:6px;
}

.bubble{
    display:inline-block;
    max-width:85%;
    background:#202633;
    padding:11px 13px;
    border-radius:5px 14px 14px 14px;
    word-wrap:break-word;
}

.my-message{
    text-align:right;
}

.my-message .username{
    color:#70e6a0;
}

.my-message .bubble{
    background:#315b9f;
    border-radius:14px 5px 14px 14px;
}

.delete{
    border:0;
    background:transparent;
    color:#ff7070;
    font-size:11px;
    cursor:pointer;
    margin-left:7px;
}

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#191e29;
    border-top:1px solid #303746;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
}

.message-input{
    flex:1;
    height:42px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#272e3b;
    color:white;
    padding:0 12px;
    font-size:15px;
}

.send{
    width:45px;
    height:42px;
    border:none;
    background:#4d8cff;
    color:white;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

@media(min-width:700px){
    .input-area{
        max-width:800px;
        left:50%;
        transform:translateX(-50%);
    }
}
</style>
</head>

<body>

<div id="login">

    <div class="login-box">

        <div class="logo">💬</div>

        <h1>Ritmix Sohbet</h1>

        <div class="subtitle">
            Sohbete katılmak için kullanıcı adını yaz
        </div>

        <input
            id="usernameInput"
            maxlength="20"
            placeholder="Kullanıcı adın..."
            autocomplete="off"
        >

        <button id="loginButton">
            SOHBETE GİR
        </button>

    </div>

</div>

<div id="chatPage">

    <div class="header">

        <div>

            <div class="header-title">
                💬 Ritmix Sohbet
            </div>

            <div
                class="online"
                id="onlineText"
            >
                🟢 0 kişi çevrimiçi
            </div>

            <div
                class="online-users"
                id="onlineUsersText"
            >
                👥 Kimse yok
            </div>

        </div>

        <button
            class="logout"
            id="logoutButton"
        >
            Çıkış
        </button>

    </div>

    <div
        class="chat"
        id="chat"
    ></div>

    <div class="input-area">

        <input
            class="message-input"
            id="messageInput"
            placeholder="Mesaj yaz..."
            autocomplete="off"
        >

        <button
            class="send"
            id="sendButton"
        >
            ➤
        </button>

    </div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDJ9zkgu_2ZLcD_ObEYwnFfSu6QffN9VQI",
    authDomain: "papatyawap.firebaseapp.com",
    databaseURL: "https://papatyawap-cdf7b-default-rtdb.firebaseio.com",
    projectId: "papatyawap",
    storageBucket: "papatyawap.firebasestorage.app",
    messagingSenderId: "29357315689",
    appId: "1:29357315689:web:78864218c204d291f734f8"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

let username = "";
let userKey = "";


/* GİRİŞ */

function enterChat(){

    const input =
        document.getElementById("usernameInput");

    const name =
        input.value.trim();

    if(!name){

        alert("Lütfen kullanıcı adını yaz.");

        input.focus();

        return;
    }

    username = name;

    document.getElementById("login").style.display = "none";

    document.getElementById("chatPage").style.display = "block";

    loadMessages();

    setOnline();
}


/* BUTON */

document.getElementById("loginButton").onclick = enterChat;


/* ENTER */

document.getElementById("usernameInput").onkeydown =
function(event){

    if(event.key === "Enter"){

        enterChat();

    }

};


/* MESAJLAR */

function loadMessages(){

    database
    .ref("messages")
    .on("value",function(snapshot){

        const chat =
            document.getElementById("chat");

        chat.innerHTML = "";

        snapshot.forEach(function(child){

            const message =
                child.val();

            const box =
                document.createElement("div");

            box.className = "message";

            if(message.username === username){

                box.classList.add("my-message");

            }

            const user =
                document.createElement("div");

            user.className = "username";

            user.textContent =
                message.username;

            if(message.timestamp){

                const time =
                    document.createElement("span");

                time.className = "time";

                time.textContent =
                    new Date(
                        message.timestamp
                    ).toLocaleTimeString(
                        "tr-TR",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    );

                user.appendChild(time);
            }


            if(message.username === username){

                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete";

                deleteButton.textContent =
                    "Sil";

                deleteButton.onclick =
                function(){

                    child.ref.remove();

                };

                user.appendChild(
                    deleteButton
                );
            }


            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble";

            bubble.textContent =
                message.text;

            box.appendChild(user);

            box.appendChild(bubble);

            chat.appendChild(box);

        });

        chat.scrollTop =
            chat.scrollHeight;

    });
}


/* MESAJ GÖNDER */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if(!text || !username){

        return;
    }

    database
    .ref("messages")
    .push({

        username:username,

        text:text,

        timestamp:Date.now()

    });

    input.value = "";

    input.focus();
}


document.getElementById(
    "sendButton"
).onclick = sendMessage;


document.getElementById(
    "messageInput"
).onkeydown =
function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

};


/* ÇEVRİMİÇİ */

function setOnline(){

    const ref =
        database
        .ref("onlineUsers")
        .push();

    userKey = ref.key;

    ref.set({

        username:username,

        timestamp:
            firebase.database.ServerValue.TIMESTAMP

    });

    ref.onDisconnect().remove();


    database
    .ref("onlineUsers")
    .on("value",function(snapshot){

        const count =
            snapshot.numChildren();

        document.getElementById(
            "onlineText"
        ).textContent =
            "🟢 " +
            count +
            " kişi çevrimiçi";


        const names = [];

        snapshot.forEach(function(child){

            const user =
                child.val();

            if(user && user.username){

                names.push(user.username);

            }

        });


        document.getElementById(
            "onlineUsersText"
        ).textContent =
            names.length
            ? "👥 " + names.join(", ")
            : "👥 Kimse yok";

    });
}


/* ÇIKIŞ */

document.getElementById(
    "logoutButton"
).onclick =
function(){

    if(userKey){

        database
        .ref(
            "onlineUsers/" +
            userKey
        )
        .remove();

    }

    location.reload();

};

</script>

</body>
</html>
