 <!DOCTYPE html>

<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ritmix Sohbet</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10131b;
    color: white;
}

/* GİRİŞ */

#login {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: #1c2230;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
}

.logo {
    font-size: 50px;
}

.login-box h1 {
    margin: 10px 0;
}

.login-box p {
    color: #9da7ba;
}

.login-box input {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #11151e;
    color: white;
    font-size: 16px;
    outline: none;
}

.login-box button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #4d8cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* SOHBET */

#chatPage {
    display: none;
    height: 100vh;
}

.header {
    min-height: 70px;
    background: #1a1f2b;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #303746;
}

.title {
    font-weight: bold;
    font-size: 18px;
}

.online {
    color: #45e889;
    font-size: 12px;
    margin-top: 4px;
}

.online-users {
    color: #9da7ba;
    font-size: 11px;
    margin-top: 3px;
    max-width: 500px;
}

.logout {
    background: #303746;
    border: 0;
    color: white;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* MESAJ ALANI */

#chat {
    height: calc(100vh - 135px);
    overflow-y: auto;
    padding: 15px;
    max-width: 800px;
    margin: auto;
}

.message {
    margin-bottom: 15px;
}

.usernam
