    const query =
        input.value.trim();


    const results =
        document.getElementById(
            "gifResults"
        );


    if(!query){

        results.innerHTML =
            "<div style='grid-column:1/-1;text-align:center;color:#77819d;padding:20px;'>GIF aramak için bir kelime yaz.</div>";

        return;

    }


    if(
        !GIPHY_API_KEY ||
        GIPHY_API_KEY ===
        "BURAYA_GIPHY_API_KEY"
    ){

        results.innerHTML =
            "<div style='grid-column:1/-1;text-align:center;color:#ff6977;padding:20px;'>Önce GIPHY API anahtarını koda eklemelisin.</div>";

        return;

    }


    results.innerHTML =
        "<div style='grid-column:1/-1;text-align:center;color:#77819d;padding:20px;'>🔍 GIF aranıyor...</div>";


    try{

        const url =
            "https://api.giphy.com/v1/gifs/search" +
            "?api_key=" +
            encodeURIComponent(
                GIPHY_API_KEY
            ) +
            "&q=" +
            encodeURIComponent(
                query
            ) +
            "&limit=18" +
            "&rating=g" +
            "&lang=tr";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "GIPHY API hatası: " +
                response.status
            );

        }


        const data =
            await response.json();


        results.innerHTML = "";


        if(
            !data.data ||
            !data.data.length
        ){

            results.innerHTML =
                "<div style='grid-column:1/-1;text-align:center;color:#77819d;padding:20px;'>😕 GIF bulunamadı.</div>";

            return;

        }


        data.data.forEach(
            function(gif){

                const image =
                    document.createElement(
                        "img"
                    );


                image.className =
                    "gif-result";


                const imageUrl =
                    gif.images &&
                    gif.images.fixed_width &&
                    gif.images.fixed_width.url;


                const originalUrl =
                    gif.images &&
                    gif.images.original &&
                    gif.images.original.url;


                if(!imageUrl){

                    return;

                }


                image.src =
                    imageUrl;


                image.loading =
                    "lazy";


                image.alt =
                    gif.title || "GIF";


                image.onclick =
                function(){

                    sendGIF(
                        originalUrl ||
                        imageUrl
                    );

                };


                results.appendChild(
                    image
                );

            }
        );

    }
    catch(error){

        console.error(
            "GIF arama hatası:",
            error
        );


        results.innerHTML =
            "<div style='grid-column:1/-1;text-align:center;color:#ff6977;padding:20px;'>GIF aranırken hata oluştu.</div>";

    }

}

/* =====================================================
   MESAJLARI YÜKLE
===================================================== */

function loadMessages(){

    database
    .ref("messages")
    .on(
        "value",
        function(snapshot){

            const chat =
                document.getElementById(
                    "chat"
                );


            chat.innerHTML = "";


            snapshot.forEach(
                function(child){

                    const message =
                        child.val();


                    if(!message){

                        return;

                    }


                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "message";


                    if(
                        message.username
                        === username
                    ){

                        box.classList.add(
                            "my-message"
                        );

                    }


                    /* KULLANICI ADI */

                    const user =
                        document.createElement(
                            "div"
                        );


                    user.className =
                        "username";


                    user.textContent =
                        message.username;


                    /* SAAT */

                    if(message.timestamp){

                        const time =
                            document.createElement(
                                "span"
                            );


                        time.className =
                            "time";


                        time.textContent =
                            new Date(
                                message.timestamp
                            ).toLocaleTimeString(
                                "tr-TR",
                                {
                                    hour:"2-digit",
                                    minute:"2-digit"
                                }
                            );


                        user.appendChild(
                            time
                        );

                    }


                    /* SİL */

                    if(
                        message.username
                        === username
                    ){

                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.className =
                            "delete";


                        deleteButton.textContent =
                            "Sil";


                        deleteButton.onclick =
                        function(){

                            child.ref.remove();

                        };


                        user.appendChild(
                            deleteButton
                        );

                    }


                    /* MESAJ KUTUSU */

                    const bubble =
                        document.createElement(
                            "div"
                        );


                    bubble.className =
                        "bubble";


                    /* =====================
                       GIF MESAJI
                    ===================== */

                    if(
                        message.type === "gif" &&
                        message.gif
                    ){

                        const gifImage =
                            document.createElement(
                                "img"
                            );


                        gifImage.className =
                            "chat-gif";


                        gifImage.src =
                            message.gif;


                        gifImage.alt =
                            "GIF";


                        gifImage.loading =
                            "lazy";


                        gifImage.onclick =
                        function(){

                            window.open(
                                message.gif,
                                "_blank"
                            );

                        };


                        bubble.appendChild(
                            gifImage
                        );

                    }

                    /* =====================
                       NORMAL MESAJ
                    ===================== */

                    else{

                        bubble.textContent =
                            message.text || "";

                    }


                    /* RENK */

                    if(message.color){

                        bubble.style.color =
                            message.color;

                    }


                    box.appendChild(
                        user
                    );


                    box.appendChild(
                        bubble
                    );


                    chat.appendChild(
                        box
                    );

                }
            );


            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}

async function startVoiceChat(){

    try{

        showVoiceStatus(
            "🎤 Mikrofon açılıyor..."
        );


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:true,

                video:false

            });


        voiceActive =
            true;


        const button =
            document.getElementById(
                "voiceButton"
            );


        button.textContent =
            "🔴 Sesi Kapat";


        button.classList.add(
            "active"
        );


        startVoiceListener();


        showVoiceStatus(
            "🎤 Sesli sohbet aktif"
        );


        const callsSnapshot =
            await database
            .ref("calls")
            .once("value");


        let foundCall =
            false;


        callsSnapshot.forEach(
            function(child){

                const call =
                    child.val();


                if(
                    call &&
                    call.receiver === username
                ){

                    foundCall =
                        true;


                    answerCall(
                        child.key,
                        call
                    );

                }

            }
        );


        if(!foundCall){

            await createCall();

        }

    }
    catch(error){

        console.error(
            "Mikrofon hatası:",
            error
        );


        alert(
            "Mikrofon açılamadı:\n\n" +
            error.name +
            "\n" +
            error.message
        );

    }

}

function startVoiceListener(){

    if(voiceListenerStarted){

        return;

    }


    voiceListenerStarted =
        true;


    database
    .ref("calls")
    .on(
        "child_added",
        async function(snapshot){

            const call =
                snapshot.val();


            const callId =
                snapshot.key;


            if(!call){

                return;

            }


            if(
                call.caller === username
            ){

                return;

            }


            if(
                call.receiver !== username
            ){

                return;

            }


            if(
                peerConnections[callId]
            ){

                return;

            }


            if(!voiceActive){

                return;

            }


            await answerCall(
                callId,
                call
            );

        }
    );

}


/* =====================================================
   ÇAĞRI BAŞLAT
===================================================== */

async function createCall(){

    if(!localStream){

        return;

    }


    const usersSnapshot =
        await database
        .ref("onlineUsers")
        .once("value");


    let otherUser =
        null;


    usersSnapshot.forEach(
        function(child){

            const user =
                child.val();


            if(
                user &&
                user.username &&
                user.username !== username &&
                !otherUser
            ){

                otherUser =
                    user.username;

            }

        }
    );


    if(!otherUser){

        showVoiceStatus(
            "🎤 Mikrofon açık - başka kullanıcı bekleniyor"
        );

        return;

    }


    const callRef =
        database
        .ref("calls")
        .push();


    const callId =
        callRef.key;


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(
        function(track){

            pc.addTrack(
                track,
                localStream
            );

        }
    );


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(
            function(error){

                console.log(
                    "Audio play:",
                    error
                );

            }
        );


        showVoiceStatus(
            "🔊 Ses bağlantısı kuruldu"
        );

    };


    pc.onicecandidate =
    function(event){

        if(
            event.candidate
        ){

            database
            .ref(
                "calls/" +
                callId +
                "/callerCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    const offer =
        await pc.createOffer();


    await pc.setLocalDescription(
        offer
    );


    await callRef.set({

        caller:
            username,

        receiver:
            otherUser,

        offer:{

            type:
                offer.type,

            sdp:
                offer.sdp

        },

        created:
            Date.now()

    });


    database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .on(
        "value",
        async function(snapshot){

            const answer =
                snapshot.val();


            if(
                answer &&
                !pc.currentRemoteDescription
            ){

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        answer
                    )
                );

            }

        }
    );


    database
    .ref(
        "calls/" +
        callId +
        "/receiverCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }
                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =====================================================
   ÇAĞRIYI CEVAPLA
===================================================== */

async function answerCall(
    callId,
    call
){

    if(
        !localStream ||
        !voiceActive
    ){

        return;

    }


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnections[callId] =
        pc;


    localStream
    .getTracks()
    .forEach(
        function(track){

            pc.addTrack(
                track,
                localStream
            );

        }
    );


    pc.ontrack =
    function(event){

        const audio =
            document.getElementById(
                "remoteAudio"
            );


        audio.srcObject =
            event.streams[0];


        audio.play()
        .catch(
            function(error){

                console.log(
                    error
                );

            }
        );


        showVoiceStatus(
            "🔊 Ses bağlantısı kuruldu"
        );

    };


    pc.onicecandidate =
    function(event){

        if(
            event.candidate
        ){

            database
            .ref(
                "calls/" +
                callId +
                "/receiverCandidates"
            )
            .push(
                event.candidate.toJSON()
            );

        }

    };


    await pc.setRemoteDescription(
        new RTCSessionDescription(
            call.offer
        )
    );


    const answer =
        await pc.createAnswer();


    await pc.setLocalDescription(
        answer
    );


    await database
    .ref(
        "calls/" +
        callId +
        "/answer"
    )
    .set({

        type:
            answer.type,

        sdp:
            answer.sdp

    });


    database
    .ref(
        "calls/" +
        callId +
        "/callerCandidates"
    )
    .on(
        "child_added",
        async function(snapshot){

            const candidate =
                snapshot.val();


            if(candidate){

                try{

                    await pc.addIceCandidate(
                        new RTCIceCandidate(
                            candidate
                        )
                    );

                }
                catch(error){

                    console.log(
                        error
                    );

                }

            }

        }
    );

}


/* =====================================================
   SESLİ SOHBETİ KAPAT
===================================================== */

function stopVoiceChat(){

    voiceActive =
        false;


    if(localStream){

        localStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


        localStream =
            null;

    }


    Object.keys(
        peerConnections
    ).forEach(
        function(id){

            try{

                peerConnections[id].close();

            }
            catch(error){

                console.log(
                    error
                );

            }

        }
    );


    peerConnections = {};


    const audio =
        document.getElementById(
            "remoteAudio"
        );


    audio.srcObject =
        null;


    const button =
        document.getElementById(
            "voiceButton"
        );


    button.textContent =
        "🎤 Sesli Sohbet";


    button.classList.remove(
        "active"
    );


    hideVoiceStatus();


    database
    .ref("calls")
    .once(
        "value",
        function(snapshot){

            snapshot.forEach(
                function(child){

                    const call =
                        child.val();


                    if(
                        call &&
                        (
                            call.caller === username ||
                            call.receiver === username
                        )
                    ){

                        child.ref.remove();

                    }

                }
            );

        }
    );

}
